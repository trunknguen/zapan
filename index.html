const generateKanaList = () => {
  const list = [];
  ['hiragana','katakana'].forEach(alp => {
    ['main','dakuten','combination'].forEach(cat => {
      if(KANA_DEF[alp][cat]) KANA_DEF[alp][cat].forEach(g => {
        g.items.forEach(item => list.push({ id:`${alp}_${item.q}`, alphabet:alp, category:cat, groupId:g.id, question:item.q, answer:item.a, mistakeCount:0 }));
      });
    });
  });
  return list;
};

const speakKana = (text, on) => {
  if(!on || !('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text); u.lang='ja-JP'; u.rate=1.0; u.pitch=1.1;
  window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
};

  while(i < str.length) {
    if(i+2 < str.length && ROMAJI_TO_HIRA[str.slice(i, i+3)]) { res += ROMAJI_TO_HIRA[str.slice(i, i+3)]; i+=3; continue; }
    if(i+1 < str.length && ROMAJI_TO_HIRA[str.slice(i, i+2)]) { res += ROMAJI_TO_HIRA[str.slice(i, i+2)]; i+=2; continue; }
    if(ROMAJI_TO_HIRA[str.slice(i, i+1)]) { res += ROMAJI_TO_HIRA[str.slice(i, i+1)]; i+=1; continue; }
    if(i+1 < str.length && str[i] === str[i+1] && str[i] !== 'n') { res += 'っ'; i+=1; continue; }
    res += str[i]; i+=1;
  }
  return res;
};

const checkAns = (val, kana) => {
  if(!kana || !val) return false;
  const valNorm = val.toLowerCase().trim();
  if(valNorm === kana.question) return true;
  const answers = Array.isArray(kana.answer) ? kana.answer : [kana.answer];
  if(answers.includes(valNorm)) return true;
  for(const ans of answers) {
    if(valNorm === convertRomajiToHiragana(ans)) return true;
  }
  return false;
};

function App() {
  const [settings, setSettings] = React.useState(() => {
    const s = localStorage.getItem(SETTINGS_KEY);
    if(s) { const p=JSON.parse(s); if(!p.lang) p.lang='vi'; return p; }
    return { isDark: window.matchMedia('(prefers-color-scheme: dark)').matches, isSound: false, lang: 'vi' };
  });
  const t = T[settings.lang] || T.vi;
  React.useEffect(() => {
    settings.isDark ? document.documentElement.classList.add('dark') : document.documentElement.classList.remove('dark');
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
  }, [settings]);
  const toggleTheme = () => setSettings(s => ({...s, isDark:!s.isDark}));
  const toggleSound = () => setSettings(s => ({...s, isSound:!s.isSound}));
  const toggleLang = () => setSettings(s => ({...s, lang:s.lang==='vi'?'en':'vi'}));

  const [kanaData, setKanaData] = React.useState(() => {
    const sd = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('kana_weakness_data');
    if(sd) { try { const p=JSON.parse(sd); return defaultKanaData.map(d=>{const m=p.find(k=>k.question===d.question); return m?{...d,mistakeCount:m.mistakeCount}:d;}); } catch(e){} }
    return defaultKanaData;
  });
  React.useEffect(() => { localStorage.setItem(STORAGE_KEY, JSON.stringify(kanaData)); }, [kanaData]);

  const [vocabData, setVocabData] = React.useState(() => {
    const sd = localStorage.getItem('vocab_data_v1');
    if(sd) { try { const p=JSON.parse(sd); return defaultVocabData.map(d=>{const m=p.find(k=>k.id===d.id); return m?{...d,mistakeCount:m.mistakeCount}:d;}); } catch(e){} }
    return defaultVocabData;
  });
  React.useEffect(() => { localStorage.setItem('vocab_data_v1', JSON.stringify(vocabData)); }, [vocabData]);

  const [kanjiData, setKanjiData] = React.useState(() => {
    const sd = localStorage.getItem('kanji_data_v1');
    if(sd) { try { const p=JSON.parse(sd); return defaultKanjiData.map(d=>{const m=p.find(k=>k.id===d.id); return m?{...d,mistakeCount:m.mistakeCount}:d;}); } catch(e){} }
    return defaultKanjiData;
  });
  React.useEffect(() => { localStorage.setItem('kanji_data_v1', JSON.stringify(kanjiData)); }, [kanjiData]);

  const [appState, setAppState] = React.useState('menu');
  const [studyMode, setStudyMode] = React.useState('kana');
  const [selectedAlphabet, setSelectedAlphabet] = React.useState('hiragana');
  const [selectedGroups, setSelectedGroups] = React.useState({ hiragana: [], katakana: [] });
  const [selectedVocabGroups, setSelectedVocabGroups] = React.useState([]);
  const [selectedKanjiGroups, setSelectedKanjiGroups] = React.useState([]);

  const activeKanaList = React.useMemo(() => {
    if(studyMode==='vocab') return vocabData.filter(k => selectedVocabGroups.includes(k.groupId));
    if(studyMode==='kanji') return kanjiData.filter(k => selectedKanjiGroups.includes(k.groupId));
    const g = selectedGroups[selectedAlphabet]||[];
    return kanaData.filter(k => k.alphabet===selectedAlphabet && g.includes(k.groupId));
  }, [studyMode, kanaData, vocabData, kanjiData, selectedAlphabet, selectedGroups, selectedVocabGroups, selectedKanjiGroups]);

  // Unified data setter based on study mode
  const setActiveData = (updater) => {
    if(studyMode==='vocab') setVocabData(updater);
    else if(studyMode==='kanji') setKanjiData(updater);
    else setKanaData(updater);
  };

  // RANDOM QUIZ STATE
  const [practiceMode, setPracticeMode] = React.useState('normal');
  const [currentIndex, setCurrentIndex] = React.useState(0);
  const [inputValue, setInputValue] = React.useState('');
  const [status, setStatus] = React.useState('idle');
  const [correctCount, setCorrectCount] = React.useState(0);
  const [showStrokeOrder, setShowStrokeOrder] = React.useState(false);
  const [showVirtualKb, setShowVirtualKb] = React.useState(false);
  const [isDrawingMode, setIsDrawingMode] = React.useState(false);
  const [drawingChecked, setDrawingChecked] = React.useState(false);
  const [isDrawing, setIsDrawing] = React.useState(false);
  const canvasRef = React.useRef(null);
  const inputRef = React.useRef('');
  const statusRef = React.useRef('idle');
  const currentKanaRef = React.useRef(null);

  // TIME ATTACK STATE
  const [taScore, setTaScore] = React.useState(0);
  const [taTimeLeft, setTaTimeLeft] = React.useState(60);
  const [taRunning, setTaRunning] = React.useState(false);
  const [taFinished, setTaFinished] = React.useState(false);
  const [taHighScore, setTaHighScore] = React.useState(()=>parseInt(localStorage.getItem(HIGHSCORE_KEY))||0);
  const [taInputValue, setTaInputValue] = React.useState('');
  const [taStatus, setTaStatus] = React.useState('idle');
  const [taCurrentIdx, setTaCurrentIdx] = React.useState(0);
  const [showConfetti, setShowConfetti] = React.useState(false);
  const taInputRef = React.useRef('');
  const taStatusRef = React.useRef('idle');
  const taScoreRef = React.useRef(0);

  // FILL ALL STATE
  const [fillCheckMode, setFillCheckMode] = React.useState('instant');
  const [fillAnswers, setFillAnswers] = React.useState({});
  const [fillResults, setFillResults] = React.useState({});
  const [focusedCardIdx, setFocusedCardIdx] = React.useState(0);
  const [fillFinished, setFillFinished] = React.useState(false);
  const [shuffledFillList, setShuffledFillList] = React.useState([]);
  const fillAnswersRef = React.useRef({});
  const focusedCardIdxRef = React.useRef(0);

  // Fisher-Yates shuffle
  const shuffle = (arr) => { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

  const mistakesPool = activeKanaList.filter(k=>k.mistakeCount>0);
  const activeQuizData = practiceMode==='practice_mistakes'&&mistakesPool.length>0 ? mistakesPool : activeKanaList;
  let currentKana = activeQuizData.length>0 ? (activeQuizData[currentIndex]||activeQuizData[0]) : null;

  React.useEffect(() => { currentKanaRef.current = currentKana; });
  React.useEffect(() => { statusRef.current = status; }, [status]);
  React.useEffect(() => { inputRef.current = inputValue; }, [inputValue]);
  React.useEffect(() => { fillAnswersRef.current = fillAnswers; }, [fillAnswers]);
  React.useEffect(() => { focusedCardIdxRef.current = focusedCardIdx; }, [focusedCardIdx]);

  const goalCount = activeKanaList.length;
  const progressPercent = Math.min((correctCount/Math.max(goalCount,1))*100,100);

  React.useEffect(() => { if(appState==='quiz'&&status==='idle'&&currentKana) speakKana(currentKana.question,settings.isSound); }, [currentIndex,appState,practiceMode,status]);
  React.useEffect(() => { if(practiceMode==='practice_mistakes'&&mistakesPool.length===0) setPracticeMode('normal'); }, [mistakesPool.length]);
  React.useEffect(() => { setShowStrokeOrder(false); }, [currentIndex, appState]);

  const toggleGroup = (gid) => { const c=selectedGroups[selectedAlphabet]; setSelectedGroups({...selectedGroups,[selectedAlphabet]:c.includes(gid)?c.filter(i=>i!==gid):[...c,gid]}); };
  const toggleAllCategory = (cat) => { const cg=KANA_DEF[selectedAlphabet][cat].map(g=>g.id); const c=selectedGroups[selectedAlphabet]; const all=cg.every(i=>c.includes(i)); setSelectedGroups({...selectedGroups,[selectedAlphabet]:all?c.filter(i=>!cg.includes(i)):Array.from(new Set([...c,...cg]))}); };
  const toggleAllKana = () => { const ag=[]; ['main','dakuten','combination'].forEach(c=>KANA_DEF[selectedAlphabet][c].forEach(g=>ag.push(g.id))); const c=selectedGroups[selectedAlphabet]; setSelectedGroups({...selectedGroups,[selectedAlphabet]:c.length===ag.length?[]:ag}); };
  const isAllSelected = () => { let t=0; ['main','dakuten','combination'].forEach(c=>t+=KANA_DEF[selectedAlphabet][c].length); return selectedGroups[selectedAlphabet].length===t; };
  const isCategorySelected = (cat) => { const cg=KANA_DEF[selectedAlphabet][cat].map(g=>g.id); return cg.length>0&&cg.every(i=>selectedGroups[selectedAlphabet].includes(i)); };

  const genNext = (pool) => { if(!pool||pool.length===0) return 0; let n; do{n=Math.floor(Math.random()*pool.length)}while(n===currentIndex&&pool.length>1); return n; };

  const genWeightedNext = (pool, curIdx) => {
    if(!pool||pool.length===0) return 0;
    if(pool.length===1) return 0;
    const weights = pool.map(k => 1 + (k.mistakeCount||0) * 3);
    const total = weights.reduce((a,b) => a+b, 0);
    let attempts = 0;
    while(attempts < 20) {
      let r = Math.random() * total, acc = 0;
      for(let i=0; i<pool.length; i++) { acc += weights[i]; if(r <= acc) { if(i !== curIdx || pool.length === 1) return i; break; } }
      attempts++;
    }
    return genNext(pool);
  };

  const handleVirtualKey = (char) => {
    if (statusRef.current !== 'idle') return;
    const kana = currentKanaRef.current; if (!kana) return;
    const nv = inputRef.current + char;
    setInputValue(nv); inputRef.current = nv;
    if(checkAns(nv, kana)) setTimeout(()=>handleCorrectRandom(),0);
  };
  const handleVirtualBackspace = () => {
    if (statusRef.current !== 'idle') return;
    const nv = inputRef.current.slice(0, -1);
    setInputValue(nv); inputRef.current = nv;
  };

  const clearCanvas = () => { if(!canvasRef.current) return; const ctx=canvasRef.current.getContext('2d'); ctx.clearRect(0,0,canvasRef.current.width,canvasRef.current.height); };
  const startDrawingCanvas = (e) => { if(drawingChecked) return; setIsDrawing(true); const ctx=canvasRef.current.getContext('2d'); const rect=canvasRef.current.getBoundingClientRect(); const x=(e.clientX||(e.touches&&e.touches[0].clientX))-rect.left; const y=(e.clientY||(e.touches&&e.touches[0].clientY))-rect.top; ctx.beginPath(); ctx.moveTo(x,y); };
  const drawCanvas = (e) => { if(!isDrawing||drawingChecked) return; const ctx=canvasRef.current.getContext('2d'); const rect=canvasRef.current.getBoundingClientRect(); const x=(e.clientX||(e.touches&&e.touches[0].clientX))-rect.left; const y=(e.clientY||(e.touches&&e.touches[0].clientY))-rect.top; ctx.lineTo(x,y); ctx.strokeStyle=settings.isDark?'#e2e8f0':'#334155'; ctx.lineWidth=8; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.stroke(); };
  const stopDrawingCanvas = () => setIsDrawing(false);

  const startRandomQuiz = () => {
    if(activeKanaList.length===0){alert("Chon it nhat 1 hang Kana!");return;}
    setCorrectCount(0); setPracticeMode('normal'); setInputValue(''); setStatus('idle'); setDrawingChecked(false); clearCanvas();
    setCurrentIndex(genWeightedNext(activeKanaList, -1)); setAppState('quiz');
  };
  const startTimeAttack = () => {
    if(activeKanaList.length===0){alert("Chon it nhat 1 hang Kana!");return;}
    setTaScore(0); taScoreRef.current=0; setTaTimeLeft(60); setTaRunning(true); setTaFinished(false);
    setTaInputValue(''); taInputRef.current=''; setTaStatus('idle'); taStatusRef.current='idle';
    setTaCurrentIdx(Math.floor(Math.random()*activeKanaList.length)); setShowConfetti(false); setAppState('timeattack');
  };
  const startFillAll = () => {
    if(activeKanaList.length===0){alert("Hãy chọn ít nhất một hàng Kana!");return;}
    setShuffledFillList(shuffle(activeKanaList));
    setFillAnswers({}); setFillResults({}); setFocusedCardIdx(0); setFillFinished(false); setAppState('fill');
  };

  const handleCorrectRandom = () => {
    setStatus('correct'); setCorrectCount(p=>p+1);
    let pool=activeQuizData;
    if(currentKana&&currentKana.mistakeCount>0){ const nd=kanaData.map(k=>k.id===currentKana.id?{...k,mistakeCount:k.mistakeCount-1}:k); setActiveData(nd); const nl=nd.filter(k=>k.alphabet===selectedAlphabet&&selectedGroups[selectedAlphabet].includes(k.groupId)); pool=practiceMode==='practice_mistakes'?nl.filter(k=>k.mistakeCount>0):nl; }
    setTimeout(()=>{ setInputValue(''); setDrawingChecked(false); clearCanvas(); if(practiceMode==='practice_mistakes'&&pool.length===0)setPracticeMode('normal'); else setCurrentIndex(genWeightedNext(pool, currentIndex)); setStatus('idle'); },250);
  };
  const handleErrorRandom = () => {
    setStatus('error'); if(currentKana) speakKana(currentKana.question,settings.isSound);
    if(currentKana){ setActiveData(kanaData.map(k=>k.id===currentKana.id?{...k,mistakeCount:k.mistakeCount+1}:k)); }
    setTimeout(()=>{setStatus('idle');setInputValue('');setDrawingChecked(false);clearCanvas();},400);
  };

  // RANDOM QUIZ KEYDOWN
  React.useEffect(() => {
    if(appState!=='quiz') return;
    const handler = (e) => {
      if(statusRef.current!=='idle') return;
      const kana=currentKanaRef.current; if(!kana) return;
      if(e.key==='Backspace'){e.preventDefault(); setInputValue(p=>{const v=p.slice(0,-1);inputRef.current=v;return v;}); return;}
      if(e.key==='Enter'){e.preventDefault(); if(inputRef.current.length>0&&!checkAns(inputRef.current,kana)) handleErrorRandom(); return;}
      if(e.key.length===1&&/^[a-zA-Z]$/.test(e.key)){e.preventDefault();e.stopPropagation(); const l=e.key.toLowerCase(); setInputValue(p=>{const v=p+l;inputRef.current=v;if(checkAns(v,kana))setTimeout(()=>handleCorrectRandom(),0);return v;});}
    };
    document.addEventListener('keydown',handler,true);
    return ()=>document.removeEventListener('keydown',handler,true);
  }, [appState,currentKana,kanaData,practiceMode,selectedAlphabet,selectedGroups,settings.isSound]);

  // --- TIME ATTACK TIMER ---
  React.useEffect(() => {
    if(appState!=='timeattack'||!taRunning) return;
    if(taTimeLeft<=0){ setTaRunning(false); setTaFinished(true);
      const score = taScoreRef.current;
      if(score > taHighScore) { setTaHighScore(score); localStorage.setItem(HIGHSCORE_KEY, score.toString()); setShowConfetti(true); setTimeout(()=>setShowConfetti(false),4000); }
      return;
    }
    const t = setTimeout(()=>setTaTimeLeft(p=>p-1),1000);
    return ()=>clearTimeout(t);
  },[appState,taRunning,taTimeLeft]);

  // TIME ATTACK KEYDOWN
  React.useEffect(() => {
    if(appState!=='timeattack'||!taRunning) return;
    const handler = (e) => {
      if(taStatusRef.current!=='idle') return;
      const kana = activeKanaList[taCurrentIdx]; if(!kana) return;
      if(e.key==='Backspace'){e.preventDefault(); setTaInputValue(p=>{const v=p.slice(0,-1);taInputRef.current=v;return v;}); return;}
      if(e.key==='Enter'){e.preventDefault();
        if(taInputRef.current.length>0&&!checkAns(taInputRef.current,kana)){
          setTaStatus('error'); taStatusRef.current='error';
          setActiveData(d=>d.map(k=>k.id===kana.id?{...k,mistakeCount:k.mistakeCount+1}:k));
          setTimeout(()=>{setTaStatus('idle');taStatusRef.current='idle';setTaInputValue('');taInputRef.current='';},300);
        }
        return;
      }
      if(e.key.length===1&&/^[a-zA-Z]$/.test(e.key)){
        e.preventDefault();e.stopPropagation();
        const nv=taInputRef.current+e.key.toLowerCase();
        setTaInputValue(nv); taInputRef.current=nv;
        if(checkAns(nv,kana)){
          setTaStatus('correct'); taStatusRef.current='correct';
          setTaScore(p=>{const ns=p+1;taScoreRef.current=ns;return ns;});
          if(kana.mistakeCount>0) setActiveData(d=>d.map(k=>k.id===kana.id?{...k,mistakeCount:Math.max(0,k.mistakeCount-1)}:k));
          speakKana(kana.question,settings.isSound);
          setTimeout(()=>{
            setTaInputValue('');taInputRef.current='';
            setTaCurrentIdx(genWeightedNext(activeKanaList,taCurrentIdx));
            setTaStatus('idle');taStatusRef.current='idle';
          },200);
        }
      }
    };
    document.addEventListener('keydown',handler,true);
    return ()=>document.removeEventListener('keydown',handler,true);
  },[appState,taRunning,activeKanaList,taCurrentIdx,settings.isSound]);

  // HIDDEN INPUT FOR MOBILE KEYBOARD
  const mobileInputRef = React.useRef(null);
  const focusMobileInput = () => { if(mobileInputRef.current) mobileInputRef.current.focus(); };
  const handleMobileInput = (e) => {
    const val = e.target.value;
    e.target.value = '';
    if(!val) return;
    const chars = val.toLowerCase().replace(/[^a-z]/g,'');
    for(const ch of chars){
      document.dispatchEvent(new KeyboardEvent('keydown',{key:ch,bubbles:true}));
    }
  };

  const togglePracticeMode = () => {
    if(practiceMode==='normal'&&mistakesPool.length>0){setPracticeMode('practice_mistakes');setCurrentIndex(genNext(mistakesPool));setStatus('idle');setInputValue('');}
    else{setPracticeMode('normal');setCurrentIndex(genNext(activeKanaList));setStatus('idle');setInputValue('');}
  };

  // Auto-check a card when leaving it (instant mode)
  const autoCheckCard = (idx) => {
    if(fillCheckMode!=='instant') return;
    const kana = shuffledFillList[idx]; if(!kana) return;
    const val = fillAnswersRef.current[kana.id]||'';
    const res = fillResults[kana.id];
    if(res==='correct'||res==='wrong') return; // already checked
    if(val.length===0) return; // empty, skip
    if(checkAns(val,kana)){
      setFillResults(r=>({...r,[kana.id]:'correct'}));
      if(kana.mistakeCount>0) setActiveData(d=>d.map(k=>k.id===kana.id?{...k,mistakeCount:Math.max(0,k.mistakeCount-1)}:k));
      speakKana(kana.question,settings.isSound);
    } else {
      setFillResults(r=>({...r,[kana.id]:'wrong'}));
      setActiveData(d=>d.map(k=>k.id===kana.id?{...k,mistakeCount:k.mistakeCount+1}:k));
    }
  };

  const moveFocusTo = (newIdx) => {
    const oldIdx = focusedCardIdxRef.current;
    autoCheckCard(oldIdx);
    setFocusedCardIdx(newIdx); focusedCardIdxRef.current=newIdx;
  };

  // FILL ALL KEYDOWN
  React.useEffect(() => {
    if(appState!=='fill'||fillFinished) return;
    const handler = (e) => {
      const idx = focusedCardIdxRef.current;
      const kana = shuffledFillList[idx]; if(!kana) return;
      const ans = fillAnswersRef.current;
      const curVal = ans[kana.id]||'';
      const res = fillResults[kana.id];
      // If card already resolved, allow navigation only
      if(fillCheckMode==='instant' && (res==='correct'||res==='wrong')) {
        if(e.key==='Tab'||e.key==='Enter'){e.preventDefault();const ni=e.shiftKey?Math.max(0,idx-1):Math.min(idx+1,shuffledFillList.length-1);moveFocusTo(ni);}
        return;
      }
      if(e.key==='Backspace'){e.preventDefault();
        // If card was wrong, clear result to let user retry
        if(fillCheckMode==='instant'&&res==='wrong') setFillResults(r=>({...r,[kana.id]:null}));
        const nv=curVal.slice(0,-1);const na={...ans,[kana.id]:nv};setFillAnswers(na);fillAnswersRef.current=na;return;
      }
      if(e.key==='Tab'){e.preventDefault();const ni=e.shiftKey?Math.max(0,idx-1):Math.min(idx+1,shuffledFillList.length-1);moveFocusTo(ni);return;}
      if(e.key==='Enter'){
        e.preventDefault();
        if(fillCheckMode==='instant') { autoCheckCard(idx); const ni=Math.min(idx+1,shuffledFillList.length-1); setTimeout(()=>moveFocusTo(ni),200); }
        return;
      }
      if(e.key.length===1&&/^[a-zA-Z]$/.test(e.key)){
        e.preventDefault();e.stopPropagation();
        // Clear wrong state if retrying
        if(fillCheckMode==='instant'&&res==='wrong') setFillResults(r=>({...r,[kana.id]:null}));
        const nv=curVal+e.key.toLowerCase();
        const na={...ans,[kana.id]:nv};setFillAnswers(na);fillAnswersRef.current=na;
      }
    };
    document.addEventListener('keydown',handler,true);
    return ()=>document.removeEventListener('keydown',handler,true);
  }, [appState,fillCheckMode,fillFinished,shuffledFillList,fillResults,settings.isSound]);

  const handleFinishAll = () => {
    const results = {};
    shuffledFillList.forEach(kana => {
      const val = fillAnswers[kana.id]||'';
      if(checkAns(val,kana)) { results[kana.id]='correct'; if(kana.mistakeCount>0) setActiveData(d=>d.map(k=>k.id===kana.id?{...k,mistakeCount:Math.max(0,k.mistakeCount-1)}:k)); }
      else { results[kana.id]='wrong'; setActiveData(d=>d.map(k=>k.id===kana.id?{...k,mistakeCount:k.mistakeCount+1}:k)); }
    });
    setFillResults(results); setFillFinished(true);
  };

  const backToMenu = () => { setAppState('menu'); if('speechSynthesis' in window) window.speechSynthesis.cancel(); };

  // ===================== RENDER =====================

  // --- MENU ---
  if(appState==='menu') {
    return (
      <div className="min-h-screen flex flex-col items-center px-4 py-16 sm:p-8">
        <SettingsBar settings={settings} toggleSound={toggleSound} toggleTheme={toggleTheme} toggleLang={toggleLang}/>
        <h1 className="text-3xl sm:text-4xl font-extrabold text-[#3182ce] dark:text-blue-400 mt-2 mb-4 tracking-tight">{studyMode==='kana'?t.selectTitle:studyMode==='vocab'?t.vocabTitle:t.kanjiTitle}</h1>
        <div className="flex w-full max-w-5xl gap-1 bg-gray-100 dark:bg-gray-800 p-1 rounded-xl mb-6">
          {[['kana','tabKana'],['vocab','tabVocab'],['kanji','tabKanji']].map(([m,k])=>(
            <button key={m} onClick={()=>setStudyMode(m)} className={`flex-1 py-3 rounded-lg font-bold text-sm sm:text-base transition-all ${studyMode===m?'bg-white dark:bg-gray-700 text-[#3182ce] dark:text-blue-300 shadow-sm':'text-gray-500 dark:text-gray-400 hover:text-gray-700'}`}>{t[k]}</button>
          ))}
        </div>
        {studyMode==='kana' && (<>
          <div className="flex w-full max-w-5xl gap-2 bg-gray-100 dark:bg-gray-800 p-1.5 rounded-xl">
            <SelectButton isSelected={selectedAlphabet==='hiragana'} onClick={()=>setSelectedAlphabet('hiragana')} className="flex-1 !border-none !rounded-lg !py-3 !text-base sm:!text-lg !m-0">Hiragana (ひらがな)</SelectButton>
            <SelectButton isSelected={selectedAlphabet==='katakana'} onClick={()=>setSelectedAlphabet('katakana')} className="flex-1 !border-none !rounded-lg !py-3 !text-base sm:!text-lg !m-0">Katakana (カタカナ)</SelectButton>
          </div>
          <div className="w-full max-w-5xl mt-6 pb-6 border-b border-gray-200 dark:border-gray-800">
            <SelectButton isSelected={isAllSelected()} onClick={toggleAllKana} className="w-full !m-0 !py-3 !text-lg !border-gray-300 dark:!border-gray-600">{t.selectAll}</SelectButton>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-3 gap-8 w-full max-w-5xl mt-8">
            {['main','dakuten','combination'].map(cat => (
              <div key={cat} className="flex flex-col bg-white dark:bg-gray-800/50 p-4 sm:p-6 rounded-2xl border border-gray-100 dark:border-gray-700/50">
                <h2 className="text-xl sm:text-2xl font-bold mb-4 text-center dark:text-gray-200">{cat==='main'?t.mainKana:cat==='dakuten'?t.dakutenKana:t.comboKana}</h2>
                <SelectButton isSelected={isCategorySelected(cat)} onClick={()=>toggleAllCategory(cat)} className="!mb-4 !border-dashed">{cat==='main'?t.allMain:cat==='dakuten'?t.allDakuten:t.allCombo}</SelectButton>
                <div className="grid grid-cols-2 gap-2 sm:gap-3">
                  {KANA_DEF[selectedAlphabet][cat].map(g => <SelectButton key={g.id} isSelected={selectedGroups[selectedAlphabet].includes(g.id)} onClick={()=>toggleGroup(g.id)}>{g.label}</SelectButton>)}
                </div>
              </div>
            ))}
          </div>
        </>)}
        {studyMode==='vocab' && (
          <div className="w-full max-w-5xl">
            <div className="mb-4"><SelectButton isSelected={selectedVocabGroups.length===VOCAB_CATS.length} onClick={()=>setSelectedVocabGroups(selectedVocabGroups.length===VOCAB_CATS.length?[]:VOCAB_CATS.map(c=>VOCAB_N5[c].id))} className="w-full !m-0 !py-3 !text-lg !border-gray-300 dark:!border-gray-600">{t.selectAll}</SelectButton></div>
            <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
              {VOCAB_CATS.map(c=>{const g=VOCAB_N5[c]; return <SelectButton key={g.id} isSelected={selectedVocabGroups.includes(g.id)} onClick={()=>setSelectedVocabGroups(p=>p.includes(g.id)?p.filter(x=>x!==g.id):[...p,g.id])}>{g.label} ({g.items.length})</SelectButton>;})}
            </div>
          </div>
        )}
        {studyMode==='kanji' && (
          <div className="w-full max-w-5xl">
            <div className="mb-4"><SelectButton isSelected={selectedKanjiGroups.length===KANJI_CATS.length} onClick={()=>setSelectedKanjiGroups(selectedKanjiGroups.length===KANJI_CATS.length?[]:KANJI_CATS.map(c=>KANJI_N5[c].id))} className="w-full !m-0 !py-3 !text-lg !border-gray-300 dark:!border-gray-600">{t.selectAll}</SelectButton></div>
            <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
              {KANJI_CATS.map(c=>{const g=KANJI_N5[c]; return <SelectButton key={g.id} isSelected={selectedKanjiGroups.includes(g.id)} onClick={()=>setSelectedKanjiGroups(p=>p.includes(g.id)?p.filter(x=>x!==g.id):[...p,g.id])}>{g.label} ({g.items.length})</SelectButton>;})}
            </div>
          </div>
        )}
        <div className="w-full max-w-xl flex flex-col sm:flex-row gap-3 mt-10 sm:mt-12 px-2">
          <button onClick={startRandomQuiz} className="flex-1 bg-[#3182ce] text-white rounded-2xl px-5 py-4 font-extrabold text-base sm:text-lg shadow-xl hover:bg-[#2b6cb0] active:scale-95 transition-all outline-none text-center">&#127922; {t.random}</button>
          <button onClick={startFillAll} className="flex-1 bg-emerald-500 text-white rounded-2xl px-5 py-4 font-extrabold text-base sm:text-lg shadow-xl hover:bg-emerald-600 active:scale-95 transition-all outline-none text-center">&#128221; {t.fillAll}</button>
          <button onClick={startTimeAttack} className="flex-1 bg-gradient-to-r from-orange-500 to-red-500 text-white rounded-2xl px-5 py-4 font-extrabold text-base sm:text-lg shadow-xl hover:from-orange-600 hover:to-red-600 active:scale-95 transition-all outline-none text-center">&#9201;&#65039; {t.timeAttack}</button>
        </div>
        <p className="text-xs text-gray-400 dark:text-gray-600 mt-3 text-center">
          {t.srsHint}
          {taHighScore>0 && <span className="ml-2">&#8226; &#127942; {t.record}: {taHighScore}</span>}
        </p>
      </div>
    );
  }

  // --- RANDOM QUIZ ---
  if(appState==='quiz') {
    let iBorder="border-gray-200 dark:border-gray-700 dark:bg-gray-800", tClass="text-gray-800 dark:text-white", iAnim="", cBorder="border-gray-100 dark:border-gray-700";
    if(status==='correct'){iBorder="border-green-500 bg-green-50 dark:bg-green-900/30";tClass="text-green-600 dark:text-green-400";cBorder="border-green-400 dark:border-green-500";}
    else if(status==='error'){iBorder="border-red-500 bg-red-50 dark:bg-red-900/30 text-red-500";tClass="text-red-500 dark:text-red-400";iAnim="animate-shake";cBorder="border-red-300 dark:border-red-700/50";}
    if(!currentKana) return <div className="min-h-screen flex flex-col items-center justify-center font-bold text-gray-500"><div>No Data</div><button onClick={backToMenu} className="mt-4 px-4 py-2 bg-blue-500 text-white rounded-lg">Menu</button></div>;
    return (
      <div className="min-h-screen flex flex-col items-center justify-center px-4 relative overflow-hidden" tabIndex={-1} onClick={focusMobileInput}>
        <input ref={mobileInputRef} onInput={handleMobileInput} type="text" autoCapitalize="off" autoCorrect="off" autoComplete="off" spellCheck="false" className="absolute opacity-0 w-0 h-0 -z-10" />
        <SettingsBar settings={settings} toggleSound={toggleSound} toggleTheme={toggleTheme} toggleLang={toggleLang}/>
        <button onClick={backToMenu} className="absolute top-4 sm:top-6 left-4 sm:left-6 text-gray-500 dark:text-gray-400 font-bold hover:text-gray-800 dark:hover:text-white transition px-4 py-2.5 flex items-center bg-gray-100 dark:bg-gray-800 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 text-sm z-50 shadow-sm">&#8592; Menu</button>
        <div className="absolute top-0 left-0 w-full h-1.5 bg-gray-100 dark:bg-gray-800 z-50"><div className={`h-full transition-all duration-300 ease-out ${practiceMode==='practice_mistakes'?'bg-orange-400':'bg-[#3182ce] dark:bg-blue-500'}`} style={{width:`${practiceMode==='practice_mistakes'?100:progressPercent}%`}}></div></div>
        <div className="absolute top-20 sm:top-24 w-full max-w-sm px-2 flex justify-between text-xs sm:text-sm font-semibold items-center z-20">
          <div className="flex gap-2">
            <button onClick={togglePracticeMode} disabled={practiceMode==='normal'&&mistakesPool.length===0} className={`px-3 py-1.5 sm:px-4 sm:py-2 rounded-full transition-all border ${practiceMode==='practice_mistakes'?'bg-orange-50 text-orange-600 border-orange-200 dark:bg-orange-900/40 dark:text-orange-300 dark:border-orange-800':mistakesPool.length>0?'text-gray-600 dark:text-gray-300 bg-white dark:bg-gray-800 border-gray-200 dark:border-gray-600 shadow-sm':'text-gray-300 dark:text-gray-600 border-transparent opacity-50'}`}>
              {practiceMode==='practice_mistakes'?`\uD83C\uDFAF ${t.fixMistakes}`:`${t.reviewMistakes} ${mistakesPool.length}`}
            </button>
            <button onClick={()=>{setIsDrawingMode(!isDrawingMode);setDrawingChecked(false);clearCanvas();}} className={`px-3 py-1.5 sm:px-4 sm:py-2 rounded-full transition-all border shadow-sm ${isDrawingMode?'bg-[#3182ce] text-white border-[#3182ce]':'bg-white text-gray-600 dark:bg-gray-800 dark:text-gray-300 border-gray-200 dark:border-gray-600'}`}>✍️ Tập viết</button>
          </div>
          <span className={`px-2 py-1 rounded-full bg-gray-100/50 dark:bg-gray-800/50 ${practiceMode==='practice_mistakes'?'text-orange-500':'text-gray-400 dark:text-gray-500'} ${status==='correct'?'!text-blue-500 font-bold':''}`}>{practiceMode==='practice_mistakes'?`${mistakesPool.length} ${t.cards}`:`${correctCount} / ${goalCount}`}</span>
        </div>
        <div className="w-full max-w-[320px] flex flex-col items-center mt-20 sm:mt-16">
          <div className={`w-full aspect-square bg-white dark:bg-gray-800 rounded-[2.5rem] sm:rounded-[3rem] shadow-sm border flex flex-col items-center justify-center mb-6 sm:mb-10 transition-all duration-200 relative ${cBorder} ${status==='correct'?'scale-[1.03] shadow-lg shadow-green-100/50 dark:shadow-none':'hover:scale-[1.01]'}`}>
            {currentKana.mistakeCount>0&&practiceMode==='normal'&&<div className="absolute top-5 right-5 bg-red-100 dark:bg-red-900/50 text-red-500 dark:text-red-300 text-xs font-bold px-3 py-1.5 rounded-xl border border-red-200 dark:border-red-800">{currentKana.mistakeCount} {t.mistakes}</div>}
            {(!isDrawingMode || drawingChecked) && (
              <button onClick={(e)=>{e.stopPropagation();setShowStrokeOrder(!showStrokeOrder);}} className={`absolute top-4 left-4 p-2 rounded-full transition-colors z-10 ${showStrokeOrder?'bg-blue-100 text-blue-600 dark:bg-blue-900/50 dark:text-blue-400':'text-gray-400 hover:text-blue-500 bg-gray-50 hover:bg-blue-50 dark:bg-gray-800 dark:hover:bg-gray-700'}`} title={t.strokeOrder}>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor" className="w-5 h-5 sm:w-6 sm:h-6"><path strokeLinecap="round" strokeLinejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.89 1.132l-2.685.8.8-2.685a4.5 4.5 0 011.132-1.89L16.862 4.487zm0 0L19.5 7.125"/></svg>
              </button>
            )}
            {showStrokeOrder || (isDrawingMode && drawingChecked) ? (
              <div className="flex flex-wrap justify-center items-center gap-1 sm:gap-2 w-full p-2 h-full">
                {currentKana.question.split('').map((char, i) => {
                  const hex = char.charCodeAt(0).toString(16).padStart(5, '0');
                  return <img key={i} src={`https://raw.githubusercontent.com/KanjiVG/kanjivg/master/kanji/${hex}.svg`} alt={char} className="w-16 h-16 sm:w-24 sm:h-24 object-contain dark:invert opacity-80" />;
                })}
              </div>
            ) : (
              <span className={`leading-none text-gray-800 dark:text-gray-50 kana-text font-bold select-none drop-shadow-sm flex flex-col items-center justify-center flex-1 w-full ${(currentKana.meaning||isDrawingMode)?'mt-6':''}`}>
                {isDrawingMode && !drawingChecked ? (
                   <span className="text-[36px] sm:text-[45px] text-gray-500 dark:text-gray-400 font-normal px-4 text-center">{currentKana.meaning ? (currentKana.meaning[settings.lang]||currentKana.meaning.en) : Array.isArray(currentKana.answer)?currentKana.answer[0]:currentKana.answer}</span>
                ) : (
                   <span className={currentKana.meaning?'text-[70px] sm:text-[90px]':'text-[140px] sm:text-[160px]'}>{currentKana.question}</span>
                )}
              </span>
            )}
            {currentKana.meaning && (status==='correct' || drawingChecked) && <div className="text-lg sm:text-xl text-green-600 dark:text-green-400 font-bold mb-6 pop-in h-8">{currentKana.meaning[settings.lang]||currentKana.meaning.en}</div>}
            {currentKana.meaning && status!=='correct' && !drawingChecked && <div className="text-sm text-gray-400 dark:text-gray-500 mb-6 h-8 flex items-center">{t.meaning}: ?</div>}
          </div>
          {isDrawingMode ? (
            <div className="w-full flex-col items-center mt-2 px-2 sm:px-0">
              <div className={`relative w-full h-[220px] sm:h-[260px] bg-white dark:bg-gray-800 border-2 rounded-3xl overflow-hidden shadow-inner flex shrink-0 ${drawingChecked ? 'border-gray-200 dark:border-gray-700 opacity-80 pointer-events-none' : 'border-dashed border-[#3182ce] dark:border-blue-500 bg-blue-50/50 dark:bg-blue-900/10'}`}>
                 <canvas ref={canvasRef} width={320} height={260} className="w-full h-full touch-none cursor-crosshair" onMouseDown={startDrawingCanvas} onMouseMove={drawCanvas} onMouseUp={stopDrawingCanvas} onMouseOut={stopDrawingCanvas} onTouchStart={startDrawingCanvas} onTouchMove={drawCanvas} onTouchEnd={stopDrawingCanvas}/>
                 {!drawingChecked && (
                    <button onClick={clearCanvas} className="absolute top-2 right-2 p-2 bg-gray-100 dark:bg-gray-700 text-gray-500 rounded-full hover:bg-gray-200 active:scale-95 shadow-sm">
                      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" /></svg>
                    </button>
                 )}
              </div>
              {!drawingChecked && (
                <button onClick={()=>setDrawingChecked(true)} className="w-full mt-4 bg-[#3182ce] text-white rounded-2xl py-4 font-bold text-lg shadow-md active:scale-95 transition-all">Hiện đáp án</button>
              )}
              {drawingChecked && (
                <div className="flex gap-4 w-full mt-4 pop-in">
                  <button onClick={handleErrorRandom} className="flex-1 bg-red-50 text-red-600 border border-red-200 dark:bg-red-900/40 dark:border-red-800 dark:text-red-400 rounded-2xl py-4 font-bold text-lg hover:bg-red-100 active:scale-95 transition-all shadow-sm flex items-center justify-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" /></svg> {t.wrong}</button>
                  <button onClick={handleCorrectRandom} className="flex-1 bg-green-500 text-white border border-green-600 dark:border-green-400 rounded-2xl py-4 font-bold text-lg hover:bg-green-600 active:scale-95 transition-all shadow-md flex items-center justify-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor" className="w-5 h-5 text-white"><path strokeLinecap="round" strokeLinejoin="round" d="M4.5 12.75l6 6 9-13.5" /></svg> {t.correct}</button>
                </div>
              )}
            </div>
          ) : (
            <div className={`w-full relative ${iAnim} px-2 sm:px-0`}>
              <div className={`w-full px-12 py-4 sm:py-5 text-center text-[22px] sm:text-4xl font-semibold border-2 rounded-2xl sm:rounded-3xl transition-all min-h-[66px] sm:min-h-[78px] flex items-center justify-center select-none cursor-text relative ${iBorder} ${tClass}`}>
                <button onClick={(e)=>{e.stopPropagation();setShowVirtualKb(!showVirtualKb);}} className={`absolute right-3 sm:right-4 p-2 sm:p-2.5 rounded-xl transition-all z-10 ${showVirtualKb?'bg-[#3182ce] text-white shadow-md':'text-gray-400 hover:text-blue-500 hover:bg-blue-50 dark:hover:bg-gray-700'}`} title="Virtual Keyboard">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor" className="w-6 h-6 sm:w-7 sm:h-7"><path strokeLinecap="round" strokeLinejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h12A2.25 2.25 0 0120.25 6v12a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18V6z" /><path strokeLinecap="round" strokeLinejoin="round" d="M6 10.5h.008v.008H6v-.008zm3 0h.008v.008H9v-.008zm3 0h.008v.008H12v-.008zm3 0h.008v.008H15v-.008zm3 0h.008v.008H18v-.008zm-9 3h.008v.008H9v-.008zm3 0h.008v.008H12v-.008zm3 0h.008v.008H15v-.008zm-3 3h.008v.008H12v-.008z" /></svg>
                </button>
                {inputValue||<span className="font-normal text-gray-300 dark:text-gray-500">{t.romaji}</span>}
              </div>
              {!showVirtualKb && <div className="text-center text-xs text-gray-400 dark:text-gray-600 mt-2">{t.typeHere}</div>}
              {showVirtualKb && (
                <div className="flex flex-wrap justify-center content-start gap-1 sm:gap-2 mt-3 max-h-48 overflow-y-auto bg-gray-100 dark:bg-gray-800 p-2 rounded-xl shadow-inner pop-in" onClick={(e)=>e.stopPropagation()}>
                  <button onClick={handleVirtualBackspace} className="w-12 h-10 sm:w-16 sm:h-12 bg-red-100 text-red-600 dark:bg-red-900/40 dark:text-red-400 rounded-lg shadow-sm font-bold text-lg sm:text-xl flex items-center justify-center hover:bg-red-200 active:scale-95 transition-all">&#x232B;</button>
                  {['main','dakuten','combination'].map(cat => KANA_DEF[selectedAlphabet][cat] && KANA_DEF[selectedAlphabet][cat].map(g => g.items.map(i => (
                    <button key={i.q} onClick={() => handleVirtualKey(i.q)} className="w-10 h-10 sm:w-12 sm:h-12 bg-white text-gray-800 dark:bg-gray-700 dark:text-gray-100 rounded-lg shadow-sm font-bold text-lg sm:text-lg flex items-center justify-center hover:bg-[#3182ce] hover:text-white dark:hover:bg-blue-600 active:scale-95 transition-colors">
                      {i.q}
                    </button>
                  ))))}
                </div>
              )}
            </div>
          )}
        </div>
      </div>
    );
  }


  // --- TIME ATTACK RENDER ---
  if(appState==='timeattack') {
    const taKana = activeKanaList[taCurrentIdx]||activeKanaList[0];
    const timerPct = (taTimeLeft/60)*100;
    const isUrgent = taTimeLeft<=10;
    let taBorder='border-gray-200 dark:border-gray-700 dark:bg-gray-800', taTxt='text-gray-800 dark:text-white', taAnim='', taCard='border-gray-100 dark:border-gray-700';
    if(taStatus==='correct'){taBorder='border-green-500 bg-green-50 dark:bg-green-900/30';taTxt='text-green-600 dark:text-green-400';taCard='border-green-400';}
    else if(taStatus==='error'){taBorder='border-red-500 bg-red-50 dark:bg-red-900/30';taTxt='text-red-500';taAnim='animate-shake';taCard='border-red-300';}
    return (
      <div className="min-h-screen flex flex-col items-center justify-center px-4 relative overflow-hidden" tabIndex={-1} onClick={focusMobileInput}>
        <input ref={mobileInputRef} onInput={handleMobileInput} type="text" autoCapitalize="off" autoCorrect="off" autoComplete="off" spellCheck="false" className="absolute opacity-0 w-0 h-0 -z-10" />
        <SettingsBar settings={settings} toggleSound={toggleSound} toggleTheme={toggleTheme} toggleLang={toggleLang}/>
        <button onClick={()=>{setTaRunning(false);backToMenu();}} className="absolute top-4 sm:top-6 left-4 sm:left-6 text-gray-500 dark:text-gray-400 font-bold hover:text-gray-800 dark:hover:text-white transition px-4 py-2.5 flex items-center bg-gray-100 dark:bg-gray-800 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 text-sm z-50 shadow-sm">&#8592; Menu</button>
        {showConfetti && Array.from({length:60}).map((_,i)=><div key={i} className="confetti-piece" style={{left:`${Math.random()*100}%`,background:`hsl(${Math.random()*360},80%,60%)`,borderRadius:Math.random()>0.5?'50%':'0',width:`${6+Math.random()*8}px`,height:`${6+Math.random()*8}px`,animationDelay:`${Math.random()*2}s`,animationDuration:`${2+Math.random()*2}s`}}/>)}
        <div className="absolute top-0 left-0 w-full h-2 bg-gray-100 dark:bg-gray-800 z-50"><div className={`h-full transition-all duration-1000 ease-linear ${isUrgent?'bg-red-500':'bg-gradient-to-r from-orange-400 to-red-500'}`} style={{width:`${timerPct}%`}}/></div>
        {taFinished ? (
          <div className="flex flex-col items-center gap-6 pop-in">
            <div className="text-7xl sm:text-8xl font-black text-transparent bg-clip-text bg-gradient-to-r from-orange-500 to-red-500">{taScore}</div>
            <div className="text-xl font-bold text-gray-500 dark:text-gray-400">{t.scoreIn60}</div>
            {taScore>=taHighScore&&taScore>0&&<div className="text-2xl font-extrabold text-yellow-500 pop-in">&#127942; {t.newRecord}</div>}
            <div className="text-sm text-gray-400 dark:text-gray-500">{t.highScore}: {taHighScore}</div>
            <div className="flex gap-4 mt-4">
              <button onClick={startTimeAttack} className="bg-gradient-to-r from-orange-500 to-red-500 text-white rounded-2xl px-8 py-3 font-bold text-base shadow-lg active:scale-95 transition-all">&#128260; {t.playAgain}</button>
              <button onClick={backToMenu} className="bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200 rounded-2xl px-8 py-3 font-bold text-base shadow-lg active:scale-95 transition-all">{t.menu}</button>
            </div>
          </div>
        ) : taKana ? (
          <div className="w-full max-w-[320px] flex flex-col items-center mt-16 sm:mt-12">
            <div className="flex items-center justify-between w-full mb-4 px-2">
              <div className={`text-4xl sm:text-5xl font-black tabular-nums ${isUrgent?'text-red-500 animate-pulse':'text-orange-500'}`}>{taTimeLeft}<span className="text-lg font-bold">s</span></div>
              <div className="text-4xl sm:text-5xl font-black text-[#3182ce] dark:text-blue-400 tabular-nums">{taScore}</div>
            </div>
            <div className={`w-full aspect-square bg-white dark:bg-gray-800 rounded-[2.5rem] sm:rounded-[3rem] shadow-sm border flex items-center justify-center mb-6 sm:mb-10 transition-all ${taCard} ${taStatus==='correct'?'scale-[1.03]':''}`}>
              <span className="text-[140px] sm:text-[160px] leading-none text-gray-800 dark:text-gray-50 kana-text font-bold select-none drop-shadow-sm">{taKana.question}</span>
            </div>
            <div className={`w-full relative ${taAnim} px-2 sm:px-0`}>
              <div className={`w-full px-6 py-4 sm:py-5 text-center text-[22px] sm:text-4xl font-semibold border-2 rounded-2xl sm:rounded-3xl transition-all min-h-[66px] sm:min-h-[78px] flex items-center justify-center select-none cursor-text ${taBorder} ${taTxt}`}>
                {taInputValue||<span className="font-normal text-gray-300 dark:text-gray-500">{t.typefast}</span>}
              </div>
            </div>
          </div>
        ) : null}
      </div>
    );
  }

  // --- FILL ALL ---
  if(appState==='fill') {
    const correctCnt = Object.values(fillResults).filter(r=>r==='correct').length;
    const wrongCnt = Object.values(fillResults).filter(r=>r==='wrong').length;
    return (
      <div className="min-h-screen flex flex-col items-center px-3 sm:px-6 py-4 sm:py-8 relative" onClick={focusMobileInput}>
        <input ref={mobileInputRef} onInput={handleMobileInput} type="text" autoCapitalize="off" autoCorrect="off" autoComplete="off" spellCheck="false" className="absolute opacity-0 w-0 h-0 -z-10" />
        <SettingsBar settings={settings} toggleSound={toggleSound} toggleTheme={toggleTheme} toggleLang={toggleLang}/>
        <button onClick={backToMenu} className="absolute top-4 sm:top-6 left-4 sm:left-6 text-gray-500 dark:text-gray-400 font-bold hover:text-gray-800 dark:hover:text-white transition px-4 py-2.5 flex items-center bg-gray-100 dark:bg-gray-800 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 text-sm z-50 shadow-sm">&#8592; Menu</button>

        <h2 className="text-xl sm:text-2xl font-extrabold text-[#3182ce] dark:text-blue-400 mt-12 sm:mt-4 mb-2">{t.fillTitle}</h2>

        {!fillFinished && (
          <div className="flex gap-2 mb-4 bg-gray-100 dark:bg-gray-800 p-1 rounded-lg">
            <button onClick={()=>{setFillCheckMode('instant');setFillResults({});setFillAnswers({});setShuffledFillList(shuffle(activeKanaList));}} className={`px-4 py-2 rounded-md text-sm font-bold transition-all ${fillCheckMode==='instant'?'bg-white dark:bg-gray-700 text-blue-600 dark:text-blue-300 shadow-sm':'text-gray-500 dark:text-gray-400'}`}>{t.checkNow}</button>
            <button onClick={()=>{setFillCheckMode('finish');setFillResults({});setFillAnswers({});setShuffledFillList(shuffle(activeKanaList));}} className={`px-4 py-2 rounded-md text-sm font-bold transition-all ${fillCheckMode==='finish'?'bg-white dark:bg-gray-700 text-emerald-600 dark:text-emerald-300 shadow-sm':'text-gray-500 dark:text-gray-400'}`}>{t.finishCheck}</button>
          </div>
        )}

        {fillFinished && (
          <div className="mb-4 text-center pop-in">
            <span className="text-green-500 font-bold text-lg mr-4">✓ {correctCnt} {t.correct}</span>
            <span className="text-red-500 font-bold text-lg">✗ {wrongCnt} {t.wrong}</span>
            <div className="text-gray-400 dark:text-gray-500 text-sm mt-1">{t.total}: {shuffledFillList.length} &#8226; {t.ratio}: {Math.round(correctCnt/Math.max(shuffledFillList.length,1)*100)}%</div>
          </div>
        )}

        <div className="grid grid-cols-3 sm:grid-cols-5 md:grid-cols-8 lg:grid-cols-10 gap-2 sm:gap-3 w-full max-w-6xl mb-8">
          {shuffledFillList.map((kana, idx) => {
            const val = fillAnswers[kana.id]||'';
            const res = fillResults[kana.id];
            const isFocused = idx===focusedCardIdx && !fillFinished;
            let cardBg = 'bg-[#3182ce] dark:bg-blue-700';
            let inputBg = 'bg-white dark:bg-gray-700';
            let inputText = 'text-gray-800 dark:text-white';
            if(res==='correct'){cardBg='bg-green-500 dark:bg-green-600';inputBg='bg-green-50 dark:bg-green-900/50';inputText='text-green-700 dark:text-green-300';}
            else if(res==='wrong'){cardBg='bg-red-500 dark:bg-red-600';inputBg='bg-red-50 dark:bg-red-900/50';inputText='text-red-600 dark:text-red-300';}
            return (
              <div key={kana.id} onClick={()=>{
                if(fillFinished) return;
                if(fillCheckMode==='instant' && res==='correct') return;
                if(fillCheckMode==='instant' && res==='wrong') {
                  setFillResults(r=>({...r,[kana.id]:null}));
                  const na={...fillAnswers,[kana.id]:''};setFillAnswers(na);fillAnswersRef.current=na;
                }
                moveFocusTo(idx);
              }} className={`flex flex-col items-center rounded-xl overflow-hidden transition-all shadow-sm ${res==='correct'?'cursor-default':'cursor-pointer'} ${cardBg} ${isFocused?'ring-4 ring-yellow-400 dark:ring-yellow-300 scale-105':''} ${res==='wrong'?'animate-shake':''}`}>
                <div className="py-3 sm:py-4 flex items-center justify-center w-full">
                  <span className="text-3xl sm:text-4xl text-white kana-text font-bold select-none drop-shadow">{kana.question}</span>
                </div>
                <div className={`w-full px-1 pb-2 flex flex-col items-center`}>
                  <div className={`w-full text-center text-base sm:text-lg font-semibold py-1.5 sm:py-2 rounded-lg min-h-[36px] flex items-center justify-center ${inputBg} ${inputText}`}>
                    {val || (isFocused ? <span className="animate-pulse text-gray-400">|</span> : '')}
                  </div>
                  {fillFinished && res==='wrong' && <div className="text-[11px] text-white/80 mt-1 font-bold">{Array.isArray(kana.answer)?kana.answer[0]:kana.answer}</div>}
                </div>
              </div>
            );
          })}
        </div>

        {!fillFinished && fillCheckMode==='finish' && (
          <button onClick={handleFinishAll} className="bg-emerald-500 text-white rounded-2xl px-10 py-4 font-extrabold text-lg shadow-xl hover:bg-emerald-600 active:scale-95 transition-all outline-none mb-8">{t.finishQuiz}</button>
        )}
        {fillFinished && (
          <div className="flex gap-4 mb-8">
            <button onClick={()=>{setFillAnswers({});setFillResults({});setFillFinished(false);setFocusedCardIdx(0);focusedCardIdxRef.current=0;setShuffledFillList(shuffle(activeKanaList));}} className="bg-[#3182ce] text-white rounded-2xl px-8 py-3 font-bold text-base shadow-lg hover:bg-blue-700 active:scale-95 transition-all">🔄 {t.retry}</button>
            <button onClick={backToMenu} className="bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200 rounded-2xl px-8 py-3 font-bold text-base shadow-lg hover:bg-gray-300 dark:hover:bg-gray-600 active:scale-95 transition-all">{t.menu}</button>
          </div>
        )}
        <p className="text-center text-xs text-gray-400 dark:text-gray-600 mb-4">{t.tapOrTab}</p>
      </div>
    );
  }

  return null;
}

class ErrorBoundary extends React.Component {
  constructor(p){super(p);this.state={hasError:false,err:''};}
  static getDerivedStateFromError(e){return{hasError:true,err:e.toString()};}
  render(){if(this.state.hasError) return <div className="p-8 text-red-500 min-h-screen"><h1 className="text-2xl font-bold mb-4">App Crashed</h1><div className="p-4 bg-gray-100 rounded font-mono text-sm mt-4">{this.state.err}</div><button onClick={()=>window.location.reload()} className="mt-8 px-6 py-2 bg-blue-500 text-white rounded">Reload</button></div>; return this.props.children;}
}
ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
