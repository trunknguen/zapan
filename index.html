// SRS Engine (SM-2 inspired) with Adaptive Time penalty
const srsUpdate = (card, isCorrect, responseTimeMs = 0) => {
  const now = Date.now();
  let { interval, ease, nextReview, corrects, avgTime, totalAnswers } = card;
  interval = interval || 0; ease = ease || 2.5; nextReview = nextReview || 0; 
  corrects = corrects || 0; avgTime = avgTime || 0; totalAnswers = totalAnswers || 0;
  
  totalAnswers += 1;
  if (responseTimeMs > 0) {
    avgTime = avgTime > 0 ? Math.round(avgTime * 0.7 + responseTimeMs * 0.3) : responseTimeMs;
  }
  
  const FAST = 2000, SLOW = 5000;
  const speedFactor = responseTimeMs <= FAST ? 1.15 : responseTimeMs >= SLOW ? 0.85 : 1.0;

  if (isCorrect) {
    if (interval === 0) interval = 1;        // 1 minute
    else if (interval === 1) interval = 10;  // 10 minutes
    else if (interval < 60) interval = 60;   // 1 hour
    else if (interval < 1440) interval = 1440; // 1 day
    else interval = Math.round(interval * Math.min(ease, 4));
    
    interval = Math.round(interval * speedFactor);
    ease = Math.max(1.3, ease + (speedFactor >= 1.15 ? 0.15 : 0.1));
    corrects += 1;
  } else {
    interval = 1; // reset to 1 minute
    ease = Math.max(1.3, ease - 0.2);
  }
  return { ...card, interval, ease, nextReview: now + interval * 60000, corrects, avgTime, totalAnswers, lastAnswerTime: responseTimeMs };
};

const ROMAJI_TO_HIRA = {};
['main','dakuten','combination'].forEach(cat => {
  if(KANA_DEF.hiragana[cat]) KANA_DEF.hiragana[cat].forEach(g => g.items.forEach(i => i.a.forEach(a => ROMAJI_TO_HIRA[a] = i.q)));
});
ROMAJI_TO_HIRA['nn'] = 'ん'; ROMAJI_TO_HIRA['n'] = 'ん';

const convertRomajiToHiragana = (str) => {
  let res = '', i = 0;
  while(i < str.length) {
    if(i+2 < str.length && ROMAJI_TO_HIRA[str.slice(i, i+3)]) { res += ROMAJI_TO_HIRA[str.slice(i, i+3)]; i+=3; continue; }
    if(i+1 < str.length && ROMAJI_TO_HIRA[str.slice(i, i+2)]) { res += ROMAJI_TO_HIRA[str.slice(i, i+2)]; i+=2; continue; }
    if(ROMAJI_TO_HIRA[str.slice(i, i+1)]) { res += ROMAJI_TO_HIRA[str.slice(i, i+1)]; i+=1; continue; }
    if(i+1 < str.length && str[i] === str[i+1] && str[i] !== 'n') { res += 'っ'; i+=1; continue; }
    res += str[i]; i+=1;
  }
  return res;
};

const checkAns = (val, kana) => {
  if(!kana || !val) return false;
  const valNorm = val.toLowerCase().trim();
  if(valNorm === kana.question) return true;
  const answers = Array.isArray(kana.answer) ? kana.answer : [kana.answer];
  if(answers.includes(valNorm)) return true;
  for(const ans of answers) {
    if(valNorm === convertRomajiToHiragana(ans)) return true;
  }
  return false;
};

function Sidebar({ isOpen, onClose, activeSection, onSelectSection, onSubSelect, studyMode, t }) {

      onClose();
      setIsClosing(false);

    setExpandedMenu(prev => prev === menu ? '' : menu);

// Supports 'refreshKey' to replay animation
function StrokeViewer({ char, refreshKey }) {
  const [svgData, setSvgData] = React.useState(null);
  const [error, setError] = React.useState(false);

  React.useEffect(() => {
    if (!char) return;
    setSvgData(null); setError(false);
    const code = char.charCodeAt(0).toString(16).padStart(5, '0');
    fetch(`https://raw.githubusercontent.com/KanjiVG/kanjivg/master/kanji/${code}.svg`)
      .then(res => {
         if(!res.ok) throw new Error('Not found');
         return res.text();
      })
      .then(txt => {
         // Strip DOCTYPE declarations that cause ]> rendering artifacts
         let cleanTxt = txt.substring(txt.indexOf('<svg'));
         let pathCount = 0;
         let numCount = 0;
         let fixed = cleanTxt
           .replace(/stroke="#[0-9a-fA-F]+"/g, 'stroke="currentColor"')
           .replace(/stroke:#[0-9a-fA-F]+/g, 'stroke:currentColor')
           .replace(/fill="#[0-9a-fA-F]+"/g, 'fill="currentColor"')
           .replace(/fill:#[0-9a-fA-F]+/g, 'fill:currentColor')
           .replace(/fill="#808080"/gi, 'fill="#f59e0b"')
           .replace(/width="[0-9.]+"/g, 'width="100%"')
           .replace(/height="[0-9.]+"/g, 'height="100%"')
           .replace(/<path\b([^>]*)>/g, (m, attrs) => {
              let delay = (pathCount * 0.8).toFixed(1);
              pathCount++;
              return `<path ${attrs} style="stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: drawStroke 1s ease-out forwards ${delay}s;" />`;
           })
           .replace(/<text\b([^>]*)>/g, (m, attrs) => {
              let delay = (numCount * 0.8).toFixed(1);
              numCount++;
              return `<text ${attrs} style="opacity: 0; animation: fadeIn 0.3s ease forwards ${delay}s; font-weight: bold; font-size: 14px;" >`;
           });
         setSvgData(fixed);
      })
      .catch((e) => setError(true));
  }, [char, refreshKey]);

  if (error) {
     return (
       <div className="flex flex-col items-center justify-center text-red-500 text-center animate-fade-in p-4 w-full h-full">
         <span className="text-4xl mb-3">🤔</span>
         <span className="font-bold text-sm">Chưa có dữ liệu nét chữ.</span>
       </div>
     );
  }

  if (!svgData) {
     return (
       <div className="flex items-center justify-center w-full h-full">
         <div className="w-12 h-12 border-4 border-gray-200 dark:border-gray-700 border-t-[#3182ce] rounded-full animate-spin"></div>
       </div>
     );
  }

  return <div className="w-full h-full relative z-10" dangerouslySetInnerHTML={{__html: svgData}}></div>;
}

// ===== ROADMAP SCREEN COMPONENT =====
function RoadmapScreen({ toggleSidebar, kanaData, vocabData, kanjiData }) {
  // Compute progress for each stage
  const computeProgress = React.useMemo(() => {
    const kanaTotal = kanaData.length;
    const kanaLearned = kanaData.filter(k => k.corrects >= 3).length;
    const kanaPct = kanaTotal > 0 ? Math.round((kanaLearned / kanaTotal) * 100) : 0;

    const hiraItems = kanaData.filter(k => k.id.startsWith('hiragana_'));
    const hiraLearned = hiraItems.filter(k => k.corrects >= 3).length;
    const hiraPct = hiraItems.length > 0 ? Math.round((hiraLearned / hiraItems.length) * 100) : 0;

    const kataItems = kanaData.filter(k => k.id.startsWith('katakana_'));
    const kataLearned = kataItems.filter(k => k.corrects >= 3).length;
    const kataPct = kataItems.length > 0 ? Math.round((kataLearned / kataItems.length) * 100) : 0;

    const vocabN5 = vocabData.filter(v => !v.groupId.startsWith('n4_'));
    const vocabN5Learned = vocabN5.filter(v => v.corrects >= 3).length;
    const vocabN5Pct = vocabN5.length > 0 ? Math.round((vocabN5Learned / vocabN5.length) * 100) : 0;

    const kanjiN5 = kanjiData.filter(k => !k.groupId.startsWith('n4_'));
    const kanjiN5Learned = kanjiN5.filter(k => k.corrects >= 3).length;
    const kanjiN5Pct = kanjiN5.length > 0 ? Math.round((kanjiN5Learned / kanjiN5.length) * 100) : 0;

    const vocabN4 = vocabData.filter(v => v.groupId.startsWith('n4_'));
    const vocabN4Learned = vocabN4.filter(v => v.corrects >= 3).length;
    const vocabN4Pct = vocabN4.length > 0 ? Math.round((vocabN4Learned / vocabN4.length) * 100) : 0;

    const kanjiN4 = kanjiData.filter(k => k.groupId.startsWith('n4_'));
    const kanjiN4Learned = kanjiN4.filter(k => k.corrects >= 3).length;
    const kanjiN4Pct = kanjiN4.length > 0 ? Math.round((kanjiN4Learned / kanjiN4.length) * 100) : 0;

    return { hiraPct, kataPct, kanaPct, vocabN5Pct, kanjiN5Pct, vocabN4Pct, kanjiN4Pct,
      hiraLearned, hiraTotal: hiraItems.length, kataLearned, kataTotal: kataItems.length,
      vocabN5Learned, vocabN5Total: vocabN5.length, kanjiN5Learned, kanjiN5Total: kanjiN5.length,
      vocabN4Learned, vocabN4Total: vocabN4.length, kanjiN4Learned, kanjiN4Total: kanjiN4.length };
  }, [kanaData, vocabData, kanjiData]);

  const p = computeProgress;

  // Determine current stage
  const getCurrentStage = () => {
    if (p.hiraPct < 50) return 0;
    if (p.kataPct < 50) return 1;
    if (p.vocabN5Pct < 30) return 2;
    if (p.kanjiN5Pct < 30) return 3;
    if (p.vocabN5Pct < 80 || p.kanjiN5Pct < 80) return 4;
    if (p.vocabN4Pct < 30) return 5;
    return 6;
  };
  const currentStage = getCurrentStage();

  const stages = [
    {
      title: 'Bước 1: Hiragana',
      icon: 'あ',
      desc: 'Bảng chữ cái đầu tiên — nền tảng của mọi thứ',
      tip: 'Mỗi ngày học 5 chữ, luyện viết + quiz. Khoảng 2 tuần là xong!',
      progress: p.hiraPct,
      detail: `${p.hiraLearned}/${p.hiraTotal} chữ đã thuộc`,
      color: 'from-pink-500 to-rose-400',
      bg: 'bg-pink-50 dark:bg-pink-900/20',
      border: 'border-pink-200 dark:border-pink-800',
    },
    {
      title: 'Bước 2: Katakana',
      icon: 'カ',
      desc: 'Bảng chữ cái thứ hai — dùng cho từ ngoại lai',
      tip: 'Cách học giống Hiragana. Song song đọc thêm bảng hiệu, menu Nhật.',
      progress: p.kataPct,
      detail: `${p.kataLearned}/${p.kataTotal} chữ đã thuộc`,
      color: 'from-blue-500 to-cyan-400',
      bg: 'bg-blue-50 dark:bg-blue-900/20',
      border: 'border-blue-200 dark:border-blue-800',
    },
    {
      title: 'Bước 3: Từ Vựng N5',
      icon: '📝',
      desc: 'Từ vựng cơ bản — lời chào, số đếm, gia đình, thời gian',
      tip: 'Học qua flashcard + quiz mỗi ngày. Nghe phát âm thật nhiều!',
      progress: p.vocabN5Pct,
      detail: `${p.vocabN5Learned}/${p.vocabN5Total} từ đã thuộc`,
      color: 'from-emerald-500 to-green-400',
      bg: 'bg-emerald-50 dark:bg-emerald-900/20',
      border: 'border-emerald-200 dark:border-emerald-800',
    },
    {
      title: 'Bước 4: Kanji N5',
      icon: '漢',
      desc: 'Chữ Hán cơ bản — số, ngày, người, tự nhiên',
      tip: 'Dùng mẹo nhớ (Chiết tự) + Âm Hán Việt để ghi nhớ nhanh!',
      progress: p.kanjiN5Pct,
      detail: `${p.kanjiN5Learned}/${p.kanjiN5Total} chữ đã thuộc`,
      color: 'from-orange-500 to-amber-400',
      bg: 'bg-orange-50 dark:bg-orange-900/20',
      border: 'border-orange-200 dark:border-orange-800',
    },
    {
      title: 'Bước 5: Ôn Tập N5',
      icon: '🏆',
      desc: 'Ôn tổng hợp — đạt 80%+ Vocab & Kanji N5 để lên N4',
      tip: 'Dùng SRS (ôn tập ngắt quãng) + Time Attack để tăng tốc!',
      progress: Math.round((p.vocabN5Pct + p.kanjiN5Pct) / 2),
      detail: `Vocab ${p.vocabN5Pct}% · Kanji ${p.kanjiN5Pct}%`,
      color: 'from-purple-500 to-violet-400',
      bg: 'bg-purple-50 dark:bg-purple-900/20',
      border: 'border-purple-200 dark:border-purple-800',
    },
    {
      title: 'Bước 6: Từ Vựng & Kanji N4',
      icon: '🚀',
      desc: 'Nâng cao — xã hội, động từ, danh từ trừu tượng',
      tip: 'Kết hợp nghe nhạc Nhật, xem anime có sub để quen tai!',
      progress: Math.round((p.vocabN4Pct + p.kanjiN4Pct) / 2),
      detail: `Vocab ${p.vocabN4Learned}/${p.vocabN4Total} · Kanji ${p.kanjiN4Learned}/${p.kanjiN4Total}`,
      color: 'from-red-500 to-pink-400',
      bg: 'bg-red-50 dark:bg-red-900/20',
      border: 'border-red-200 dark:border-red-800',
    },
  ];

  // Overall progress
  const overallPct = Math.round((p.hiraPct + p.kataPct + p.vocabN5Pct + p.kanjiN5Pct + p.vocabN4Pct + p.kanjiN4Pct) / 6);

  return (
    <div className="min-h-screen flex flex-col bg-[#fcfcfc] dark:bg-gray-900 transition-colors duration-300 w-full overflow-hidden">
      {/* Header */}
      <div className="absolute top-4 sm:top-5 left-4 sm:left-5 flex items-center gap-3 z-[60]">
        <button onClick={toggleSidebar} className="p-2 -ml-2 text-gray-400 hover:text-gray-800 dark:text-gray-400 dark:hover:text-gray-100 bg-gray-100 dark:bg-gray-800/80 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-xl transition-all focus:outline-none">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2.5} stroke="currentColor" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" /></svg>
        </button>
        <h1 className="text-sm min-[380px]:text-xl sm:text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-500 to-teal-400 drop-shadow-sm flex items-center gap-2.5 tracking-tight select-none">
          chơn trunk kúc <span className="text-xs px-2 py-1 bg-gray-200 dark:bg-gray-800/80 rounded-lg text-gray-500 dark:text-gray-400 font-bold ml-1 tracking-normal normal-case shadow-sm">Lộ Trình</span>
        </h1>
      </div>

      <div className="flex-1 overflow-y-auto w-full p-4 pb-20 max-w-2xl mx-auto mt-[72px] sm:mt-[76px]">
        {/* Overall Progress Card */}
        <div className="bg-gradient-to-br from-blue-500 to-teal-400 rounded-3xl p-6 mb-8 text-white shadow-lg pop-in">
          <div className="flex items-center justify-between mb-3">
            <div>
              <h2 className="text-lg font-extrabold">Tổng Tiến Độ</h2>
              <p className="text-sm opacity-80">Hành trình học tiếng Nhật của bạn</p>
            </div>
            <div className="text-4xl font-black">{overallPct}%</div>
          </div>
          <div className="w-full h-3 bg-white/30 rounded-full overflow-hidden">
            <div className="h-full bg-white rounded-full transition-all duration-700" style={{width: `${overallPct}%`}}></div>
          </div>
          <p className="text-xs mt-2 opacity-70">
            {currentStage === 0 ? '🌱 Mới bắt đầu — Bạn đang ở bước đầu tiên!' :
             currentStage <= 2 ? '📚 Đang xây nền tảng — Tiếp tục phát huy!' :
             currentStage <= 4 ? '💪 Sắp hoàn thành N5 — Cố lên nào!' :
             '🔥 Đang chinh phục N4 — Bạn giỏi lắm!'}
          </p>
        </div>

        {/* Roadmap Timeline */}
        <div className="relative">
          {/* Vertical Line */}
          <div className="absolute left-6 top-8 bottom-8 w-0.5 bg-gray-200 dark:bg-gray-700"></div>

          {stages.map((stage, i) => {
            const isActive = i === currentStage;
            const isDone = stage.progress >= 80;
            const isLocked = i > currentStage + 1;

            return (
              <div key={i} className={`relative flex items-start gap-4 mb-6 pop-in ${isLocked ? 'opacity-40' : ''}`} style={{animationDelay: `${i * 0.08}s`}}>
                {/* Node Circle */}
                <div className={`relative z-10 w-12 h-12 rounded-full flex items-center justify-center text-xl font-bold shrink-0 border-2 transition-all shadow-md ${
                  isDone ? 'bg-green-500 border-green-400 text-white' :
                  isActive ? `bg-gradient-to-br ${stage.color} border-white dark:border-gray-600 text-white ring-4 ring-blue-200 dark:ring-blue-800 animate-pulse` :
                  'bg-gray-100 dark:bg-gray-800 border-gray-300 dark:border-gray-600 text-gray-400'
                }`}>
                  {isDone ? '✓' : stage.icon}
                </div>

                {/* Content Card */}
                <div className={`flex-1 rounded-2xl p-4 border transition-all ${
                  isActive ? `${stage.bg} ${stage.border} shadow-md` :
                  isDone ? 'bg-green-50 dark:bg-green-900/20 border-green-200 dark:border-green-800' :
                  'bg-white dark:bg-gray-800 border-gray-100 dark:border-gray-700'
                }`}>
                  <div className="flex items-start justify-between mb-1">
                    <h3 className={`font-extrabold text-sm sm:text-base ${isDone ? 'text-green-600 dark:text-green-400' : isActive ? 'text-gray-800 dark:text-gray-100' : 'text-gray-500 dark:text-gray-400'}`}>
                      {stage.title} {isDone && '✅'}
                    </h3>
                    <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${
                      isDone ? 'bg-green-100 dark:bg-green-800 text-green-600 dark:text-green-300' :
                      isActive ? 'bg-blue-100 dark:bg-blue-800 text-blue-600 dark:text-blue-300' :
                      'bg-gray-100 dark:bg-gray-700 text-gray-400'
                    }`}>{stage.progress}%</span>
                  </div>
                  <p className="text-xs text-gray-500 dark:text-gray-400 mb-2">{stage.desc}</p>

                  {/* Progress bar */}
                  <div className="w-full h-2 bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden mb-2">
                    <div className={`h-full rounded-full bg-gradient-to-r ${stage.color} transition-all duration-700`} style={{width: `${stage.progress}%`}}></div>
                  </div>
                  <div className="text-[11px] text-gray-400 dark:text-gray-500 font-semibold">{stage.detail}</div>

                  {/* Tip for active stage */}
                  {isActive && (
                    <div className="mt-3 bg-yellow-50 dark:bg-yellow-900/30 border border-yellow-200 dark:border-yellow-800 rounded-xl px-3 py-2 text-xs text-yellow-700 dark:text-yellow-300 font-medium flex items-start gap-1.5">
                      <span className="text-base leading-none">💡</span>
                      <span>{stage.tip}</span>
                    </div>
                  )}
                </div>
              </div>
            );
          })}
        </div>

        {/* Motivation Footer */}
        <div className="text-center mt-4 mb-8">
          <div className="text-5xl mb-3">
            {overallPct === 0 ? '🌱' : overallPct < 25 ? '🌿' : overallPct < 50 ? '🌳' : overallPct < 75 ? '🌸' : '🎊'}
          </div>
          <p className="text-sm text-gray-500 dark:text-gray-400 font-semibold italic">
            {overallPct === 0 ? '"Hành trình vạn dặm bắt đầu từ một bước chân" — Lão Tử' :
             overallPct < 25 ? '"Kiên trì là chìa khóa thành công" — Bạn đang làm tốt lắm!' :
             overallPct < 50 ? '"Nước chảy đá mòn" — Tiến bộ hàng ngày rồi đó!' :
             overallPct < 75 ? '"Trèo cao ngã đau, nhưng nhìn xa hơn" — Sắp đến đích rồi!' :
             '🎉 "Bạn là ngôi sao!" — Đẳng cấp JLPT đây rồi!'}
          </p>
        </div>
      </div>
    </div>
  );
}

// ===== N5 VOCAB LEARNING COMPONENT =====
function N5VocabView() {
  const topicKeys = typeof VOCAB_N5_FULL !== 'undefined' ? Object.keys(VOCAB_N5_FULL) : [];
  const [selectedTopic, setSelectedTopic] = React.useState(topicKeys[0] || '');
  const [flippedCards, setFlippedCards] = React.useState({});
  const [showAll, setShowAll] = React.useState(false);
  const [searchQuery, setSearchQuery] = React.useState('');

  // Speech synthesis for pronunciation
  const speak = (text, e) => {
    if (e) e.stopPropagation();
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ja-JP';
      u.rate = 0.8;
      const voices = window.speechSynthesis.getVoices();
      const jpVoice = voices.find(v => v.lang.startsWith('ja'));
      if (jpVoice) u.voice = jpVoice;
      window.speechSynthesis.speak(u);
    }
  };

  // Search across all topics
  const searchResults = React.useMemo(() => {
    if (!searchQuery.trim()) return null;
    const q = searchQuery.trim().toLowerCase();
    const results = [];
    topicKeys.forEach(key => {
      const topic = VOCAB_N5_FULL[key];
      topic.items.forEach(item => {
        const match = item.q.toLowerCase().includes(q) ||
          (item.a && item.a.some(a => a.toLowerCase().includes(q))) ||
          (item.m?.vi && item.m.vi.toLowerCase().includes(q));
        if (match) results.push(item);
      });
    });
    return results;
  }, [searchQuery]);

  const isSearching = searchResults !== null;
  const topicData = !isSearching && selectedTopic && typeof VOCAB_N5_FULL !== 'undefined' ? VOCAB_N5_FULL[selectedTopic] : null;
  const items = isSearching ? searchResults : (topicData ? topicData.items : []);

  const toggleFlip = (idx) => {
    setFlippedCards(prev => ({...prev, [idx]: !prev[idx]}));
  };

  const flipAll = () => {
    if (showAll) {
      setFlippedCards({});
      setShowAll(false);
    } else {
      const all = {};
      items.forEach((_, i) => { all[i] = true; });
      setFlippedCards(all);
      setShowAll(true);
    }
  };

  const totalWords = topicKeys.reduce((sum, k) => sum + (VOCAB_N5_FULL[k]?.items?.length || 0), 0);

  // Icon SVGs (no emoji)
  const iconMap = {
    n5_numbers: '<path d="M7 20h10M12 4v16m-4-4l4 4 4-4"/>',
    n5_time: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
    n5_people: '<path d="M16 21v-2a4 4 0 00-4-4H8a4 4 0 00-4-4v2"/><circle cx="10" cy="7" r="4"/><path d="M22 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/>',
    n5_places: '<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/>',
    n5_objects: '<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 3l-4 4-4-4"/>',
    n5_school: '<path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>',
    n5_food: '<path d="M18 8h1a4 4 0 010 8h-1"/><path d="M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/>',
    n5_body: '<path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 000-7.78z"/>',
    n5_nature: '<path d="M17 8C8 10 5.9 16.17 3.82 21.34L3 23l2.72-.86C10.82 20.1 17 16 17 8z"/><path d="M7 14l5-5"/>',
    n5_colors: '<circle cx="13.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="10.5" r="2.5"/><circle cx="8.5" cy="7.5" r="2.5"/><circle cx="6.5" cy="12.5" r="2.5"/><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12a10 10 0 005 8.66"/>',
    n5_clothes: '<path d="M20.38 3.46L16 2 12 5 8 2 3.62 3.46a2 2 0 00-1.34 2.23l.58 3.47a1 1 0 00.99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 002-2V10h2.15a1 1 0 00.99-.84l.58-3.47a2 2 0 00-1.34-2.23z"/>',
    n5_transport: '<rect x="1" y="3" width="15" height="13" rx="2"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>',
    n5_adjectives: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
    n5_verbs: '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
    n5_others: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>'
  };

  return (
    <div className="w-full pop-in">
      {/* Stats bar */}
      <div className="flex items-center justify-between mb-6 px-1">
        <div className="flex items-center gap-3">
          <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center shadow-lg shadow-emerald-500/20">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="white" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25"/></svg>
          </div>
          <div>
            <h2 className="text-lg font-black text-gray-800 dark:text-gray-100">Từ Vựng N5</h2>
            <p className="text-xs text-gray-400 font-semibold">{totalWords} từ  ·  {topicKeys.length} chủ đề</p>
          </div>
        </div>
        <button onClick={flipAll} className="px-4 py-2 text-xs font-bold rounded-xl border-2 border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:border-blue-400 hover:text-blue-500 transition-all active:scale-95">
          {showAll ? 'Ẩn tất cả' : 'Hiện tất cả'}
        </button>
      </div>

      {/* Search bar */}
      <div className="relative mb-5">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor" className="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"><path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" /></svg>
        <input
          type="text"
          value={searchQuery}
          onChange={(e) => { setSearchQuery(e.target.value); setFlippedCards({}); setShowAll(false); }}
          placeholder="Tìm từ vựng... (Kanji, Hiragana hoặc tiếng Việt)"
          className="w-full pl-11 pr-10 py-3 bg-white dark:bg-gray-800 border-2 border-gray-100 dark:border-gray-700 rounded-2xl text-sm font-medium text-gray-700 dark:text-gray-200 placeholder-gray-400 focus:outline-none focus:border-blue-400 dark:focus:border-blue-500 transition-colors shadow-sm"
        />
        {searchQuery && (
          <button onClick={() => { setSearchQuery(''); setFlippedCards({}); }} className="absolute right-3 top-1/2 -translate-y-1/2 p-1 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2.5} stroke="currentColor" className="w-4 h-4"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
          </button>
        )}
      </div>

      {isSearching && (
        <p className="text-xs text-gray-400 font-semibold mb-4 px-1">Tìm thấy {searchResults.length} kết quả cho "{searchQuery}"</p>
      )}

      {/* Topic pills - hidden when searching */}
      {!isSearching && (
        <div className="flex gap-2 mb-6 overflow-x-auto pb-2 md:flex-wrap md:overflow-visible scrollbar-thin" style={{scrollbarWidth: 'thin'}}>
          {topicKeys.map((key, i) => {
            const topic = VOCAB_N5_FULL[key];
            const isActive = selectedTopic === key;
            return (
              <button
                key={key}
                onClick={() => { setSelectedTopic(key); setFlippedCards({}); setShowAll(false); }}
                className={`topic-pill flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-bold border-2 transition-all focus:outline-none whitespace-nowrap shrink-0 md:shrink ${
                  isActive
                    ? 'border-blue-500 bg-blue-500 text-white shadow-lg shadow-blue-500/20'
                    : 'border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-500 dark:text-gray-400 hover:border-blue-300 dark:hover:border-blue-600'
                }`}
                style={{ animationDelay: `${i * 30}ms` }}
              >
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={isActive ? 2.5 : 1.5} stroke="currentColor" className="w-3.5 h-3.5 shrink-0" dangerouslySetInnerHTML={{__html: iconMap[key] || '<circle cx="12" cy="12" r="10"/>'}} />
                <span>{topic.label}</span>
                <span className={`px-1.5 py-0.5 rounded-md text-[10px] ${isActive ? 'bg-white/20' : 'bg-gray-100 dark:bg-gray-700 text-gray-400'}`}>{topic.items.length}</span>
              </button>
            );
          })}
        </div>
      )}

      {/* Topic header - hidden when searching */}
      {!isSearching && topicData && (
        <div className="flex items-center gap-3 mb-5 pb-4 border-b border-gray-100 dark:border-gray-800 fade-slide-up">
          <div className="w-9 h-9 rounded-lg bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-md shadow-blue-500/20">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="white" className="w-4 h-4" dangerouslySetInnerHTML={{__html: iconMap[selectedTopic] || '<circle cx="12" cy="12" r="10"/>'}} />
          </div>
          <div>
            <h3 className="text-base font-black text-gray-800 dark:text-gray-100">{topicData.label}</h3>
            <p className="text-xs text-gray-400 font-medium">{items.length} từ vựng</p>
          </div>
        </div>
      )}

      {/* Flashcard grid */}
      <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
        {items.map((item, idx) => {
          const isFlipped = !!flippedCards[idx];
          return (
            <div
              key={`${selectedTopic}-${idx}`}
              className="perspective cursor-pointer"
              onClick={() => toggleFlip(idx)}
              style={{ animationDelay: `${Math.min(idx * 20, 400)}ms` }}
            >
              <div className="fade-slide-up" style={{ animationDelay: `${Math.min(idx * 20, 400)}ms` }}>
                <div className={`flip-card-inner ${isFlipped ? 'flipped' : ''}`} style={{height: '140px'}}>
                  {/* Front */}
                  <div className="flip-card-front bg-white dark:bg-gray-800 border-2 border-gray-100 dark:border-gray-700 hover:border-blue-300 dark:hover:border-blue-600 shadow-sm hover:shadow-md flex flex-col items-center justify-center p-3 transition-shadow">
                    <span className="text-2xl sm:text-3xl font-black kana-text text-gray-800 dark:text-gray-100 mb-1">{item.q}</span>
                    <span className="text-[10px] text-gray-300 dark:text-gray-600 font-bold uppercase tracking-widest">Bấm để lật</span>
                  </div>
                  {/* Back */}
                  <div className="flip-card-back bg-gradient-to-br from-blue-500 to-indigo-600 flex flex-col items-center justify-center p-3 shadow-lg shadow-blue-500/20 relative">
                    <span className="text-xl sm:text-2xl font-black kana-text text-white/90 mb-1">{item.q}</span>
                    <span className="text-sm font-bold text-blue-100">{Array.isArray(item.a) ? item.a[0] : item.a}</span>
                    <div className="w-8 h-px bg-white/30 my-1.5"></div>
                    <span className="text-xs font-bold text-white text-center leading-tight px-1">{item.m?.vi || ''}</span>
                    <button onClick={(e) => speak(item.q, e)} className="absolute top-2.5 right-2.5 w-7 h-7 rounded-lg bg-white/20 hover:bg-white/30 flex items-center justify-center transition-colors active:scale-90" title="Nghe phát âm">
                      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="white" className="w-3.5 h-3.5"><path strokeLinecap="round" strokeLinejoin="round" d="M19.114 5.636a9 9 0 010 12.728M16.463 8.288a5.25 5.25 0 010 7.424M6.75 8.25l4.72-4.72a.75.75 0 011.28.53v15.88a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 012.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75z" /></svg>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ===== MATERIALS SCREEN COMPONENT =====
function MaterialsScreen({ toggleSidebar, activeTab }) {
  const [chartType, setChartType] = React.useState('hiragana'); // hiragana | katakana
  const [subCategory, setSubCategory] = React.useState('main'); // main | dakuten | combination
  const [viewedChar, setViewedChar] = React.useState('');

  // Standard kana chart layout: 5 columns (a, i, u, e, o)
  // Some rows have fewer items and need empty cells at correct positions
  const getStandardLayout = (data, subCat) => {
    if (subCat !== 'main') {
      // For dakuten and combination, just flatten normally
      const cells = [];
      data.forEach((row, rIdx) => {
        row.items.forEach((item, idx) => {
          cells.push({ ...item, rowIdx: rIdx, colIdx: idx, key: `${rIdx}-${idx}` });
        });
      });
      return cells;
    }
    // For main kana: map each row to 5 columns (a, i, u, e, o)
    // Special rows: ya -> [ya, _, yu, _, yo], wa -> [wa, _, _, _, wo], n -> [n]
    const cells = [];
    data.forEach((row, rIdx) => {
      const id = row.id;
      if (id === 'ya') {
        // ya row: ya(a), empty(i), yu(u), empty(e), yo(o)
        cells.push({ ...row.items[0], key: `${rIdx}-0` }); // ya
        cells.push({ q: null, key: `${rIdx}-1` }); // empty
        cells.push({ ...row.items[1], key: `${rIdx}-2` }); // yu
        cells.push({ q: null, key: `${rIdx}-3` }); // empty
        cells.push({ ...row.items[2], key: `${rIdx}-4` }); // yo
      } else if (id === 'wa') {
        // wa row: wa(a), empty(i), empty(u), empty(e), wo(o)
        cells.push({ ...row.items[0], key: `${rIdx}-0` }); // wa
        cells.push({ q: null, key: `${rIdx}-1` }); // empty
        cells.push({ q: null, key: `${rIdx}-2` }); // empty
        cells.push({ q: null, key: `${rIdx}-3` }); // empty
        cells.push({ ...row.items[1], key: `${rIdx}-4` }); // wo
        // n goes on its own row, centered
        cells.push({ ...row.items[2], key: `${rIdx}-5`, isN: true }); // n
      } else {
        // Normal 5-item rows
        row.items.forEach((item, idx) => {
          cells.push({ ...item, key: `${rIdx}-${idx}` });
        });
      }
    });
    return cells;
  };

  const renderKanaGrid = (data, prefix, colsClass) => {
    const cells = getStandardLayout(data, subCategory);
    // Check if last item is ん (isN flag) — render separately
    const hasN = cells.length > 0 && cells[cells.length - 1].isN;
    const nCell = hasN ? cells.pop() : null;

    return (
      <div>
        <div className={`grid ${colsClass} gap-2 sm:gap-4 mb-4`}>
          {cells.map((item) => {
            if (!item.q) return <div key={prefix + item.key} className="aspect-square opacity-0 pointer-events-none"></div>;
            return (
              <div 
                key={prefix + item.key} 
                onClick={() => setViewedChar(item.q)}
                className="aspect-square flex flex-col items-center justify-center bg-white dark:bg-gray-800 rounded-xl sm:rounded-2xl shadow-sm border-2 border-transparent hover:border-blue-400 dark:hover:border-blue-500 cursor-pointer active:scale-95 transition-all group relative overflow-hidden"
                role="button"
              >
                <span className="text-2xl sm:text-4xl kana-text font-black text-gray-800 dark:text-gray-100 group-hover:text-blue-500 dark:group-hover:text-blue-400 transition-colors z-10">{item.q}</span>
                <span className="text-xs sm:text-sm text-gray-400 font-bold mt-0.5 sm:mt-1 z-10">{item.a[0]}</span>
                <div className="absolute inset-0 bg-blue-500/5 dark:bg-blue-500/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
              </div>
            );
          })}
        </div>
        {nCell && (
          <div className="flex justify-center mb-4">
            <div 
              onClick={() => setViewedChar(nCell.q)}
              className="w-16 h-16 sm:w-24 sm:h-24 flex flex-col items-center justify-center bg-white dark:bg-gray-800 rounded-xl sm:rounded-2xl shadow-sm border-2 border-transparent hover:border-blue-400 dark:hover:border-blue-500 cursor-pointer active:scale-95 transition-all group relative overflow-hidden"
              role="button"
            >
              <span className="text-2xl sm:text-4xl kana-text font-black text-gray-800 dark:text-gray-100 group-hover:text-blue-500 dark:group-hover:text-blue-400 transition-colors z-10">{nCell.q}</span>
              <span className="text-xs sm:text-sm text-gray-400 font-bold mt-0.5 sm:mt-1 z-10">{nCell.a[0]}</span>
              <div className="absolute inset-0 bg-blue-500/5 dark:bg-blue-500/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
            </div>
          </div>
        )}
      </div>
    );
  };

  return (
    <div className="min-h-screen flex flex-col bg-[#fcfcfc] dark:bg-gray-900 transition-colors duration-300 w-full overflow-hidden">
      {/* Header Container Global (Matching Sidebar exactly) */}
      <div className="absolute top-4 sm:top-5 left-4 sm:left-5 flex items-center gap-3 z-[60]">
         <button onClick={toggleSidebar} className="p-2 -ml-2 text-gray-400 hover:text-gray-800 dark:text-gray-400 dark:hover:text-gray-100 bg-gray-100 dark:bg-gray-800/80 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-xl transition-all focus:outline-none">
           <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2.5} stroke="currentColor" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" /></svg>
         </button>
         <h1 className="text-sm min-[380px]:text-xl sm:text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-500 to-teal-400 drop-shadow-sm flex items-center gap-2.5 tracking-tight select-none">
           chơn trunk kúc <span className="text-xs px-2 py-1 bg-gray-200 dark:bg-gray-800/80 rounded-lg text-gray-500 dark:text-gray-400 font-bold ml-1 hidden sm:block tracking-normal normal-case shadow-sm">{activeTab === 'kana' ? 'Bảng Chữ Cái' : activeTab === 'n5' ? 'Tài Liệu N5' : activeTab === 'n4' ? 'Tài Liệu N4' : 'Tài Liệu N3'}</span>
         </h1>
      </div>

      <div className="flex-1 overflow-y-auto w-full p-4 pb-20 max-w-4xl mx-auto mt-[72px] sm:mt-[76px]">
        
        {activeTab === 'kana' ? (
          <>
            {/* Main Toggles (Hiragana/Katakana) */}
            <div className="flex gap-2 max-w-sm mx-auto mb-6">
              <button onClick={()=>setChartType('hiragana')} className={`flex-1 py-3 rounded-[1.25rem] font-extrabold text-sm sm:text-base border-2 transition-all focus:outline-none shadow-sm ${chartType==='hiragana' ? 'border-[#3182ce] bg-[#3182ce]/10 text-[#3182ce] dark:bg-blue-900/40 dark:text-blue-400 dark:border-blue-500' : 'border-gray-200 bg-white text-gray-500 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400'}`}>Hiragana</button>
              <button onClick={()=>setChartType('katakana')} className={`flex-1 py-3 rounded-[1.25rem] font-extrabold text-sm sm:text-base border-2 transition-all focus:outline-none shadow-sm ${chartType==='katakana' ? 'border-[#3182ce] bg-[#3182ce]/10 text-[#3182ce] dark:bg-blue-900/40 dark:text-blue-400 dark:border-blue-500' : 'border-gray-200 bg-white text-gray-500 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400'}`}>Katakana</button>
            </div>

            {/* Sub Toggles (Basic/Dakuten/Yoon) */}
            <div className="flex bg-gray-100 dark:bg-gray-800/80 p-1.5 rounded-2xl w-full max-w-md mx-auto mb-8 font-bold text-sm shadow-inner">
              <button onClick={()=>setSubCategory('main')} className={`flex-1 py-2 sm:py-2.5 rounded-xl transition-all ${subCategory==='main' ? 'bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 shadow-sm' : 'text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200'}`}>Cơ Bản</button>
              <button onClick={()=>setSubCategory('dakuten')} className={`flex-1 py-2 sm:py-2.5 rounded-xl transition-all ${subCategory==='dakuten' ? 'bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 shadow-sm' : 'text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200'}`}>Biến Âm</button>
              <button onClick={()=>setSubCategory('combination')} className={`flex-1 py-2 sm:py-2.5 rounded-xl transition-all ${subCategory==='combination' ? 'bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 shadow-sm' : 'text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200'}`}>Chữ Ghép</button>
            </div>
                
            <div className="w-full pop-in">
               {subCategory === 'main' && (
                 <div className="pop-in">
                   <h3 className="text-lg font-bold text-gray-700 dark:text-gray-300 mb-4 pb-2 border-b border-gray-200 dark:border-gray-800 flex items-center gap-2 px-1">
                     <span className="text-xl">⭐️</span> Chữ Cơ Bản
                   </h3>
                   {renderKanaGrid(KANA_DEF[chartType].main, 'main', 'grid-cols-5')}
                 </div>
               )}

               {subCategory === 'dakuten' && (
                 <div className="pop-in">
                   <h3 className="text-lg font-bold text-gray-700 dark:text-gray-300 mb-4 pb-2 border-b border-gray-200 dark:border-gray-800 flex items-center gap-2 px-1">
                     <span className="text-xl">✨</span> Chữ Biến Âm (Dakuten)
                   </h3>
                   {renderKanaGrid(KANA_DEF[chartType].dakuten, 'daku', 'grid-cols-5')}
                 </div>
               )}

               {subCategory === 'combination' && (
                 <div className="pop-in">
                   <h3 className="text-lg font-bold text-gray-700 dark:text-gray-300 mb-4 pb-2 border-b border-gray-200 dark:border-gray-800 flex items-center gap-2 px-1">
                     <span className="text-xl">💫</span> Chữ Ghép (Yoon)
                   </h3>
                   {renderKanaGrid(KANA_DEF[chartType].combination, 'yoon', 'grid-cols-3')}
                 </div>
               )}
            </div>
          </>
        ) : activeTab === 'n5' ? (
          <N5MaterialView toggleSidebar={toggleSidebar} />
        ) : (
          <div className="w-full flex flex-col items-center justify-center py-20 pop-in">
            <div className="w-16 h-16 rounded-2xl bg-gradient-to-br from-gray-200 to-gray-300 dark:from-gray-700 dark:to-gray-600 flex items-center justify-center mb-5 shadow-lg">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className="w-8 h-8 text-gray-400 dark:text-gray-500"><path strokeLinecap="round" strokeLinejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
            </div>
            <h3 className="text-xl font-black text-gray-600 dark:text-gray-300 mb-2">Đang cập nhật</h3>
            <p className="text-sm text-gray-400 dark:text-gray-500 font-medium text-center max-w-xs">Nội dung {activeTab === 'n4' ? 'N4' : 'N3'} đang được xây dựng. Hãy quay lại sau nhé!</p>
          </div>
        )}
      </div>

      {activeTab === 'kana' && <StrokeModal char={viewedChar} onClose={() => setViewedChar('')} />}
    </div>
  );
}

// ===== N5 MATERIAL VIEW WITH SUB-TABS =====
function N5MaterialView() {
  const [n5Tab, setN5Tab] = React.useState('vocab');
  return (
    <div className="w-full pop-in">
      {/* Sub-tabs */}
      <div className="flex gap-2 max-w-sm mx-auto mb-6">
        <button onClick={()=>setN5Tab('vocab')} className={`flex-1 py-3 rounded-[1.25rem] font-extrabold text-sm sm:text-base border-2 transition-all focus:outline-none shadow-sm flex items-center justify-center gap-2 ${
          n5Tab==='vocab' ? 'border-emerald-500 bg-emerald-500/10 text-emerald-600 dark:bg-emerald-900/40 dark:text-emerald-400 dark:border-emerald-500' : 'border-gray-200 bg-white text-gray-500 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400'
        }`}>
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor" className="w-4 h-4"><path strokeLinecap="round" strokeLinejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" /></svg>
          Từ Vựng
        </button>
        <button onClick={()=>setN5Tab('kanji')} className={`flex-1 py-3 rounded-[1.25rem] font-extrabold text-sm sm:text-base border-2 transition-all focus:outline-none shadow-sm flex items-center justify-center gap-2 ${
          n5Tab==='kanji' ? 'border-purple-500 bg-purple-500/10 text-purple-600 dark:bg-purple-900/40 dark:text-purple-400 dark:border-purple-500' : 'border-gray-200 bg-white text-gray-500 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400'
        }`}>
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor" className="w-4 h-4"><path strokeLinecap="round" strokeLinejoin="round" d="M4.26 10.147a60.436 60.436 0 00-.491 6.347A48.627 48.627 0 0112 20.904a48.627 48.627 0 018.232-4.41 60.46 60.46 0 00-.491-6.347m-15.482 0a50.57 50.57 0 00-2.658-.813A59.905 59.905 0 0112 3.493a59.902 59.902 0 0110.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.697 50.697 0 0112 13.489a50.702 50.702 0 017.74-3.342" /></svg>
          Kanji
        </button>
      </div>
      {n5Tab === 'vocab' ? <N5VocabView /> : <N5KanjiView />}
    </div>
  );
}

// ===== N5 KANJI LEARNING COMPONENT =====
function N5KanjiView() {
  const topicKeys = typeof KANJI_N5_FULL !== 'undefined' ? Object.keys(KANJI_N5_FULL) : [];
  const [selectedTopic, setSelectedTopic] = React.useState(topicKeys[0] || '');
  const [flippedCards, setFlippedCards] = React.useState({});
  const [showAll, setShowAll] = React.useState(false);
  const [searchQuery, setSearchQuery] = React.useState('');

  const speak = (text, e) => {
    if (e) e.stopPropagation();
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ja-JP'; u.rate = 0.8;
      const voices = window.speechSynthesis.getVoices();
      const jpVoice = voices.find(v => v.lang.startsWith('ja'));
      if (jpVoice) u.voice = jpVoice;
      window.speechSynthesis.speak(u);
    }
  };

  const searchResults = React.useMemo(() => {
    if (!searchQuery.trim()) return null;
    const q = searchQuery.trim().toLowerCase();
    const results = [];
    topicKeys.forEach(key => {
      const topic = KANJI_N5_FULL[key];
      topic.items.forEach(item => {
        const match = item.q.includes(q) ||
          (item.a && item.a.some(a => a.toLowerCase().includes(q))) ||
          (item.m?.vi && item.m.vi.toLowerCase().includes(q)) ||
          (item.hv && item.hv.toLowerCase().includes(q)) ||
          (item.on && item.on.toLowerCase().includes(q)) ||
          (item.kun && item.kun.toLowerCase().includes(q));
        if (match) results.push(item);
      });
    });
    return results;
  }, [searchQuery]);

  const isSearching = searchResults !== null;
  const topicData = !isSearching && selectedTopic && typeof KANJI_N5_FULL !== 'undefined' ? KANJI_N5_FULL[selectedTopic] : null;
  const items = isSearching ? searchResults : (topicData ? topicData.items : []);

  const toggleFlip = (idx) => setFlippedCards(prev => ({...prev, [idx]: !prev[idx]}));
  const flipAll = () => {
    if (showAll) { setFlippedCards({}); setShowAll(false); }
    else { const all = {}; items.forEach((_, i) => { all[i] = true; }); setFlippedCards(all); setShowAll(true); }
  };

  const totalKanji = topicKeys.reduce((sum, k) => sum + (KANJI_N5_FULL[k]?.items?.length || 0), 0);

  const iconMap = {
    k5_numbers: '<path d="M7 20h10M12 4v16m-4-4l4 4 4-4"/>',
    k5_time: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
    k5_people: '<path d="M16 21v-2a4 4 0 00-4-4H8a4 4 0 00-4-4v2"/><circle cx="10" cy="7" r="4"/>',
    k5_nature: '<path d="M17 8C8 10 5.9 16.17 3.82 21.34L3 23l2.72-.86C10.82 20.1 17 16 17 8z"/>',
    k5_body: '<path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 000-7.78z"/>',
    k5_actions: '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
    k5_study: '<path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>',
    k5_directions: '<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/>',
    k5_size: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
    k5_misc: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>'
  };

  return (
    <div className="w-full pop-in">
      {/* Stats bar */}
      <div className="flex items-center justify-between mb-6 px-1">
        <div className="flex items-center gap-3">
          <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-purple-500/20">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="white" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M4.26 10.147a60.436 60.436 0 00-.491 6.347A48.627 48.627 0 0112 20.904a48.627 48.627 0 018.232-4.41 60.46 60.46 0 00-.491-6.347m-15.482 0a50.57 50.57 0 00-2.658-.813A59.905 59.905 0 0112 3.493a59.902 59.902 0 0110.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.697 50.697 0 0112 13.489a50.702 50.702 0 017.74-3.342" /></svg>
          </div>
          <div>
            <h2 className="text-lg font-black text-gray-800 dark:text-gray-100">Kanji N5</h2>
            <p className="text-xs text-gray-400 font-semibold">{totalKanji} chữ  ·  {topicKeys.length} chủ đề</p>
          </div>
        </div>
        <button onClick={flipAll} className="px-4 py-2 text-xs font-bold rounded-xl border-2 border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:border-purple-400 hover:text-purple-500 transition-all active:scale-95">
          {showAll ? 'Ẩn tất cả' : 'Hiện tất cả'}
        </button>
      </div>

      {/* Search */}
      <div className="relative mb-5">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor" className="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"><path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" /></svg>
        <input type="text" value={searchQuery} onChange={(e) => { setSearchQuery(e.target.value); setFlippedCards({}); setShowAll(false); }}
          placeholder="Tìm Kanji... (chữ Hán, Hán Việt, hoặc nghĩa)"
          className="w-full pl-11 pr-10 py-3 bg-white dark:bg-gray-800 border-2 border-gray-100 dark:border-gray-700 rounded-2xl text-sm font-medium text-gray-700 dark:text-gray-200 placeholder-gray-400 focus:outline-none focus:border-purple-400 dark:focus:border-purple-500 transition-colors shadow-sm"
        />
        {searchQuery && (
          <button onClick={() => { setSearchQuery(''); setFlippedCards({}); }} className="absolute right-3 top-1/2 -translate-y-1/2 p-1 text-gray-400 hover:text-gray-600 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2.5} stroke="currentColor" className="w-4 h-4"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
          </button>
        )}
      </div>
      {isSearching && <p className="text-xs text-gray-400 font-semibold mb-4 px-1">Tìm thấy {searchResults.length} kết quả cho "{searchQuery}"</p>}

      {/* Topic pills */}
      {!isSearching && (
        <div className="flex gap-2 mb-6 overflow-x-auto pb-2 md:flex-wrap md:overflow-visible scrollbar-thin" style={{scrollbarWidth: 'thin'}}>
          {topicKeys.map((key, i) => {
            const topic = KANJI_N5_FULL[key];
            const isActive = selectedTopic === key;
            return (
              <button key={key} onClick={() => { setSelectedTopic(key); setFlippedCards({}); setShowAll(false); }}
                className={`topic-pill flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-bold border-2 transition-all focus:outline-none whitespace-nowrap shrink-0 md:shrink ${
                  isActive ? 'border-purple-500 bg-purple-500 text-white shadow-lg shadow-purple-500/20'
                    : 'border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-500 dark:text-gray-400 hover:border-purple-300'
                }`} style={{ animationDelay: `${i * 30}ms` }}>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={isActive ? 2.5 : 1.5} stroke="currentColor" className="w-3.5 h-3.5 shrink-0" dangerouslySetInnerHTML={{__html: iconMap[key] || '<circle cx="12" cy="12" r="10"/>'}} />
                <span>{topic.label}</span>
                <span className={`px-1.5 py-0.5 rounded-md text-[10px] ${isActive ? 'bg-white/20' : 'bg-gray-100 dark:bg-gray-700 text-gray-400'}`}>{topic.items.length}</span>
              </button>
            );
          })}
        </div>
      )}

      {/* Topic header */}
      {!isSearching && topicData && (
        <div className="flex items-center gap-3 mb-5 pb-4 border-b border-gray-100 dark:border-gray-800 fade-slide-up">
          <div className="w-9 h-9 rounded-lg bg-gradient-to-br from-purple-500 to-indigo-600 flex items-center justify-center shadow-md shadow-purple-500/20">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="white" className="w-4 h-4" dangerouslySetInnerHTML={{__html: iconMap[selectedTopic] || '<circle cx="12" cy="12" r="10"/>'}} />
          </div>
          <div>
            <h3 className="text-base font-black text-gray-800 dark:text-gray-100">{topicData.label}</h3>
