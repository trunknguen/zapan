        </div>
        <div className="w-full max-w-2xl px-2 mt-3">
          <button onClick={() => setShowGames(!showGames)} className={`w-full bg-gradient-to-r from-orange-400 via-rose-500 to-purple-500 text-white rounded-2xl px-5 py-4 font-extrabold text-base sm:text-lg shadow-xl active:scale-[0.98] transition-all outline-none text-center flex justify-center items-center gap-3 group ${showGames ? 'rounded-b-none shadow-none' : ''}`}>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2.5} stroke="currentColor" className="w-8 h-8 group-hover:rotate-12 transition-transform"><path strokeLinecap="round" strokeLinejoin="round" d="M14.25 6.087c0-.355.186-.676.401-.959.221-.29.349-.634.349-1.003 0-1.036-1.007-1.875-2.25-1.875s-2.25.84-2.25 1.875c0 .369.128.713.349 1.003.215.283.401.604.401.959v0a1.5 1.5 0 01-1.5 1.5H6.94a1.5 1.5 0 00-1.06.44L4.58 7.34C3.84 8.08 4.36 9.3 5.39 9.3h2.15a1.5 1.5 0 011.5 1.5v0c0 .355-.186.676-.401.959-.221.29-.349.634-.349 1.003 0 1.036 1.007 1.875 2.25 1.875s2.25-.84 2.25-1.875c0-.369-.128-.713-.349-1.003-.215-.283-.401-.604-.401-.959v0a1.5 1.5 0 011.5-1.5h2.81a1.5 1.5 0 001.06-.44l1.3-1.3c.74-.74.22-1.96-.81-1.96h-2.15a1.5 1.5 0 01-1.5-1.5z" /></svg>
            <span>{t.games}</span>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={3} stroke="currentColor" className={`w-5 h-5 transition-transform duration-200 ${showGames ? 'rotate-180' : ''}`}><path strokeLinecap="round" strokeLinejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" /></svg>
          </button>
          {showGames && (
            <div className="bg-gradient-to-b from-purple-600/20 to-indigo-600/10 dark:from-purple-900/40 dark:to-indigo-900/30 border-2 border-t-0 border-purple-300/30 dark:border-purple-700/30 rounded-b-2xl p-3 grid grid-cols-1 sm:grid-cols-3 gap-2 sm:gap-3 pop-in">
              <button className="bg-gradient-to-b from-orange-400 to-amber-500 text-white rounded-xl px-2 py-3 font-extrabold text-sm shadow-lg hover:from-orange-500 hover:to-amber-600 active:scale-95 transition-all outline-none flex flex-col items-center justify-center gap-1 group">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2.5} stroke="currentColor" className="w-6 h-6 sm:w-8 sm:h-8 group-hover:animate-spin"><path strokeLinecap="round" strokeLinejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                <span>{t.timeAttack}</span>
                <div className="flex gap-1.5 mt-1.5 w-full justify-center">
                  <span onClick={(e)=>{e.stopPropagation();startTimeAttack(30);}} className="text-[11px] bg-black/10 hover:bg-black/20 p-1 rounded font-bold">30s</span>
                  <span onClick={(e)=>{e.stopPropagation();startTimeAttack(60);}} className="text-[11px] bg-black/20 hover:bg-black/30 p-1 rounded font-bold ring-1 ring-white">60s</span>
                  <span onClick={(e)=>{e.stopPropagation();startTimeAttack(120);}} className="text-[11px] bg-black/10 hover:bg-black/20 p-1 rounded font-bold">120s</span>
                </div>
              </button>
              <button onClick={startSurvival} className="bg-gradient-to-b from-rose-500 to-pink-600 text-white rounded-xl px-2 py-3 font-extrabold text-sm shadow-lg hover:from-rose-600 hover:to-pink-700 active:scale-95 transition-all outline-none flex flex-col items-center justify-center gap-2 group">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2.5} stroke="currentColor" className="w-6 h-6 sm:w-8 sm:h-8 group-hover:scale-125 transition-transform"><path strokeLinecap="round" strokeLinejoin="round" d="M11.412 15.655L9.75 21.75l3.745-4.012M9.257 13.5H3.75l2.659-2.849m2.048-2.194L14.25 2.25 12 8.25m0 0l4.5-4.5M18 14.25l-4.5-4.5m1.5 6l4.25 4.25m1.5-1.5l-4.25-4.25" /></svg>
                <span>{t.survival}</span>
              </button>
              <button onClick={startMatchGame} className="bg-gradient-to-b from-purple-500 to-indigo-500 text-white rounded-xl px-2 py-3 font-extrabold text-sm shadow-lg hover:from-purple-600 hover:to-indigo-600 active:scale-95 transition-all outline-none flex flex-col items-center justify-center gap-2 group">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2.5} stroke="currentColor" className="w-6 h-6 sm:w-8 sm:h-8 group-hover:-translate-y-1 transition-transform"><path strokeLinecap="round" strokeLinejoin="round" d="M13.5 16.875h3.375m0 0h3.375m-3.375 0V13.5m0 3.375v3.375M6 10.5h2.25a2.25 2.25 0 002.25-2.25V6a2.25 2.25 0 00-2.25-2.25H6A2.25 2.25 0 003.75 6v2.25A2.25 2.25 0 006 10.5zm0 9.75h2.25A2.25 2.25 0 0010.5 18v-2.25a2.25 2.25 0 00-2.25-2.25H6a2.25 2.25 0 00-2.25 2.25V18A2.25 2.25 0 006 20.25zm9.75-9.75H18a2.25 2.25 0 002.25-2.25V6A2.25 2.25 0 0018 3.75h-2.25A2.25 2.25 0 0013.5 6v2.25a2.25 2.25 0 002.25 2.25z" /></svg>
                <span>Match</span>
              </button>
            </div>
          )}
        </div>
        <div className="w-full max-w-2xl px-2 mt-3 grid grid-cols-1 sm:grid-cols-3 gap-2 sm:gap-3">
           <button onClick={() => {if(activeKanaList.length===0){alert(t.selectMin);return;} setAppState('writing');}} className="w-full bg-gradient-to-r from-teal-500 to-emerald-500 text-white rounded-2xl px-2 sm:px-4 py-3 sm:py-3.5 font-extrabold text-sm shadow-lg hover:from-teal-600 hover:to-emerald-600 active:scale-95 transition-all outline-none text-center flex items-center sm:flex-col justify-center gap-2 group">
               <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2.5} stroke="currentColor" className="w-5 h-5 sm:w-6 sm:h-6 group-hover:rotate-12 transition-transform"><path strokeLinecap="round" strokeLinejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.89 1.132l-2.685.8.8-2.685a4.5 4.5 0 011.132-1.89L16.862 4.487zm0 0L19.5 7.125" /></svg>
               <span>{t.writing}</span>
           </button>
           <button onClick={startSmartReview} className="w-full bg-gradient-to-r from-amber-500 to-yellow-500 text-white rounded-2xl px-2 sm:px-4 py-3 sm:py-3.5 font-extrabold text-sm shadow-lg hover:from-amber-600 hover:to-yellow-600 active:scale-95 transition-all outline-none text-center flex items-center sm:flex-col justify-center gap-2 group relative">
               <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2.5} stroke="currentColor" className="w-5 h-5 sm:w-6 sm:h-6 group-hover:scale-110 transition-transform"><path strokeLinecap="round" strokeLinejoin="round" d="M11.35 3.836c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m8.9-4.414c.376.023.75.05 1.124.08 1.131.094 1.976 1.057 1.976 2.192V16.5A2.25 2.25 0 0118 18.75h-2.25m-7.5-10.5H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V18.75m-7.5-10.5h6.375c.621 0 1.125.504 1.125 1.125v9.375m-8.25-3l1.5 1.5 3-3.75" /></svg>
               <span>{t.review}</span>
               {(()=>{ const c = getSmartReviewItems().length; return c > 0 ? <span className="absolute -top-2 -right-2 bg-red-500 text-white text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center shadow-md">{c > 9 ? '9+' : c}</span> : null; })()}
           </button>
           <button onClick={startConfusable} className="w-full bg-gradient-to-r from-pink-500 to-fuchsia-500 text-white rounded-2xl px-2 sm:px-4 py-3 sm:py-3.5 font-extrabold text-sm shadow-lg hover:from-pink-600 hover:to-fuchsia-600 active:scale-95 transition-all outline-none text-center flex items-center sm:flex-col justify-center gap-2 group">
               <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2.5} stroke="currentColor" className="w-5 h-5 sm:w-6 sm:h-6 group-hover:rotate-12 transition-transform"><path strokeLinecap="round" strokeLinejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" /></svg>
               <span>{t.confusable}</span>
           </button>
        </div>

        {/* === STUDY HEATMAP (FIRE THEME) === */}
        {(()=>{
          const hist = settings.studyHistory || {};
          const mins = settings.studyMinutes || {};
          const today = new Date();
          const days = [];
          for(let i=89; i>=0; i--) {
            const d = new Date(today); d.setDate(d.getDate()-i);
            const key = d.toISOString().slice(0,10);
            days.push({ date: d, key, count: hist[key]||0, minutes: mins[key]||0 });
          }
          const getFireColor = (minutes, isDark) => {
            if(minutes===0) return isDark ? '#1e293b' : '#e2e8f0';
            if(minutes<5)  return isDark ? '#7f1d1d' : '#fecaca';  // Level 1: đỏ nhạt
            if(minutes<15) return isDark ? '#b91c1c' : '#f87171';  // Level 2
            if(minutes<30) return isDark ? '#dc2626' : '#ef4444';  // Level 3
            if(minutes<45) return isDark ? '#ea580c' : '#f97316';  // Level 4
            if(minutes<60) return isDark ? '#d97706' : '#f59e0b';  // Level 5
            return isDark ? '#fbbf24' : '#f59e0b';                 // Level 6: 60+ đặc biệt
          };
          const getFireEmoji = (minutes) => {
            if(minutes===0) return '';
            if(minutes<5)  return '';
            if(minutes<15) return '';
            if(minutes<30) return '';
            if(minutes<45) return '';
            if(minutes<60) return '';
            return '🔥'; // 60+ special
          };
          const wLabels = ['T2','T3','T4','T5','T6','T7','CN'];
          const firstDow = (days[0].date.getDay()+6)%7;
          const padded = Array(firstDow).fill(null).concat(days);
          const weeks = [];
          for(let i=0; i<padded.length; i+=7) weeks.push(padded.slice(i,i+7));
          const totalMinutes = Object.values(mins).reduce((a,b)=>a+b,0);
          const totalAnswers = Object.values(hist).reduce((a,b)=>a+b,0);
          const activeDays = Object.keys(mins).filter(k=>mins[k]>0).length || Object.keys(hist).filter(k=>hist[k]>0).length;
          const legendLevels = [0, 3, 10, 20, 35, 50, 65]; // representative minute values
          return (
            <div className="w-full max-w-xl px-2 mt-6 mb-2">
              <div className="bg-white dark:bg-gray-800/60 rounded-2xl p-4 sm:p-5 border border-gray-100 dark:border-gray-700/50 shadow-sm">
                <div className="flex items-center justify-between mb-3">
                  <h3 className="text-sm font-bold text-gray-600 dark:text-gray-300 flex items-center gap-2">🔥 Lịch Học Tập</h3>
                  <div className="flex gap-3 text-xs text-gray-400 dark:text-gray-500">
                    <span><strong className="text-orange-500">{activeDays}</strong> ngày</span>
                    <span><strong className="text-red-500">{totalMinutes}</strong> phút</span>
                    <span><strong className="text-emerald-500">{totalAnswers}</strong> câu</span>
                  </div>
                </div>
                <div className="flex gap-0.5">
                  <div className="flex flex-col gap-0.5 mr-1 pt-0">
                    {wLabels.map((l,i) => <div key={i} className="h-[14px] sm:h-[16px] flex items-center text-[9px] sm:text-[10px] text-gray-400 dark:text-gray-600 font-medium leading-none">{i%2===0?l:''}</div>)}
                  </div>
                  <div className="flex gap-0.5 flex-1 overflow-hidden">
                    {weeks.map((week, wi) => (
                      <div key={wi} className="flex flex-col gap-0.5 flex-1">
                        {Array(7).fill(null).map((_, di) => {
                          const cell = week[di];
                          if(!cell) return <div key={di} className="aspect-square rounded-[3px] sm:rounded-[4px]"></div>;
                          const isToday = cell.key === today.toISOString().slice(0,10);
                          const is60Plus = cell.minutes >= 60;
                          return <div key={di} title={`${cell.key}: ${cell.minutes} phút, ${cell.count} câu`} className={`aspect-square rounded-[3px] sm:rounded-[4px] transition-colors flex items-center justify-center ${isToday?'ring-1 ring-orange-400 ring-offset-1 dark:ring-offset-gray-800':''} ${is60Plus?'fire-glow':''}`} style={{backgroundColor: getFireColor(cell.minutes, settings.isDark)}}>
                            {is60Plus && <span className="text-[6px] sm:text-[8px] leading-none">🔥</span>}
                          </div>;
                        })}
                      </div>
                    ))}
                  </div>
                </div>
                <div className="flex items-center justify-end gap-1 mt-2">
                  <span className="text-[9px] text-gray-400 dark:text-gray-500 mr-1">0'</span>
                  {legendLevels.map((m,i)=>(<div key={i} className={`w-[10px] h-[10px] sm:w-[12px] sm:h-[12px] rounded-[2px] ${m>=60?'fire-glow':''}`} style={{backgroundColor: getFireColor(m, settings.isDark)}}></div>))}
                  <span className="text-[9px] text-gray-400 dark:text-gray-500 ml-1">60'+🔥</span>
                </div>
              </div>
            </div>
          );
        })()}

        <p className="text-xs text-gray-400 dark:text-gray-600 mt-3 text-center relative w-full">
          {taHighScore>0 && <span>&#127942; {t.record}: {taHighScore}</span>}
        </p>
      </div>
    );
  }

  // --- RANDOM QUIZ ---
  if(appState==='quiz') {
    let iBorder="border-gray-200 dark:border-gray-700 dark:bg-gray-800", tClass="text-gray-800 dark:text-white", iAnim="", cBorder="border-gray-100 dark:border-gray-700";
    if(status==='correct'){iBorder="border-green-500 bg-green-50 dark:bg-green-900/30";tClass="text-green-600 dark:text-green-400";cBorder="border-green-400 dark:border-green-500";}
    else if(status==='error'){iBorder="border-red-500 bg-red-50 dark:bg-red-900/30 text-red-500";tClass="text-red-500 dark:text-red-400";iAnim="animate-shake";cBorder="border-red-300 dark:border-red-700/50";}
    if(!currentKana) return <div className="min-h-screen flex flex-col items-center justify-center font-bold text-gray-500"><div>No Data</div><button onClick={backToMenu} className="mt-4 px-4 py-2 bg-blue-500 text-white rounded-lg">Menu</button></div>;
    return (
      <div className="min-h-screen flex flex-col items-center justify-center px-4 relative overflow-hidden" tabIndex={-1} onClick={(e) => { if (!isDrawingMode && !showVirtualKb && settings.quizMode !== 'mc') focusMobileInput(e); }}>
        <input ref={mobileInputRef} onInput={handleMobileInput} type="text" autoCapitalize="off" autoCorrect="off" autoComplete="off" spellCheck="false" className="absolute opacity-0 w-0 h-0 -z-10" />
        <SettingsBar settings={settings} toggleSound={toggleSound} toggleTheme={toggleTheme} toggleLang={toggleLang} displayName={displayName} onLogout={onLogout}/>
        <button onClick={backToMenu} className="absolute top-4 sm:top-6 left-4 sm:left-6 text-gray-500 dark:text-gray-400 font-bold hover:text-gray-800 dark:hover:text-white transition px-4 py-2.5 flex items-center bg-gray-100 dark:bg-gray-800 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 text-sm z-50 shadow-sm">&#8592; Menu</button>
        <div className="absolute top-0 left-0 w-full h-1.5 bg-gray-100 dark:bg-gray-800 z-50"><div className={`h-full transition-all duration-300 ease-out ${practiceMode==='practice_mistakes'?'bg-orange-400':'bg-[#3182ce] dark:bg-blue-500'}`} style={{width:`${practiceMode==='practice_mistakes'?100:progressPercent}%`}}></div></div>
        <div className="absolute top-20 sm:top-24 w-full max-w-sm px-2 flex justify-between text-xs sm:text-sm font-semibold items-center z-20">
          <div className="flex gap-2">
            <button onClick={togglePracticeMode} disabled={practiceMode==='normal'&&mistakesPool.length===0} className={`px-3 py-1.5 sm:px-4 sm:py-2 rounded-full transition-all border ${practiceMode==='practice_mistakes'?'bg-orange-50 text-orange-600 border-orange-200 dark:bg-orange-900/40 dark:text-orange-300 dark:border-orange-800':mistakesPool.length>0?'text-gray-600 dark:text-gray-300 bg-white dark:bg-gray-800 border-gray-200 dark:border-gray-600 shadow-sm':'text-gray-300 dark:text-gray-600 border-transparent opacity-50'}`}>
              {practiceMode==='practice_mistakes'?`\uD83C\uDFAF ${t.fixMistakes}`:`${t.reviewMistakes} ${mistakesPool.length}`}
            </button>
            <button onClick={()=>{setIsDrawingMode(!isDrawingMode);setDrawingChecked(false);clearCanvas();}} className={`px-3 py-1.5 sm:px-4 sm:py-2 rounded-full transition-all border shadow-sm ${isDrawingMode?'bg-[#3182ce] text-white border-[#3182ce]':'bg-white text-gray-600 dark:bg-gray-800 dark:text-gray-300 border-gray-200 dark:border-gray-600'}`}>✍️ Tập viết</button>
          </div>
          <span className={`px-2 py-1 rounded-full bg-gray-100/50 dark:bg-gray-800/50 ${practiceMode==='practice_mistakes'?'text-orange-500':'text-gray-400 dark:text-gray-500'} ${status==='correct'?'!text-blue-500 font-bold':''}`}>{practiceMode==='practice_mistakes'?`${mistakesPool.length} ${t.cards}`:`${correctCount} / ${goalCount}`}</span>
        </div>
        <div className="w-full max-w-[320px] flex flex-col items-center mt-20 sm:mt-16">
          <div className={`w-full aspect-square bg-white dark:bg-gray-800 rounded-[2.5rem] sm:rounded-[3rem] shadow-sm border flex flex-col items-center justify-center mb-6 sm:mb-10 transition-all duration-200 relative ${cBorder} ${status==='correct'?'scale-[1.03] shadow-lg shadow-green-100/50 dark:shadow-none':'hover:scale-[1.01]'}`}>
            {currentKana.mistakeCount>0&&practiceMode==='normal'&&<div className="absolute top-5 right-5 bg-red-100 dark:bg-red-900/50 text-red-500 dark:text-red-300 text-xs font-bold px-3 py-1.5 rounded-xl border border-red-200 dark:border-red-800">{currentKana.mistakeCount} {t.mistakes}</div>}
            {status==='correct' && <div className="absolute top-5 right-5 text-sm font-bold px-3 py-1.5 rounded-xl flex items-center gap-1 pop-in bg-green-100 dark:bg-green-900/40 text-green-600 dark:text-green-300 border border-green-200 dark:border-green-800">
               {Date.now() - questionStartTimeRef.current <= 2000 ? '⚡ Nhanh' : Date.now() - questionStartTimeRef.current >= 5000 ? '🐢 Chậm' : '✅ Tốt'}
            </div>}
            {(!isDrawingMode || drawingChecked) && (
              <button onClick={(e)=>{e.stopPropagation();setShowStrokeOrder(!showStrokeOrder);}} className={`absolute top-4 left-4 p-2 rounded-full transition-colors z-10 ${showStrokeOrder?'bg-blue-100 text-blue-600 dark:bg-blue-900/50 dark:text-blue-400':'text-gray-400 hover:text-blue-500 bg-gray-50 hover:bg-blue-50 dark:bg-gray-800 dark:hover:bg-gray-700'}`} title={t.strokeOrder}>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor" className="w-5 h-5 sm:w-6 sm:h-6"><path strokeLinecap="round" strokeLinejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.89 1.132l-2.685.8.8-2.685a4.5 4.5 0 011.132-1.89L16.862 4.487zm0 0L19.5 7.125"/></svg>
              </button>
            )}
            {showStrokeOrder || (isDrawingMode && drawingChecked) ? (
              <div className="flex flex-wrap justify-center items-center gap-1 sm:gap-2 w-full p-2 h-full">
                {currentKana.question.split('').map((char, i) => {
                  const hex = char.charCodeAt(0).toString(16).padStart(5, '0');
                  return <img key={i} src={`https://raw.githubusercontent.com/KanjiVG/kanjivg/master/kanji/${hex}.svg`} alt={char} className="w-16 h-16 sm:w-24 sm:h-24 object-contain dark:invert opacity-80" />;
                })}
              </div>
            ) : (
              <span className={`leading-none text-gray-800 dark:text-gray-50 kana-text font-bold select-none drop-shadow-sm flex flex-col items-center justify-center flex-1 w-full ${(currentKana.meaning||isDrawingMode)?'mt-6':''}`}>
                {isDrawingMode && !drawingChecked ? (
                   <span className="text-[36px] sm:text-[45px] text-gray-500 dark:text-gray-400 font-normal px-4 text-center">{currentKana.meaning ? (currentKana.meaning[settings.lang]||currentKana.meaning.en) : Array.isArray(currentKana.answer)?currentKana.answer[0]:currentKana.answer}</span>
                ) : (
                   <span className={currentKana.meaning?'text-[70px] sm:text-[90px]':'text-[140px] sm:text-[160px]'}>{currentKana.question}</span>
                )}
              </span>
            )}
            {currentKana.meaning && (status==='correct' || drawingChecked) && <div className="text-lg sm:text-xl text-green-600 dark:text-green-400 font-bold mb-2 pop-in h-8">{currentKana.meaning[settings.lang]||currentKana.meaning.en}</div>}
            {(status==='correct' || drawingChecked) && currentKana.hv && <div className="flex flex-col items-center gap-1.5 mb-4 pop-in">
              <span className="inline-flex items-center gap-1 bg-orange-100 dark:bg-orange-900/40 text-orange-600 dark:text-orange-300 px-3 py-1 rounded-full text-sm font-bold border border-orange-200 dark:border-orange-700">🇻🇳 HV: {currentKana.hv}</span>
              {currentKana.hint && <span className="text-xs text-gray-500 dark:text-gray-400 italic text-center max-w-[280px] leading-relaxed">💡 {currentKana.hint}</span>}
            </div>}
            {currentKana.meaning && status!=='correct' && !drawingChecked && <div className="text-sm text-gray-400 dark:text-gray-500 mb-6 h-8 flex items-center">{t.meaning}: ?</div>}
          </div>
          {isDrawingMode ? (
            <div className="w-full flex-col items-center mt-2 px-4 sm:px-0">
              <div className="w-full text-center text-xs text-gray-400 font-bold mb-2">↕ Vuốt phần ngoài ô vẽ để cuộn trang</div>
              <div className={`relative w-full h-[220px] sm:h-[260px] bg-white dark:bg-gray-800 border-2 rounded-3xl overflow-hidden shadow-inner flex shrink-0 ${drawingChecked ? 'border-gray-200 dark:border-gray-700 opacity-80 pointer-events-none' : 'border-dashed border-[#3182ce] dark:border-blue-500 bg-blue-50/50 dark:bg-blue-900/10'}`}>
                 <canvas ref={canvasRef} width={320} height={260} className="w-full h-full touch-none cursor-crosshair" onMouseDown={startDrawingCanvas} onMouseMove={drawCanvas} onMouseUp={stopDrawingCanvas} onMouseOut={stopDrawingCanvas} onTouchStart={startDrawingCanvas} onTouchMove={drawCanvas} onTouchEnd={stopDrawingCanvas}/>
                 {!drawingChecked && (
                    <button onClick={clearCanvas} className="absolute top-2 right-2 p-2 bg-gray-100 dark:bg-gray-700 text-gray-500 rounded-full hover:bg-gray-200 active:scale-95 shadow-sm">
                      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" /></svg>
                    </button>
                 )}
              </div>
              {!drawingChecked && (
                <button onClick={()=>setDrawingChecked(true)} className="w-full mt-4 bg-[#3182ce] text-white rounded-2xl py-4 font-bold text-lg shadow-md active:scale-95 transition-all">Hiện đáp án</button>
              )}
              {drawingChecked && (
                <div className="flex gap-4 w-full mt-4 pop-in">
                  <button onClick={handleErrorRandom} className="flex-1 bg-red-50 text-red-600 border border-red-200 dark:bg-red-900/40 dark:border-red-800 dark:text-red-400 rounded-2xl py-4 font-bold text-lg hover:bg-red-100 active:scale-95 transition-all shadow-sm flex items-center justify-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" /></svg> {t.wrong}</button>
                  <button onClick={handleCorrectRandom} className="flex-1 bg-green-500 text-white border border-green-600 dark:border-green-400 rounded-2xl py-4 font-bold text-lg hover:bg-green-600 active:scale-95 transition-all shadow-md flex items-center justify-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor" className="w-5 h-5 text-white"><path strokeLinecap="round" strokeLinejoin="round" d="M4.5 12.75l6 6 9-13.5" /></svg> {t.correct}</button>
                </div>
              )}
            </div>
          ) : settings.quizMode === 'mc' ? (
            <div className={`w-full relative px-2 sm:px-0 mt-4`}>
               <div className="flex flex-col gap-2.5 w-full">
                 {multipleChoiceOptions.length > 0 ? multipleChoiceOptions.map((opt, i) => (
                    <button key={i} onClick={() => handleMultipleChoiceSelect(opt)} className="w-full bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 border-2 border-gray-100 dark:border-gray-700 py-4 px-6 rounded-2xl shadow-sm text-center text-xl sm:text-2xl font-bold hover:bg-blue-50 dark:hover:bg-gray-700 hover:border-[#3182ce] hover:text-[#3182ce] dark:hover:text-blue-400 active:scale-95 transition-all">
                       {Array.isArray(opt.answer) ? opt.answer[0] : opt.answer}
                    </button>
                 )) : (
                    <div className="text-gray-400 text-center mt-4">Không đủ từ vựng (cần ít nhất 5 từ)</div>
                 )}
               </div>
            </div>
          ) : (
            <div className={`w-full relative ${iAnim} px-2 sm:px-0 mt-2`}>
              <div className={`w-full px-12 py-4 sm:py-5 text-center text-[22px] sm:text-4xl font-semibold border-2 rounded-2xl sm:rounded-3xl transition-all min-h-[66px] sm:min-h-[78px] flex items-center justify-center select-none cursor-text relative ${iBorder} ${tClass}`}>
                <button onClick={(e)=>{e.stopPropagation();setShowVirtualKb(!showVirtualKb);}} className={`absolute right-3 sm:right-4 p-2 sm:p-2.5 rounded-xl transition-all z-10 ${showVirtualKb?'bg-[#3182ce] text-white shadow-md':'text-gray-400 hover:text-blue-500 hover:bg-blue-50 dark:hover:bg-gray-700'}`} title="Virtual Keyboard">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor" className="w-6 h-6 sm:w-7 sm:h-7"><path strokeLinecap="round" strokeLinejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h12A2.25 2.25 0 0120.25 6v12a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18V6z" /><path strokeLinecap="round" strokeLinejoin="round" d="M6 10.5h.008v.008H6v-.008zm3 0h.008v.008H9v-.008zm3 0h.008v.008H12v-.008zm3 0h.008v.008H15v-.008zm3 0h.008v.008H18v-.008zm-9 3h.008v.008H9v-.008zm3 0h.008v.008H12v-.008zm3 0h.008v.008H15v-.008zm-3 3h.008v.008H12v-.008z" /></svg>
                </button>
                {inputValue||<span className="font-normal text-gray-300 dark:text-gray-500">{t.romaji}</span>}
              </div>
              {!showVirtualKb && <div className="text-center text-xs text-gray-400 dark:text-gray-600 mt-2">{t.typeHere}</div>}
              {showVirtualKb && (
                <div className="flex flex-wrap justify-center content-start gap-1 sm:gap-1.5 mt-3 max-h-56 overflow-y-auto bg-gray-100 dark:bg-gray-800 p-2 rounded-xl shadow-inner pop-in border border-gray-200 dark:border-gray-700" onClick={(e)=>e.stopPropagation()}>
                  <button onClick={handleVirtualBackspace} className="w-[48px] h-[52px] sm:w-[56px] sm:h-[60px] bg-red-100 text-red-600 dark:bg-red-900/40 dark:text-red-400 rounded-xl shadow-sm font-bold text-lg sm:text-xl flex items-center justify-center hover:bg-red-200 active:scale-95 transition-all">&#x232B;</button>
                  {['main','dakuten','combination'].map(cat => KANA_DEF[selectedAlphabet][cat] && KANA_DEF[selectedAlphabet][cat].map(g => g.items.map(i => (
                    <button key={i.q} onClick={() => handleVirtualKey(i.q)} className="w-[48px] h-[52px] sm:w-[56px] sm:h-[60px] bg-white text-gray-800 dark:bg-gray-700 dark:text-gray-100 rounded-xl shadow-sm border border-gray-200 dark:border-gray-600 flex flex-col items-center justify-center hover:bg-[#3182ce] hover:text-white dark:hover:bg-blue-600 hover:border-transparent active:scale-95 transition-all">
                      <span className="text-base sm:text-lg font-bold kana-text leading-none">{i.q}</span>
                      <span className="text-[10px] sm:text-xs text-[#3182ce] dark:text-blue-300 font-medium mt-1">{Array.isArray(i.a)?i.a[0]:i.a}</span>
                    </button>
                  ))))}
                </div>
              )}
            </div>
          )}
          
          {/* Mode Toggle UI */}
          {!isDrawingMode && (
             <div className="w-full flex justify-center mt-6 z-10">
                <div className="bg-gray-100 dark:bg-gray-800 p-1 flex gap-1 rounded-full shadow-inner border border-gray-200 dark:border-gray-700 w-full max-w-[280px]">
                   <button 
                      onClick={() => { setSettings({...settings, quizMode: 'typing'}); localStorage.setItem(SETTINGS_KEY, JSON.stringify({...settings, quizMode: 'typing'})); }} 
                      className={`flex-1 py-2 text-sm font-bold rounded-full transition-all ${settings.quizMode!=='mc'?'bg-white dark:bg-gray-700 text-blue-600 dark:text-blue-400 shadow-sm':'text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200'}`}
                   >
                      ✍️ Gõ phím
                   </button>
                   <button 
                      onClick={() => { 
                         setSettings({...settings, quizMode: 'mc'}); 
                         localStorage.setItem(SETTINGS_KEY, JSON.stringify({...settings, quizMode: 'mc'})); 
                         if(activeQuizData.length>=5) setMultipleChoiceOptions(generateMultipleChoiceOptions(currentKanaRef.current, activeQuizData));
                      }} 
                      className={`flex-1 py-2 text-sm font-bold rounded-full transition-all ${settings.quizMode==='mc'?'bg-white dark:bg-gray-700 text-blue-600 dark:text-blue-400 shadow-sm':'text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200'}`}
                   >
                      🎯 Trắc nghiệm
                   </button>
                </div>
             </div>
          )}
        </div>
      </div>
    );
  }


  // --- TIME ATTACK RENDER ---
  if(appState==='timeattack') {
    const taKana = activeKanaList[taCurrentIdx]||activeKanaList[0];
    const timerPct = (taTimeLeft/60)*100;
    const isUrgent = taTimeLeft<=10;
    let taBorder='border-gray-200 dark:border-gray-700 dark:bg-gray-800', taTxt='text-gray-800 dark:text-white', taAnim='', taCard='border-gray-100 dark:border-gray-700';
    if(taStatus==='correct'){taBorder='border-green-500 bg-green-50 dark:bg-green-900/30';taTxt='text-green-600 dark:text-green-400';taCard='border-green-400';}
    else if(taStatus==='error'){taBorder='border-red-500 bg-red-50 dark:bg-red-900/30';taTxt='text-red-500';taAnim='animate-shake';taCard='border-red-300';}
    return (
      <div className="min-h-screen flex flex-col items-center justify-center px-4 relative overflow-hidden" tabIndex={-1} onClick={() => { if ((settings.taQuizType||'typing') !== 'mc') focusMobileInput(); }}>
        <input ref={mobileInputRef} onInput={handleMobileInput} type="text" autoCapitalize="off" autoCorrect="off" autoComplete="off" spellCheck="false" className="absolute opacity-0 w-0 h-0 -z-10" />
        <SettingsBar settings={settings} toggleSound={toggleSound} toggleTheme={toggleTheme} toggleLang={toggleLang} displayName={displayName} onLogout={onLogout}/>
        <button onClick={()=>{setTaRunning(false);backToMenu();}} className="absolute top-4 sm:top-6 left-4 sm:left-6 text-gray-500 dark:text-gray-400 font-bold hover:text-gray-800 dark:hover:text-white transition px-4 py-2.5 flex items-center bg-gray-100 dark:bg-gray-800 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 text-sm z-50 shadow-sm">&#8592; Menu</button>
        {showConfetti && Array.from({length:60}).map((_,i)=><div key={i} className="confetti-piece" style={{left:`${Math.random()*100}%`,background:`hsl(${Math.random()*360},80%,60%)`,borderRadius:Math.random()>0.5?'50%':'0',width:`${6+Math.random()*8}px`,height:`${6+Math.random()*8}px`,animationDelay:`${Math.random()*2}s`,animationDuration:`${2+Math.random()*2}s`}}/>)}
        <div className="absolute top-0 left-0 w-full h-2 bg-gray-100 dark:bg-gray-800 z-50"><div className={`h-full transition-all duration-1000 ease-linear ${isUrgent?'bg-red-500':'bg-gradient-to-r from-orange-400 to-red-500'}`} style={{width:`${timerPct}%`}}/></div>
        {taFinished ? (
          <div className="flex flex-col items-center gap-6 pop-in">
            <div className="text-7xl sm:text-8xl font-black text-transparent bg-clip-text bg-gradient-to-r from-orange-500 to-red-500">{taScore}</div>
            <div className="text-xl font-bold text-gray-500 dark:text-gray-400">{t.scoreIn60}</div>
            {taScore>=taHighScore&&taScore>0&&<div className="text-2xl font-extrabold text-yellow-500 pop-in">&#127942; {t.newRecord}</div>}
            <div className="text-sm text-gray-400 dark:text-gray-500">{t.highScore}: {taHighScore}</div>
            
            {(()=>{
               let lb = [];
               try { lb = JSON.parse(localStorage.getItem('kana_global_leaderboard')) || []; } catch(e){}
               if (lb.length === 0) return null;
               return (
                 <div className="w-full max-w-sm mt-2 bg-white dark:bg-gray-800/80 rounded-2xl shadow-sm border border-orange-100 dark:border-gray-700 p-4">
                    <h3 className="text-center font-bold text-orange-500 mb-3 border-b border-gray-100 dark:border-gray-700 pb-2">&#127942; Bảng Xếp Hạng</h3
                    ><div className="space-y-2">
                       {lb.slice(0,5).map((user, i) => (
                          <div key={user.username} className={`flex justify-between items-center p-2 rounded-lg transition-colors ${user.username===currentUser?'bg-orange-50 dark:bg-orange-900/30 border border-orange-200 dark:border-orange-800/50 font-bold text-orange-600 dark:text-orange-400':'text-gray-600 dark:text-gray-300'}`}>
                             <div className="flex items-center gap-3">
                                <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${i===0?'bg-yellow-400 text-white shadow-sm':i===1?'bg-gray-300 text-gray-700':i===2?'bg-amber-600 text-white':'bg-gray-100 dark:bg-gray-700'}`}>{i+1}</span>
                                <span>{user.username} {user.username===currentUser&&<span className="text-[10px] bg-orange-200 text-orange-700 dark:bg-orange-800 dark:text-orange-200 px-1.5 py-0.5 rounded ml-1">Bạn</span>}</span>
                             </div>
                             <span className="font-mono">{user.score}</span>
                          </div>
                       ))}
                    </div>
                 </div>
               );
            })()}

            <div className="flex gap-4 mt-2">
              <button onClick={startTimeAttack} className="bg-gradient-to-r from-orange-500 to-red-500 text-white rounded-2xl px-8 py-3 font-bold text-base shadow-lg active:scale-95 transition-all">&#128260; {t.playAgain}</button>
              <button onClick={backToMenu} className="bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200 rounded-2xl px-8 py-3 font-bold text-base shadow-lg active:scale-95 transition-all">{t.menu}</button>
            </div>
          </div>
        ) : taPreStart === 'setup' ? (
          <div className="flex flex-col items-center bg-white dark:bg-gray-800 p-8 rounded-3xl shadow-xl max-w-sm w-full border border-gray-100 dark:border-gray-700 pop-in z-20">
             <div className="text-4xl mb-4">⏱️</div>
             <h2 className="text-2xl font-black text-orange-500 mb-6 text-center">60 Giây</h2>
             <p className="text-sm text-gray-500 text-center mb-6">Gõ đáp án nhanh nhất có thể trong 60 giây! Chọn hình thức trả lời.</p>
             
             <div className="w-full mb-6">
                <div className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 text-center">Hình thức</div>
                <div className="flex bg-gray-100 dark:bg-gray-700 p-1 rounded-xl w-full">
                   <button onClick={() => setSettings(p=>({...p, taQuizType: 'typing'}))} className={`flex-1 py-2.5 rounded-lg font-bold text-sm transition-all ${(settings.taQuizType||'typing')==='typing'?'bg-white dark:bg-gray-600 text-orange-600 dark:text-orange-400 shadow-sm':'text-gray-500 dark:text-gray-400'}`}>✍️ Gõ phím</button>
                   <button onClick={() => setSettings(p=>({...p, taQuizType: 'mc'}))} className={`flex-1 py-2.5 rounded-lg font-bold text-sm transition-all ${settings.taQuizType==='mc'?'bg-white dark:bg-gray-600 text-orange-600 dark:text-orange-400 shadow-sm':'text-gray-500 dark:text-gray-400'}`}>🎯 Trắc nghiệm</button>
                </div>
             </div>
             
             <button onClick={()=>{setTaPreStart(3); taQuestionStartTimeRef.current = Date.now() + 3000; const idx0=Math.floor(Math.random()*activeKanaList.length); setTaCurrentIdx(idx0); setTaMcOptions(generateMultipleChoiceOptions(activeKanaList[idx0], activeKanaList));}} className="w-full bg-gradient-to-r from-orange-400 to-amber-500 text-white rounded-xl py-4 font-black shadow-lg hover:shadow-orange-500/30 active:scale-95 transition-all text-lg tracking-wide">BẮT ĐẦU</button>
          </div>
        ) : taPreStart > 0 ? (
          <div className="flex flex-col items-center justify-center pt-20">
            <div className="text-8xl font-black text-orange-500 pop-in animate-pulse">{taPreStart}</div>
            <div className="text-xl font-bold text-gray-500 mt-4">Sẵn sàng!</div>
          </div>
        ) : taKana ? (
          <div className="w-full max-w-[320px] flex flex-col items-center mt-16 sm:mt-12">
            <div className="flex items-center justify-between w-full mb-4 px-2">
              <div className={`text-4xl sm:text-5xl font-black tabular-nums ${isUrgent?'text-red-500 animate-pulse':'text-orange-500'}`}>{taTimeLeft}<span className="text-lg font-bold">s</span></div>
              <div className="text-4xl sm:text-5xl font-black text-[#3182ce] dark:text-blue-400 tabular-nums">{taScore}</div>
            </div>
            <div className={`w-full aspect-square bg-white dark:bg-gray-800 rounded-[2.5rem] sm:rounded-[3rem] shadow-sm border flex items-center justify-center mb-6 sm:mb-10 transition-all ${taCard} ${taStatus==='correct'?'scale-[1.03]':''}`}>
              <span className="text-[140px] sm:text-[160px] leading-none text-gray-800 dark:text-gray-50 kana-text font-bold select-none drop-shadow-sm">{taKana.question}</span>
            </div>
            {(settings.taQuizType==='mc') ? (
              <div className="flex flex-col gap-2 w-full px-2 sm:px-0">
                {taMcOptions.length > 0 ? taMcOptions.map((opt, oi) => (
                  <button key={oi} onClick={() => {
                    if(taStatusRef.current !== 'idle') return;
                    const kana = activeKanaList[taCurrentIdx]; if(!kana) return;
                    if(opt.id === kana.id) {
                      setTaStatus('correct'); taStatusRef.current='correct';
                      setTaScore(p=>{const ns=p+1;taScoreRef.current=ns;return ns;});
                      if(kana.mistakeCount>0) setActiveData(d=>d.map(k=>k.id===kana.id?{...k,mistakeCount:Math.max(0,k.mistakeCount-1)}:k));
                      speakKana(kana.question,settings.isSound);
                      setTimeout(()=>{
                        setTaInputValue('');taInputRef.current='';
                        const taNextIdx = genWeightedNext(activeKanaList,taCurrentIdx); setTaCurrentIdx(taNextIdx); setTaMcOptions(generateMultipleChoiceOptions(activeKanaList[taNextIdx], activeKanaList));
                        setTaStatus('idle');taStatusRef.current='idle';
                      },200);
                    } else {
                      setTaStatus('error'); taStatusRef.current='error';
                      setActiveData(d=>d.map(k=>k.id===kana.id?{...k,mistakeCount:k.mistakeCount+1}:k));
                      setTimeout(()=>{setTaStatus('idle');taStatusRef.current='idle';},300);
                    }
                  }} className={`w-full bg-white dark:bg-gray-800 border-2 border-gray-100 dark:border-gray-700 py-3 px-4 rounded-xl shadow-sm text-center text-lg sm:text-xl font-bold hover:bg-blue-50 dark:hover:bg-gray-700 hover:border-[#3182ce] hover:text-[#3182ce] dark:hover:text-blue-400 active:scale-95 transition-all`}>
                    {Array.isArray(opt.answer) ? opt.answer[0] : opt.answer}
                  </button>
                )) : null}
              </div>
            ) : (
            <div className={`w-full relative ${taAnim} px-2 sm:px-0`}>
              <div className={`w-full px-6 py-4 sm:py-5 text-center text-[22px] sm:text-4xl font-semibold border-2 rounded-2xl sm:rounded-3xl transition-all min-h-[66px] sm:min-h-[78px] flex items-center justify-center select-none cursor-text ${taBorder} ${taTxt}`}>
                {taInputValue||<span className="font-normal text-gray-300 dark:text-gray-500">{t.typefast}</span>}
              </div>
            </div>
            )}
            </div>
        ) : null}
      </div>
    );
  }

  // --- SURVIVAL MODE RENDER ---
  if(appState==='survival') {
    const svKana = activeKanaList[svCurrentIdx]||activeKanaList[0];
    let svBorder='border-gray-200 dark:border-gray-700 dark:bg-gray-800', svTxt='text-gray-800 dark:text-white', svAnim='', svCard='border-gray-100 dark:border-gray-700';
    if(svStatus==='correct'){svBorder='border-green-500 bg-green-50 dark:bg-green-900/30';svTxt='text-green-600 dark:text-green-400';svCard='border-green-400';}
    else if(svStatus==='error'){svBorder='border-red-500 bg-red-50 dark:bg-red-900/30';svTxt='text-red-500';svAnim='animate-shake';svCard='border-red-300';}
    
    return (
      <div className="min-h-screen flex flex-col items-center justify-center px-4 relative overflow-hidden" tabIndex={-1} onClick={() => { if ((settings.svQuizType||'typing') !== 'mc') focusMobileInput(); }}>
        <input ref={mobileInputRef} onInput={handleMobileInput} type="text" autoCapitalize="off" autoCorrect="off" autoComplete="off" spellCheck="false" className="absolute opacity-0 w-0 h-0 -z-10" />
        <SettingsBar settings={settings} toggleSound={toggleSound} toggleTheme={toggleTheme} toggleLang={toggleLang} displayName={displayName} onLogout={onLogout}/>
        <button onClick={()=>{setSvRunning(false);backToMenu();}} className="absolute top-4 sm:top-6 left-4 sm:left-6 text-gray-500 dark:text-gray-400 font-bold hover:text-gray-800 dark:hover:text-white transition px-4 py-2.5 flex items-center bg-gray-100 dark:bg-gray-800 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 text-sm z-50 shadow-sm">&#8592; Menu</button>
        {showConfetti && Array.from({length:60}).map((_,i)=><div key={i} className="confetti-piece" style={{left:`${Math.random()*100}%`,background:`hsl(${Math.random()*360},80%,60%)`,borderRadius:Math.random()>0.5?'50%':'0',width:`${6+Math.random()*8}px`,height:`${6+Math.random()*8}px`,animationDelay:`${Math.random()*2}s`,animationDuration:`${2+Math.random()*2}s`}}/>)}
        
        {svFinished ? (
          <div className="flex flex-col items-center gap-6 pop-in">
            <h2 className="text-4xl font-extrabold text-red-500">{t.survivalOver}</h2>
            <div className="text-7xl sm:text-8xl font-black text-[#3182ce]">{svStreak}</div>
            <div className="text-xl font-bold text-gray-500 dark:text-gray-400">{t.survivalScore}</div>
            {svStreak>=svHighScore&&svStreak>0&&<div className="text-2xl font-extrabold text-yellow-500 pop-in">&#127942; {t.newRecord}</div>}
            <div className="text-sm text-gray-400 dark:text-gray-500">{t.record}: {svHighScore}</div>
            
            <div className="flex gap-4 mt-6">
              <button onClick={()=>startSurvival(true)} className="bg-gradient-to-r from-rose-500 to-pink-600 text-white rounded-2xl px-8 py-3 font-bold text-base shadow-lg active:scale-95 transition-all">&#128260; {t.playAgain}</button>
              <button onClick={backToMenu} className="bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200 rounded-2xl px-8 py-3 font-bold text-base shadow-lg active:scale-95 transition-all">{t.menu}</button>
            </div>
          </div>
        ) : svPreStart === 'setup' ? (
          <div className="flex flex-col items-center bg-white dark:bg-gray-800 p-8 rounded-3xl shadow-xl max-w-sm w-full border border-gray-100 dark:border-gray-700 pop-in z-20">
             <div className="text-4xl mb-4">⚔️</div>
             <h2 className="text-2xl font-black text-rose-500 mb-6 text-center">Chế Độ Sinh Tồn</h2>
             <p className="text-sm text-gray-500 text-center mb-6">Chọn thời gian đếm ngược trả lời cho mỗi câu hỏi. Sai hoặc hết hạn sẽ bị trừ tim.</p>
             <div className="grid grid-cols-2 gap-3 w-full mb-6">
                <button onClick={() => setSettings(p=>({...p, survivalTimer: 5}))} className={`py-3 rounded-xl font-bold border-2 transition-all ${settings.survivalTimer===5?'border-rose-500 bg-rose-50 text-rose-600 dark:bg-rose-900/40 dark:text-rose-400':'border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300'}`}>5 Giây</button>
                <button onClick={() => setSettings(p=>({...p, survivalTimer: 10}))} className={`py-3 rounded-xl font-bold border-2 transition-all ${settings.survivalTimer===10?'border-rose-500 bg-rose-50 text-rose-600 dark:bg-rose-900/40 dark:text-rose-400':'border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300'}`}>10 Giây</button>
                <button onClick={() => setSettings(p=>({...p, survivalTimer: 15}))} className={`py-3 rounded-xl font-bold border-2 transition-all ${settings.survivalTimer===15?'border-rose-500 bg-rose-50 text-rose-600 dark:bg-rose-900/40 dark:text-rose-400':'border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300'}`}>15 Giây</button>
                <button onClick={() => setSettings(p=>({...p, survivalTimer: 0}))} className={`py-3 rounded-xl font-bold border-2 transition-all ${settings.survivalTimer===0?'border-emerald-500 bg-emerald-50 text-emerald-600 dark:bg-emerald-900/40 dark:text-emerald-400':'border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300'}`}>♾ Vô hạn</button>
             </div>
             <div className="w-full mb-6">
                <div className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 text-center">Hình thức trả lời</div>
                <div className="flex bg-gray-100 dark:bg-gray-700 p-1 rounded-xl w-full">
                   <button onClick={() => setSettings(p=>({...p, svQuizType: 'typing'}))} className={`flex-1 py-2.5 rounded-lg font-bold text-sm transition-all ${(settings.svQuizType||'typing')==='typing'?'bg-white dark:bg-gray-600 text-rose-600 dark:text-rose-400 shadow-sm':'text-gray-500 dark:text-gray-400'}`}>✍️ Gõ phím</button>
                   <button onClick={() => setSettings(p=>({...p, svQuizType: 'mc'}))} className={`flex-1 py-2.5 rounded-lg font-bold text-sm transition-all ${settings.svQuizType==='mc'?'bg-white dark:bg-gray-600 text-rose-600 dark:text-rose-400 shadow-sm':'text-gray-500 dark:text-gray-400'}`}>🎯 Trắc nghiệm</button>
                </div>
             </div>
             <button onClick={()=>{svQuestionStartTimeRef.current=Date.now()+3000; const svIdx0=Math.floor(Math.random()*activeKanaList.length); setSvMcOptions(generateMultipleChoiceOptions(activeKanaList[svIdx0], activeKanaList)); startSurvival(true);}} className="w-full bg-gradient-to-r from-rose-500 to-pink-600 text-white rounded-xl py-4 font-black shadow-lg hover:shadow-rose-500/30 active:scale-95 transition-all text-lg tracking-wide">BẮT ĐẦU</button>
          </div>
        ) : svPreStart > 0 ? (
          <div className="flex flex-col items-center justify-center pt-20">
            <div className="text-8xl font-black text-[#3182ce] pop-in animate-pulse">{svPreStart}</div>
            <div className="text-xl font-bold text-gray-500 mt-4">Sẵn sàng!</div>
          </div>
        ) : svKana ? (
          <div className="w-full max-w-[320px] flex flex-col items-center mt-16 sm:mt-12">
            <div className="flex items-center justify-between w-full mb-4 px-2">
              <div className="flex gap-1 text-2xl">
                {Array.from({length:3}).map((_,i) => (
                   <span key={i} className={`transition-all ${i<svLives ? 'text-red-500 filter drop-shadow hover:scale-110' : 'text-gray-300 dark:text-gray-700 grayscale opacity-50'} ${svStatus==='error'&&i===svLives?'animate-ping':''}`}>❤️</span>
                ))}
              </div>
              <div className="flex flex-col items-center flex-1 mx-4">
                {settings.survivalTimer > 0 ? (
                  <div className="w-full h-2 bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden">
                    <div className={`h-full transition-all duration-1000 ease-linear ${svTimeLeft<=2?'bg-red-500':'bg-[#3182ce] dark:bg-blue-500'}`} style={{width: `${(svTimeLeft/settings.survivalTimer)*100}%`}}></div>
                  </div>
                ) : (
                  <div className="text-xs text-gray-400 dark:text-gray-600 font-bold uppercase tracking-wider">Thời gian vô hạn</div>
                )}
              </div>
              <div className="text-4xl sm:text-5xl font-black text-[#3182ce] dark:text-blue-400 tabular-nums">{svStreak}</div>
            </div>
            <div className={`w-full aspect-square bg-white dark:bg-gray-800 rounded-[2.5rem] sm:rounded-[3rem] shadow-sm border flex items-center justify-center mb-6 sm:mb-10 transition-all ${svCard} ${svStatus==='correct'?'scale-[1.03]':''}`}>
              {(!svKana.meaning) ? (
                 <span className="text-[140px] sm:text-[160px] leading-none text-gray-800 dark:text-gray-50 kana-text font-bold select-none drop-shadow-sm">{svKana.question}</span>
              ) : (
                 <span className="text-gray-800 dark:text-gray-50 kana-text font-bold select-none drop-shadow-sm flex flex-col items-center justify-center flex-1 w-full mt-6">
                    <span className="text-[70px] sm:text-[90px] leading-none">{svKana.question}</span>
                 </span>
              )}
            </div>
            {(settings.svQuizType==='mc') ? (
              <div className="flex flex-col gap-2 w-full px-2 sm:px-0">
                {svMcOptions.length > 0 ? svMcOptions.map((opt, oi) => (
                  <button key={oi} onClick={() => {
                    if(svStatusRef.current !== 'idle') return;
                    const kana = activeKanaList[svCurrentIdx]; if(!kana) return;
                    if(opt.id === kana.id) {
                      setSvStatus('correct'); svStatusRef.current='correct';
                      setSvStreak(p=>{const ns=p+1;svStreakRef.current=ns;return ns;});
                      if(kana.mistakeCount>0) setActiveData(d=>d.map(k=>k.id===kana.id?{...k,mistakeCount:Math.max(0,k.mistakeCount-1)}:k));
                      speakKana(kana.question,settings.isSound);
                      setTimeout(()=>{
                        setSvInputValue('');svInputRef.current='';
                        const svNextIdx = genWeightedNext(activeKanaList,svCurrentIdx); setSvCurrentIdx(svNextIdx); setSvMcOptions(generateMultipleChoiceOptions(activeKanaList[svNextIdx], activeKanaList));
                        setSvStatus('idle');svStatusRef.current='idle';
                        setSvTimeLeft(settings.survivalTimer || 5);
                      },200);
                    } else {
                      setSvStatus('error'); svStatusRef.current='error';
                      setActiveData(d=>d.map(k=>k.id===kana.id?{...k,mistakeCount:k.mistakeCount+1}:k));
                      speakKana(kana.question,settings.isSound);
                      const newLives = svLivesRef.current - 1;
                      setSvLives(newLives); svLivesRef.current = newLives;
                      if(newLives <= 0) {
                        setTimeout(() => {
                          setSvRunning(false); setSvFinished(true);
                          const score = svStreakRef.current;
                          if (score > svHighScore) {
                             setSvHighScore(score);
                             localStorage.setItem(SURVIVAL_HIGHSCORE_KEY, score.toString());
                             setShowConfetti(true); setTimeout(()=>setShowConfetti(false),4000); 
                          }
                        }, 600);
                      } else {
                        setTimeout(()=>{setSvStatus('idle');svStatusRef.current='idle';setSvInputValue('');svInputRef.current='';setSvTimeLeft(settings.survivalTimer || 5);
                          const svNextIdx2 = genWeightedNext(activeKanaList,svCurrentIdx); setSvCurrentIdx(svNextIdx2); setSvMcOptions(generateMultipleChoiceOptions(activeKanaList[svNextIdx2], activeKanaList));
                        },500);
                      }
                    }
                  }} className={`w-full bg-white dark:bg-gray-800 border-2 border-gray-100 dark:border-gray-700 py-3 px-4 rounded-xl shadow-sm text-center text-lg sm:text-xl font-bold hover:bg-blue-50 dark:hover:bg-gray-700 hover:border-rose-500 hover:text-rose-500 dark:hover:text-rose-400 active:scale-95 transition-all`}>
                    {Array.isArray(opt.answer) ? opt.answer[0] : opt.answer}
                  </button>
                )) : null}
              </div>
            ) : (
            <div className={`w-full relative ${svAnim} px-2 sm:px-0`}>
              <div className={`w-full px-6 py-4 sm:py-5 text-center text-[22px] sm:text-4xl font-semibold border-2 rounded-2xl sm:rounded-3xl transition-all min-h-[66px] sm:min-h-[78px] flex items-center justify-center select-none cursor-text ${svBorder} ${svTxt}`}>
                {svInputValue||<span className="font-normal text-gray-300 dark:text-gray-500">{t.typefast}</span>}
              </div>
            </div>
            )}
            </div>
        ) : null}
      </div>
    );
  }

  // --- FILL ALL ---
  if(appState==='fill') {
    const correctCnt = Object.values(fillResults).filter(r=>r==='correct').length;
    const wrongCnt = Object.values(fillResults).filter(r=>r==='wrong').length;
    return (
      <div className="min-h-screen flex flex-col items-center px-3 sm:px-6 py-4 sm:py-8 relative" onClick={focusMobileInput}>
        <input ref={mobileInputRef} onInput={handleMobileInput} type="text" autoCapitalize="off" autoCorrect="off" autoComplete="off" spellCheck="false" className="absolute opacity-0 w-0 h-0 -z-10" />
        <SettingsBar settings={settings} toggleSound={toggleSound} toggleTheme={toggleTheme} toggleLang={toggleLang} displayName={displayName} onLogout={onLogout}/>
        <button onClick={backToMenu} className="absolute top-4 sm:top-6 left-4 sm:left-6 text-gray-500 dark:text-gray-400 font-bold hover:text-gray-800 dark:hover:text-white transition px-4 py-2.5 flex items-center bg-gray-100 dark:bg-gray-800 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 text-sm z-50 shadow-sm">&#8592; Menu</button>

        <h2 className="text-xl sm:text-2xl font-extrabold text-[#3182ce] dark:text-blue-400 mt-12 sm:mt-4 mb-2">{t.fillTitle}</h2>

        {!fillFinished && (
          <div className="flex gap-2 mb-4 bg-gray-100 dark:bg-gray-800 p-1 rounded-lg">
            <button onClick={()=>{setFillCheckMode('instant');setFillResults({});setFillAnswers({});setShuffledFillList(shuffle(activeKanaList));}} className={`px-4 py-2 rounded-md text-sm font-bold transition-all ${fillCheckMode==='instant'?'bg-white dark:bg-gray-700 text-blue-600 dark:text-blue-300 shadow-sm':'text-gray-500 dark:text-gray-400'}`}>{t.checkNow}</button>
            <button onClick={()=>{setFillCheckMode('finish');setFillResults({});setFillAnswers({});setShuffledFillList(shuffle(activeKanaList));}} className={`px-4 py-2 rounded-md text-sm font-bold transition-all ${fillCheckMode==='finish'?'bg-white dark:bg-gray-700 text-emerald-600 dark:text-emerald-300 shadow-sm':'text-gray-500 dark:text-gray-400'}`}>{t.finishCheck}</button>
          </div>
        )}

        {fillFinished && (
          <div className="mb-4 text-center pop-in">
            <span className="text-green-500 font-bold text-lg mr-4">✓ {correctCnt} {t.correct}</span>
            <span className="text-red-500 font-bold text-lg">✗ {wrongCnt} {t.wrong}</span>
            <div className="text-gray-400 dark:text-gray-500 text-sm mt-1">{t.total}: {shuffledFillList.length} &#8226; {t.ratio}: {Math.round(correctCnt/Math.max(shuffledFillList.length,1)*100)}%</div>
          </div>
        )}

        <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-2 sm:gap-3 w-full max-w-6xl mb-8">
          {shuffledFillList.map((kana, idx) => {
            const val = fillAnswers[kana.id]||'';
            const res = fillResults[kana.id];
            const isFocused = idx===focusedCardIdx && !fillFinished;
            let cardBg = 'bg-[#3182ce] dark:bg-blue-700';
            let inputBg = 'bg-white dark:bg-gray-700';
            let inputText = 'text-gray-800 dark:text-white';
            if(res==='correct'){cardBg='bg-green-500 dark:bg-green-600';inputBg='bg-green-50 dark:bg-green-900/50';inputText='text-green-700 dark:text-green-300';}
            else if(res==='wrong'){cardBg='bg-red-500 dark:bg-red-600';inputBg='bg-red-50 dark:bg-red-900/50';inputText='text-red-600 dark:text-red-300';}
            return (
              <div key={kana.id} onClick={()=>{
                if(fillFinished) return;
                if(fillCheckMode==='instant' && res==='correct') return;
                if(fillCheckMode==='instant' && res==='wrong') {
                  setFillResults(r=>({...r,[kana.id]:null}));
                  const na={...fillAnswers,[kana.id]:''};setFillAnswers(na);fillAnswersRef.current=na;
                }
                moveFocusTo(idx);
              }} className={`flex flex-col items-center rounded-xl overflow-hidden transition-all shadow-sm ${res==='correct'?'cursor-default':'cursor-pointer'} ${cardBg} ${isFocused?'ring-4 ring-yellow-400 dark:ring-yellow-300 scale-105 z-10':''} ${res==='wrong'?'animate-shake':''}`}>
                <div className="py-3 sm:py-4 flex items-center justify-center w-full px-2">
                  <span className="text-3xl sm:text-4xl text-white kana-text font-bold select-none drop-shadow whitespace-nowrap">{kana.question}</span>
                </div>
                <div className={`w-full px-1 pb-2 flex flex-col items-center`}>
                  <div className={`w-full text-center text-base sm:text-lg font-semibold py-1.5 sm:py-2 rounded-lg min-h-[36px] flex items-center justify-center ${inputBg} ${inputText} overflow-hidden`}>
                    <span className="truncate w-full px-1">{val || (isFocused ? <span className="animate-pulse text-gray-400">|</span> : '')}</span>
                  </div>
                  {fillFinished && res==='wrong' && <div className="text-[11px] text-white/80 mt-1 font-bold">{Array.isArray(kana.answer)?kana.answer[0]:kana.answer}</div>}
                </div>
              </div>
            );
          })}
        </div>

        {!fillFinished && fillCheckMode==='finish' && (
          <button onClick={handleFinishAll} className="bg-emerald-500 text-white rounded-2xl px-10 py-4 font-extrabold text-lg shadow-xl hover:bg-emerald-600 active:scale-95 transition-all outline-none mb-8">{t.finishQuiz}</button>
        )}
        {fillFinished && (
          <div className="flex gap-4 mb-8">
            <button onClick={()=>{setFillAnswers({});setFillResults({});setFillFinished(false);setFocusedCardIdx(0);focusedCardIdxRef.current=0;setShuffledFillList(shuffle(activeKanaList));}} className="bg-[#3182ce] text-white rounded-2xl px-8 py-3 font-bold text-base shadow-lg hover:bg-blue-700 active:scale-95 transition-all flex items-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" /></svg> {t.retry}</button>
            <button onClick={backToMenu} className="bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200 rounded-2xl px-8 py-3 font-bold text-base shadow-lg hover:bg-gray-300 dark:hover:bg-gray-600 active:scale-95 transition-all">{t.menu}</button>
          </div>
        )}
        <p className="text-center text-xs text-gray-400 dark:text-gray-600 mb-4">{t.tapOrTab}</p>
      </div>
    );
  }

  if (appState === 'stats') {
    return <StatsScreen backToMenu={backToMenu} kanaData={kanaData} vocabData={vocabData} kanjiData={kanjiData} />;
  }

  if (appState === 'matchgame') {
    return <MatchGame backToMenu={backToMenu} pool={activeKanaList} settings={settings} />;
  }

  if (appState === 'writing') {
    return <WritingPractice 
      backToMenu={backToMenu} 
      pool={activeKanaList} 
      settings={settings}
      onToggleAutoNext={() => {
        const newSettings = {...settings, autoNextWriting: settings.autoNextWriting === false ? true : false};
        setSettings(newSettings);
        localStorage.setItem(SETTINGS_KEY, JSON.stringify(newSettings));
      }} 
    />;
  }

  // --- CONFUSABLE PAIRS RENDER ---
  if(appState==='confusable') {
    const shuffledPairs = shuffle([...CONFUSABLE_PAIRS]);
    const pair = shuffledPairs[cfPairIdx % shuffledPairs.length];
    const target = pair ? pair.pairs[cfTargetIdx % pair.pairs.length] : null;
    return (
      <div className="min-h-screen flex flex-col items-center justify-center px-4 relative">
        <SettingsBar settings={settings} toggleSound={toggleSound} toggleTheme={toggleTheme} toggleLang={toggleLang} displayName={displayName} onLogout={onLogout}/>
        <button onClick={backToMenu} className="absolute top-4 sm:top-6 left-4 sm:left-6 text-gray-500 dark:text-gray-400 font-bold hover:text-gray-800 dark:hover:text-white transition px-4 py-2.5 flex items-center bg-gray-100 dark:bg-gray-800 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 text-sm z-50 shadow-sm">&#8592; Menu</button>
        
        <div className="w-full max-w-sm flex flex-col items-center">
          <div className="flex items-center gap-4 mb-6">
            <div className="text-center">
              <span className="text-3xl sm:text-4xl font-black text-emerald-500">{cfScore}</span>
              <p className="text-xs text-gray-400 font-bold">đúng</p>
            </div>
            <div className="text-xl text-gray-300 dark:text-gray-600 font-bold">/</div>
            <div className="text-center">
              <span className="text-3xl sm:text-4xl font-black text-gray-400 dark:text-gray-500">{cfTotal}</span>
              <p className="text-xs text-gray-400 font-bold">tổng</p>
            </div>
          </div>

          <div className="text-sm text-gray-400 dark:text-gray-500 font-bold mb-2 uppercase tracking-wider">Chữ nào là:</div>
          <div className="bg-gradient-to-br from-pink-500 to-fuchsia-600 text-white rounded-3xl px-12 py-6 mb-8 shadow-xl">
            <span className="text-4xl sm:text-5xl font-black tracking-wider">{target ? target.a : ''}</span>
          </div>
          <div className="text-sm text-gray-400 dark:text-gray-500 mb-4">Chọn đáp án đúng ({pair ? pair.group : ''}):</div>

          <div className="flex flex-col gap-3 w-full">
            {cfOptions.map((opt, i) => {
              let btnClass = "bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 border-2 border-gray-100 dark:border-gray-700 hover:border-fuchsia-400 hover:text-fuchsia-600";
              if(cfStatus !== 'idle') {
                if(opt.q === target.q) btnClass = "bg-emerald-500 text-white border-2 border-emerald-600 scale-105";
                else if(cfStatus === 'error') btnClass = "bg-gray-100 dark:bg-gray-800 text-gray-400 border-2 border-gray-200 dark:border-gray-700 opacity-60";
              }
              return (
                <button key={i} disabled={cfStatus !== 'idle'} onClick={() => {
                  setCfTotal(p=>p+1);
                  if(opt.q === target.q) {
                    setCfStatus('correct'); setCfScore(p=>p+1); incrementStudyHistory();
                    setTimeout(() => {
                      const newShuffled = shuffle([...CONFUSABLE_PAIRS]);
                      const nextPair = newShuffled[0];
                      const nextTarget = Math.floor(Math.random()*nextPair.pairs.length);
                      setCfPairIdx(p=>p+1); setCfTargetIdx(nextTarget); setCfOptions(shuffle([...nextPair.pairs])); setCfStatus('idle');
                    }, 600);
                  } else {
                    setCfStatus('error');
                    setTimeout(() => {
                      setCfStatus('idle');
                    }, 1200);
                  }
                }} className={`w-full py-4 px-6 rounded-2xl shadow-sm text-center font-bold text-2xl sm:text-3xl kana-text active:scale-95 transition-all ${btnClass}`}>
                  {opt.q}
                  {cfStatus !== 'idle' && <span className="text-sm font-medium ml-2 opacity-70">({opt.a})</span>}
                </button>
              );
            })}
          </div>
        </div>
      </div>
    );
  }

  return null;
}

function LoginApp({ onLogin, onGuest, onNameUpdate }) {
  const [mode, setMode] = React.useState('login');
  const [loginId, setLoginId] = React.useState('');
  const [email, setEmail] = React.useState('');
  const [username, setUsername] = React.useState('');
  const [password, setPassword] = React.useState('');
  const [error, setError] = React.useState('');
  const [loading, setLoading] = React.useState(false);

  const resolveEmail = async (input) => {
    if (input.includes('@')) return input;
    const snap = await fbDb.collection('usernames').doc(input.toLowerCase()).get();
    if (snap.exists) return snap.data().email;
    return null;
  };

  const handleLogin = async (e) => {
    e.preventDefault();
    if (!loginId.trim() || !password) { setError('Vui lòng điền đủ thông tin'); return; }
    setLoading(true); setError('');
    try {
      const resolvedEmail = await resolveEmail(loginId.trim());
      if (!resolvedEmail) { setError('Tên đăng nhập không tồn tại! Kiểm tra lại hoặc dùng email.'); setLoading(false); return; }
      await fbAuth.signInWithEmailAndPassword(resolvedEmail, password);
    } catch(err) {
      if (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential') {
        setError('Tên/Email hoặc mật khẩu không đúng!');
      } else if (err.code === 'auth/too-many-requests') {
        setError('Quá nhiều lần thử! Vui lòng đợi một lát.');
      } else {
        setError(err.message);
      }
    }
    setLoading(false);
  };

  const handleSignUp = async (e) => {
    e.preventDefault();
    if (!username.trim() || !email.trim() || !password) { setError('Vui lòng điền đủ thông tin'); return; }
    if (username.trim().length < 3) { setError('Tên đăng nhập phải có ít nhất 3 ký tự!'); return; }
    if (!/^[a-zA-Z0-9_]+$/.test(username.trim())) { setError('Tên đăng nhập chỉ được chứa chữ, số và dấu _'); return; }
    if (password.length < 6) { setError('Mật khẩu phải có ít nhất 6 ký tự!'); return; }
    setLoading(true); setError('');
    try {
      const existing = await fbDb.collection('usernames').doc(username.trim().toLowerCase()).get();
      if (existing.exists) { setError('Tên đăng nhập này đã có người dùng!'); setLoading(false); return; }
      const cred = await fbAuth.createUserWithEmailAndPassword(email.trim(), password);
      await fbDb.collection('usernames').doc(username.trim().toLowerCase()).set({ email: email.trim(), uid: cred.user.uid });
      await cred.user.updateProfile({ displayName: username.trim() });
      if (onNameUpdate) onNameUpdate(username.trim());
    } catch(err) {
      if (err.code === 'auth/email-already-in-use') {
        setError('Email này đã được đăng ký! Hãy Đăng Nhập.');
      } else if (err.code === 'auth/invalid-email') {
        setError('Email không hợp lệ!');
      } else if (err.code === 'auth/weak-password') {
        setError('Mật khẩu quá yếu! Cần ít nhất 6 ký tự.');
      } else {
        setError(err.message);
      }
    }
    setLoading(false);
  };

  const handleResetPassword = async (e) => {
    e.preventDefault();
    if (!loginId.trim()) { setError('Vui lòng nhập tên đăng nhập hoặc email!'); return; }
    setLoading(true); setError('');
    try {
      const resolvedEmail = await resolveEmail(loginId.trim());
      if (!resolvedEmail) { setError('Tên đăng nhập không tồn tại!'); setLoading(false); return; }
      const actionCodeSettings = {
        url: 'https://trunknguen.github.io/zapan/gd6/index.html', // Redirect URL
        handleCodeInApp: false
      };
      await fbAuth.sendPasswordResetEmail(resolvedEmail, actionCodeSettings);
      setError('✅ Đã gửi link đổi mật khẩu! Kiểm tra hộp thư email.');
    } catch(err) {
      setError(err.message);
    }
    setLoading(false);
  };

  return (
    <div className="min-h-screen flex items-center justify-center bg-gray-50 dark:bg-gray-900 px-4">
      <div className="max-w-md w-full bg-white dark:bg-gray-800 rounded-3xl shadow-xl p-8 border border-gray-100 dark:border-gray-700 pop-in">
        <h2 className="text-3xl font-extrabold text-center text-[#3182ce] dark:text-blue-400 mb-2">
          {mode === 'login' ? 'Đăng Nhập' : mode === 'signup' ? 'Đăng Ký' : 'Khôi Phục Mật Khẩu'}
        </h2>
        <p className="text-center text-sm text-gray-400 dark:text-gray-500 mb-6">🔥 Đồng bộ tiến trình qua Firebase</p>
        
        {error && <div className={`mb-6 font-bold text-sm text-center py-3 rounded-xl border ${error.startsWith('✅') ? 'text-green-600 bg-green-50 dark:bg-green-900/40 border-green-200 dark:border-green-800' : 'text-red-500 bg-red-50 dark:bg-red-900/40 border-red-200 dark:border-red-800 animate-shake'}`}>{error}</div>}
        
        <form onSubmit={mode === 'login' ? handleLogin : mode === 'signup' ? handleSignUp : handleResetPassword} className="space-y-4">
          {mode === 'signup' ? (
            <>
              <div>
                <label className="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1.5 ml-1">Tên đăng nhập</label>
                <input type="text" value={username} onChange={e=>setUsername(e.target.value)} className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl dark:bg-gray-700/50 dark:border-gray-600 dark:text-white outline-none focus:border-[#3182ce] transition-colors" placeholder="vd: trunk_kuc" autoComplete="username" />
              </div>
              <div>
                <label className="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1.5 ml-1">Email <span className="text-xs text-gray-400 font-normal">(để khôi phục mật khẩu)</span></label>
                <input type="email" value={email} onChange={e=>setEmail(e.target.value)} className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl dark:bg-gray-700/50 dark:border-gray-600 dark:text-white outline-none focus:border-[#3182ce] transition-colors" placeholder="you@example.com" autoComplete="email" />
              </div>
            </>
          ) : (
            <div>
              <label className="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1.5 ml-1">Tên đăng nhập hoặc Email</label>
              <input type="text" value={loginId} onChange={e=>setLoginId(e.target.value)} className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl dark:bg-gray-700/50 dark:border-gray-600 dark:text-white outline-none focus:border-[#3182ce] transition-colors" placeholder="username hoặc you@example.com" autoComplete="username" />
            </div>
          )}
          {mode !== 'reset' && (
            <div>
              <label className="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1.5 ml-1">Mật khẩu</label>
              <input type="password" value={password} onChange={e=>setPassword(e.target.value)} className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl dark:bg-gray-700/50 dark:border-gray-600 dark:text-white outline-none focus:border-[#3182ce] transition-colors" placeholder="Ít nhất 6 ký tự" autoComplete={mode === 'signup' ? 'new-password' : 'current-password'} />
            </div>
          )}
          
          <button type="submit" disabled={loading} className="w-full bg-[#3182ce] text-white py-4 rounded-xl font-bold text-lg hover:bg-[#2b6cb0] active:scale-95 transition-all mt-4 shadow-lg shadow-blue-500/30 disabled:opacity-50">
            {loading ? '⏳ Đang xử lý...' : mode === 'login' ? '🚀 Đăng Nhập' : mode === 'signup' ? '✨ Tạo Tài Khoản' : '📧 Gửi Link Khôi Phục'}
          </button>
        </form>

        {mode === 'login' && (
          <button type="button" onClick={()=>{setMode('signup');setError('');}} className="w-full mt-3 bg-gradient-to-r from-emerald-500 to-teal-500 text-white py-3.5 rounded-xl font-bold text-base hover:from-emerald-600 hover:to-teal-600 active:scale-95 transition-all shadow-md">
            📝 Tạo Tài Khoản Mới
          </button>
        )}
        {mode === 'signup' && (
          <button type="button" onClick={()=>{setMode('login');setError('');}} className="w-full mt-3 bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 py-3.5 rounded-xl font-bold text-base hover:bg-gray-200 dark:hover:bg-gray-600 active:scale-95 transition-all border border-gray-200 dark:border-gray-600">
            ← Đã có tài khoản? Đăng Nhập
          </button>
        )}

        {(mode === 'login' || mode === 'signup') && (
          <button type="button" onClick={onGuest} className="w-full mt-3 bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 py-3.5 rounded-xl font-bold text-base hover:bg-gray-200 dark:hover:bg-gray-600 active:scale-95 transition-all border border-gray-200 dark:border-gray-600">
            👤 Vào với tư cách Khách (không đồng bộ)
          </button>
        )}
        
        <div className="mt-6 text-center text-sm font-semibold">
          {mode === 'login' ? (
            <button type="button" onClick={()=>{setMode('reset');setError('');}} className="text-gray-500 hover:text-[#3182ce] dark:text-gray-400 dark:hover:text-blue-400 transition-colors">Quên mật khẩu?</button>
          ) : mode !== 'login' && (
            <button type="button" onClick={()=>{setMode('login');setError('');}} className="text-gray-500 hover:text-[#3182ce] dark:text-gray-400 dark:hover:text-blue-400 transition-colors">Quay lại đăng nhập</button>
          )}
        </div>
        {mode === 'login' && <div className="mt-6 text-xs text-center text-gray-400 dark:text-gray-500 bg-gray-50 dark:bg-gray-800 p-3 rounded-lg border border-gray-200 dark:border-gray-700">🔄 Đăng nhập bằng Email + Mật khẩu. Tiến trình học sẽ được lưu trên Cloud và đồng bộ giữa các thiết bị.</div>}
      </div>
    </div>
  );
}
