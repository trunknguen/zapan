function SingleCharCanvas({ char, showGuide, addClearRef, addUndoRef, onDrawEnd }) {
  const canvasRef = React.useRef(null);
  const isDrawing = React.useRef(false);
  const history = React.useRef([]); // Stores snapshot DataURLs for Undo

  const saveState = () => {
    const cvs = canvasRef.current;
    if (cvs) history.current.push(cvs.toDataURL());
  };

  React.useEffect(() => {
    // Register clear function
    addClearRef(() => {
      const cvs = canvasRef.current;
      if (cvs) {
        history.current = [];
        const ctx = cvs.getContext('2d');
        ctx.clearRect(0, 0, cvs.width, cvs.height);
      }
    });
    // Register undo function
    addUndoRef(() => {
      if (history.current.length === 0) return;
      const cvs = canvasRef.current;
      if (!cvs) return;
      const ctx = cvs.getContext('2d');
      history.current.pop(); // Remove current faulty state
      ctx.clearRect(0, 0, cvs.width, cvs.height);
      if (history.current.length > 0) {
        const img = new Image();
        img.src = history.current[history.current.length - 1];
        img.onload = () => ctx.drawImage(img, 0, 0);
      }
    });
  }, [addClearRef, addUndoRef]);

  const startDraw = (e) => {
    isDrawing.current = true;
    if (history.current.length === 0) saveState(); // Save initial blank state
    const cvs = canvasRef.current;
    if(!cvs) return;
    cvs.setPointerCapture(e.pointerId);
    const ctx = cvs.getContext('2d');
    const rect = cvs.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const scaleX = cvs.width / rect.width;
    const scaleY = cvs.height / rect.height;
    ctx.beginPath();
    ctx.moveTo(x * scaleX, y * scaleY);
    // Don't preventDefault here to allow scrolling if they drag outside
  };

  const draw = (e) => {
    if(!isDrawing.current) return;
    const cvs = canvasRef.current;
    if(!cvs) return;
    const ctx = cvs.getContext('2d');
    const rect = cvs.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const scaleX = cvs.width / rect.width;
    const scaleY = cvs.height / rect.height;
    
    // PRESSURE SENSITIVITY LOGIC (Shodo Style)
    // Map pressure (0.0 - 1.0) to lineWidth (4 - 24)
    // Fallback to 12 if pressure is not supported properly
    const pressure = e.pressure !== undefined ? e.pressure : 0.5;
    const baseWidth = 12;
    // Only apply pressure dynamics if pressure reading is meaningful (> 0 and != 0.5 default from some mice)
    const lineWidth = (pressure > 0.01 && e.pointerType !== 'mouse') ? (4 + pressure * 20) : baseWidth;

    const isDark = document.documentElement.classList.contains('dark');
    ctx.lineWidth = lineWidth;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = isDark ? '#ffffff' : '#1f2937';
    ctx.lineTo(x * scaleX, y * scaleY);
    ctx.stroke();
  };

  const endDraw = (e) => { 
    if(isDrawing.current) {
      isDrawing.current = false; 
      saveState();
      // If canvas pointer is captured, release and notify parent
      if (canvasRef.current && e) canvasRef.current.releasePointerCapture(e.pointerId);
      if (onDrawEnd) onDrawEnd();
    }
  };

  return (
    <div className="relative w-full aspect-square bg-white dark:bg-gray-800 rounded-2xl shadow-sm border-2 border-dashed border-[#3182ce] dark:border-blue-500 overflow-hidden shrink-0 touch-none">
      <div className="absolute inset-0 pointer-events-none flex items-center justify-center">
        <div className="w-full h-px border-t border-dashed border-gray-300 dark:border-gray-600 absolute"></div>
        <div className="h-full w-px border-l border-dashed border-gray-300 dark:border-gray-600 absolute"></div>
      </div>
      <div className={`absolute inset-0 flex items-center justify-center pointer-events-none transition-opacity duration-300 ${showGuide ? 'opacity-20 dark:opacity-30' : 'opacity-0'}`}>
        <span className="text-[120px] sm:text-[200px] leading-none text-gray-800 dark:text-gray-200 kana-text font-normal select-none">{char}</span>
      </div>
      <canvas ref={canvasRef} width={400} height={400} 
        className="w-full h-full cursor-crosshair relative z-10 block touch-none" 
        onPointerDown={startDraw} 
        onPointerMove={draw} 
        onPointerUp={endDraw} 
        onPointerOut={endDraw} 
        onPointerCancel={endDraw}
      />
    </div>
  );
}

function WritingPractice({ backToMenu, pool, settings, onToggleAutoNext }) {
  const t = T[settings.lang] || T.vi;
  const [currentIndex, setCurrentIndex] = React.useState(0);
  const [showGuide, setShowGuide] = React.useState(true);
  const [isFullscreen, setIsFullscreen] = React.useState(false);
  const [isShuffled, setIsShuffled] = React.useState(false);
  const [shuffledPool, setShuffledPool] = React.useState([]);
  const clearFuncs = React.useRef({});
  const undoFuncs = React.useRef({});
  const drawTimeoutRef = React.useRef(null);
  const containerRef = React.useRef(null);

  // Shuffle utility
  const shuffleArray = (arr) => {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };

  // Initialize shuffled pool
  React.useEffect(() => {
    if (isShuffled) {
      setShuffledPool(shuffleArray(pool));
      setCurrentIndex(0);
    }
  }, [isShuffled]);

  const displayPool = isShuffled ? shuffledPool : pool;

  const toggleOrder = () => {
    if (drawTimeoutRef.current) clearTimeout(drawTimeoutRef.current);
    Object.values(clearFuncs.current).forEach(f => f && f());
    setIsShuffled(prev => !prev);
    if (!isShuffled) {
      // Switching TO random — shuffledPool will be set via useEffect
    } else {
      // Switching TO sequential — reset index
      setCurrentIndex(0);
    }
  };
  
  React.useEffect(() => {
    const wrapper = document.getElementById('writing_wrapper');
    if(wrapper) wrapper.focus();
    
    // Monitor fullscreen changes to update state
    const fsListener = () => {
       setIsFullscreen(!!document.fullscreenElement);
    };
    document.addEventListener('fullscreenchange', fsListener);
    return () => document.removeEventListener('fullscreenchange', fsListener);
  }, [currentIndex]);

  const currentItem = displayPool[currentIndex];
  const isVocab = currentItem?.type === 'vocab' || currentItem?.type === 'kanji';
  const displayString = isVocab ? (currentItem.question || currentItem.kanji || currentItem.answer[0]) : (currentItem?.question || '');
  const chars = displayString.split('');

  const clearCanvas = () => {
    Object.values(clearFuncs.current).forEach(f => f && f());
  };

  const undoCanvas = () => {
    Object.values(undoFuncs.current).forEach(f => f && f());
  };

  const nextWord = React.useCallback(() => {
    if (drawTimeoutRef.current) clearTimeout(drawTimeoutRef.current);
    clearCanvas();
    setCurrentIndex(p => (p + 1) % displayPool.length);
  }, [displayPool.length]);

  const prevWord = () => {
    if (drawTimeoutRef.current) clearTimeout(drawTimeoutRef.current);
    clearCanvas();
    setCurrentIndex(p => (p - 1 + displayPool.length) % displayPool.length);
  };

  const handleDrawEnd = () => {
    // iPad Auto-Next: If user finishes drawing and waits 1.5s, auto go to next word
    if (settings.autoNextWriting !== false) {
      if (drawTimeoutRef.current) clearTimeout(drawTimeoutRef.current);
      drawTimeoutRef.current = setTimeout(() => {
        nextWord();
      }, 1500);
    }
  };

  const toggleFullscreen = async () => {
    try {
      if (!document.fullscreenElement) {
        if (containerRef.current.requestFullscreen) {
          await containerRef.current.requestFullscreen();
        } else if (containerRef.current.webkitRequestFullscreen) { /* Safari */
          await containerRef.current.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          await document.exitFullscreen();
        } else if (document.webkitExitFullscreen) { /* Safari */
          await document.webkitExitFullscreen();
        }
      }
    } catch (err) {
      console.warn("Fullscreen toggle failed:", err);
    }
  };

  if(!currentItem) return <div className="min-h-screen flex flex-col items-center justify-center font-bold text-gray-500"><div>No Data</div><button onClick={backToMenu} className="mt-4 px-4 py-2 bg-blue-500 text-white rounded-lg">Menu</button></div>;

  const gridClass = chars.length === 1 ? 'grid-cols-1 max-w-sm' : 
                    chars.length === 2 ? 'grid-cols-2 max-w-lg' : 
                    chars.length <= 4 ? 'grid-cols-2 lg:grid-cols-4 max-w-3xl' : 
                    'grid-cols-3 lg:grid-cols-5 max-w-5xl';

  return (
    <div id="writing_wrapper" ref={containerRef} className={`flex flex-col items-center px-4 py-6 relative outline-none bg-gray-50 dark:bg-gray-900 transition-all ${isFullscreen ? 'h-screen w-screen overflow-hidden' : 'min-h-screen'}`} tabIndex={0} onKeyDown={(e)=>{if(e.key==='ArrowRight'||e.key==='Enter') nextWord(); if(e.key==='ArrowLeft') prevWord();}}>
      
      {/* HEADER SECTION (HIDDEN IN FULLSCREEN TO MAXIMIZE SPACE) */}
      {!isFullscreen && (
         <>
            <button onClick={backToMenu} className="absolute top-4 sm:top-6 left-4 sm:left-6 text-gray-500 dark:text-gray-400 font-bold hover:text-gray-800 dark:hover:text-white transition px-4 py-2.5 flex items-center bg-gray-100 dark:bg-gray-800 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 text-sm z-50 shadow-sm">&#8592; {t.menu}</button>
            
            <h2 className="text-2xl sm:text-3xl font-extrabold text-[#3182ce] dark:text-blue-400 mt-16 mb-2 flex items-center gap-3">
               ✍️ Luyện Viết (Writing)
            </h2>
            <p className="text-sm text-gray-400 dark:text-gray-500 mb-4 flex items-center gap-2">
               <span>Từ {currentIndex + 1} / {displayPool.length}</span>
            </p>
         </>
      )}

      {/* READING HINT */}
      <div className={`flex flex-col items-center w-full max-w-2xl ${isFullscreen ? 'mb-2 mt-4' : 'mb-6'}`}>
         {/* Top action row */}
         <div className="flex justify-between items-center w-full mb-3 px-2">
            <span className="text-sm font-bold text-gray-400 uppercase tracking-wider">{isFullscreen ? `Từ ${currentIndex + 1} / ${displayPool.length}` : ''}</span>
            <div className="flex gap-2 items-center flex-wrap justify-end">
               <button onClick={toggleOrder} className={`px-3 py-1.5 rounded-full text-xs sm:text-sm font-bold transition-all shadow-sm border outline-none ${isShuffled ? 'bg-purple-100 text-purple-600 border-purple-200 dark:bg-purple-900/40 dark:text-purple-400 dark:border-purple-800' : 'bg-gray-100 text-gray-500 border-gray-200 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-700'}`} title="Chuyển đổi thứ tự xuất hiện">
                  {isShuffled ? '🔀 Ngẫu Nhiên' : '📋 Thứ Tự'}
               </button>
               <button onClick={onToggleAutoNext} className={`px-3 py-1.5 rounded-full text-xs sm:text-sm font-bold transition-all shadow-sm border outline-none ${settings.autoNextWriting !== false ? 'bg-blue-100 text-blue-600 border-blue-200 dark:bg-blue-900/40 dark:text-blue-400 dark:border-blue-800' : 'bg-gray-100 text-gray-500 border-gray-200 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-700'}`} title="Tự động qua từ khi viết xong">
                  {settings.autoNextWriting !== false ? '⏩ Auto-Next: BẬT' : '⏸ Auto-Next: TẮT'}
               </button>
               <button onClick={toggleFullscreen} className="bg-white dark:bg-gray-800 text-gray-500 hover:text-blue-500 p-2 rounded-full shadow-sm hover:scale-105 active:scale-95 transition-all outline-none border border-gray-200 dark:border-gray-700" title="Đóng/Mở Toàn Màn Hình">
                  {isFullscreen ? (
                     <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M9 9V4.5M9 9H4.5M9 9L3.75 3.75M9 15v4.5M9 15H4.5M9 15l-5.25 5.25M15 9h4.5M15 9V4.5M15 9l5.25-5.25M15 15h4.5M15 15v4.5m0-4.5l5.25 5.25" /></svg>
                  ) : (
                     <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15" /></svg>
                  )}
               </button>
            </div>
         </div>

        <div className={`text-xl sm:text-2xl font-bold bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200 px-6 py-2 sm:py-3 rounded-2xl shadow-sm border-2 border-dashed border-[#3182ce] dark:border-blue-500 w-full text-center ${isFullscreen ? 'py-1 border-emerald-400/50 dark:border-emerald-600/50' : ''}`}>
          {isVocab ? (
             <div className="flex flex-col items-center">
               <span className="text-xs sm:text-sm text-gray-500 dark:text-gray-400 font-normal mb-1">{settings.lang==='vi'?currentItem.meaning?.vi:currentItem.meaning?.en}</span>
               <span className="text-[#3182ce] dark:text-blue-400">{currentItem.answer ? (Array.isArray(currentItem.answer) ? currentItem.answer[0] : currentItem.answer) : displayString}</span>
               {currentItem.hv && <span className="mt-1 inline-flex items-center gap-1 bg-orange-100 dark:bg-orange-900/40 text-orange-600 dark:text-orange-300 px-2.5 py-0.5 rounded-full text-xs font-bold border border-orange-200 dark:border-orange-700">🇻🇳 {currentItem.hv}</span>}
               {currentItem.hint && <span className="mt-1 text-[10px] text-gray-400 dark:text-gray-500 italic text-center max-w-[250px]">💡 {currentItem.hint}</span>}
             </div>
          ) : (
             <div className="flex justify-center items-center gap-2 text-[#3182ce] dark:text-blue-400">
               Romaji: <span>{Array.isArray(currentItem.answer) ? currentItem.answer[0] : currentItem.answer}</span>
             </div>
          )}
        </div>
        {!showGuide && <div className="text-xs text-orange-500 dark:text-orange-400 font-bold mt-2 animate-pulse">Chế độ Thử Thách (Đã ẩn chữ)!</div>}
      </div>

      {/* CANVAS GRID CONTAINER */}
      <div className="w-full max-w-2xl px-2 mb-2 text-center text-xs text-gray-400 font-bold">↕ Vuốt phần ngoài ô vẽ để cuộn trang</div>
      <div className={`w-full grid ${gridClass} gap-3 sm:gap-4 px-3 sm:px-6 mb-4 sm:mb-6 transition-all mx-auto`} style={isFullscreen ? {maxHeight: '40vh'} : {}}>
        {chars.map((char, i) => (
          <SingleCharCanvas key={`${currentIndex}-${i}`} char={char} showGuide={showGuide} 
            addClearRef={(f) => { clearFuncs.current[i] = f; }} 
            addUndoRef={(f) => { undoFuncs.current[i] = f; }}
            onDrawEnd={handleDrawEnd}
          />
        ))}
      </div>

      {/* CONTROLS */}
      <div className="flex flex-wrap gap-2 w-full max-w-2xl mb-4 sm:mb-6 mx-auto justify-center">
        <button onClick={undoCanvas} className="flex-1 min-w-[100px] bg-yellow-50 text-yellow-600 dark:bg-yellow-900/30 dark:text-yellow-400 font-bold py-2 sm:py-3 rounded-xl border border-yellow-200 dark:border-yellow-800 hover:bg-yellow-100 dark:hover:bg-yellow-900/50 hover:scale-105 active:scale-95 transition-all shadow-sm flex flex-col sm:flex-row justify-center items-center gap-1 sm:gap-2 text-sm sm:text-base">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2.5} stroke="currentColor" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3" /></svg>
          <span className="hidden sm:inline">Hoàn Tác</span>
        </button>
        <button onClick={clearCanvas} className="flex-1 min-w-[100px] bg-red-50 text-red-600 dark:bg-red-900/30 dark:text-red-400 font-bold py-2 sm:py-3 rounded-xl border border-red-200 dark:border-red-800 hover:bg-red-100 hover:scale-105 active:scale-95 transition-all shadow-sm flex flex-col sm:flex-row justify-center items-center gap-1 sm:gap-2 text-sm sm:text-base">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2.5} stroke="currentColor" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" /></svg>
          <span className="hidden sm:inline">Tẩy Xoá</span>
        </button>
        <button onClick={() => setShowGuide(!showGuide)} className="flex-1 min-w-[100px] bg-gray-100 text-gray-700 dark:bg-gray-800 dark:text-gray-300 font-bold py-2 sm:py-3 rounded-xl border border-gray-300 dark:border-gray-600 hover:bg-gray-200 hover:scale-105 active:scale-95 transition-all shadow-sm flex flex-col sm:flex-row justify-center items-center gap-1 sm:gap-2 text-sm sm:text-base">
          {showGuide ? (
             <><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" /></svg><span className="hidden sm:inline">Ẩn Nét</span></>
          ) : (
             <><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" /><path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg><span className="hidden sm:inline">Hiện Nét</span></>
          )}
        </button>
      </div>

      <div className={`flex gap-4 w-full max-w-xl mx-auto ${isFullscreen ? 'mt-0' : 'mt-auto'}`}>
        <button onClick={prevWord} className="flex-1 bg-gray-200 text-gray-700 dark:bg-gray-700 dark:text-gray-200 font-bold py-3 sm:py-4 rounded-2xl hover:bg-gray-300 dark:hover:bg-gray-600 active:scale-95 transition-all shadow-md text-base sm:text-lg">
          ← Trước
        </button>
        <button onClick={nextWord} className="flex-2 bg-[#3182ce] text-white font-bold py-3 sm:py-4 rounded-2xl hover:bg-[#2b6cb0] active:scale-95 transition-all shadow-md text-base sm:text-lg flex-grow">
          Tiếp Theo →
        </button>
      </div>
    </div>
  );
}

function MatchGame({ backToMenu, pool, settings }) {
  const t = T[settings.lang] || T.vi;
  const PAIR_COUNT = Math.min(8, Math.floor(pool.length));
  const [cards, setCards] = React.useState([]);
  const [selected, setSelected] = React.useState([]);
  const [matched, setMatched] = React.useState([]);
  const [timeLeft, setTimeLeft] = React.useState(60);
  const [running, setRunning] = React.useState(false);
  const [finished, setFinished] = React.useState(false);
  const [score, setScore] = React.useState(0);
  const [combo, setCombo] = React.useState(0);
  const [wrongFlash, setWrongFlash] = React.useState([]);
  const timerRef = React.useRef(null);

  const shuffle = (arr) => { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

  const initGame = () => {
    if (pool.length < 2) return;
    const picked = shuffle(pool).slice(0, PAIR_COUNT);
    const cardPairs = [];
    picked.forEach((item, idx) => {
      const isVocabOrKanji = item.type === 'vocab' || item.type === 'kanji';
      const qLabel = item.question;
      const aLabel = isVocabOrKanji ? (item.meaning ? (settings.lang==='vi' ? item.meaning.vi : item.meaning.en) : item.answer[0]) : item.answer[0];
      cardPairs.push({ pairId: idx, text: qLabel, side: 'q', isJP: true });
      cardPairs.push({ pairId: idx, text: aLabel, side: 'a', isJP: false });
    });
    setCards(shuffle(cardPairs));
    setSelected([]);
    setMatched([]);
    setScore(0);
    setCombo(0);
    setTimeLeft(60);
    setRunning(true);
    setFinished(false);
    setWrongFlash([]);
  };

  React.useEffect(() => { initGame(); }, []);

  React.useEffect(() => {
    if (!running) return;
    if (timeLeft <= 0) { setRunning(false); setFinished(true); return; }
    timerRef.current = setTimeout(() => setTimeLeft(p => p - 1), 1000);
    return () => clearTimeout(timerRef.current);
  }, [running, timeLeft]);

  React.useEffect(() => {
    if (matched.length === PAIR_COUNT * 2 && running) {
      setRunning(false);
      setFinished(true);
    }
  }, [matched]);

  const handleCardClick = (cardIdx) => {
    if (!running || finished) return;
    if (matched.includes(cardIdx)) return;
    if (selected.includes(cardIdx)) return;
    if (selected.length >= 2) return;

    const newSel = [...selected, cardIdx];
    setSelected(newSel);

    if (newSel.length === 2) {
      const c1 = cards[newSel[0]];
      const c2 = cards[newSel[1]];
      if (c1.pairId === c2.pairId && c1.side !== c2.side) {
        // CORRECT match
        const newCombo = combo + 1;
        setCombo(newCombo);
        setScore(s => s + 10 + (newCombo > 1 ? newCombo * 5 : 0));
        setTimeout(() => {
          setMatched(m => [...m, newSel[0], newSel[1]]);
          setSelected([]);
        }, 400);
      } else {
        // WRONG match
        setCombo(0);
        setWrongFlash(newSel);
        setTimeLeft(p => Math.max(0, p - 3));
        setTimeout(() => { setSelected([]); setWrongFlash([]); }, 600);
      }
    }
  };

  const matchedCount = Math.floor(matched.length / 2);
  const pctComplete = (matchedCount / PAIR_COUNT) * 100;
  const timerColor = timeLeft > 20 ? 'text-green-600 dark:text-green-400' : timeLeft > 10 ? 'text-yellow-500' : 'text-red-500';

  if (finished) {
    const allMatched = matched.length === PAIR_COUNT * 2;
    return (
      <div className="min-h-screen flex flex-col items-center justify-center px-4 relative">
        <div className="bg-white dark:bg-gray-800 rounded-3xl shadow-xl p-8 sm:p-12 max-w-md w-full text-center pop-in border border-gray-100 dark:border-gray-700">
          <div className="text-6xl mb-4">{allMatched ? '🎉' : '⏰'}</div>
          <h2 className="text-2xl sm:text-3xl font-extrabold mb-2 text-gray-800 dark:text-white">{allMatched ? 'Hoàn Thành!' : 'Hết Giờ!'}</h2>
          <p className="text-5xl font-black text-[#3182ce] dark:text-blue-400 my-4">{score}</p>
          <p className="text-gray-500 dark:text-gray-400 font-bold mb-2">điểm • {matchedCount}/{PAIR_COUNT} cặp</p>
          {allMatched && <p className="text-sm text-emerald-600 dark:text-emerald-400 font-bold mb-4">Thời gian còn lại: {timeLeft}s 🏆</p>}
          <div className="flex gap-3 mt-6">
            <button onClick={initGame} className="flex-1 bg-gradient-to-r from-purple-500 to-indigo-500 text-white rounded-2xl px-5 py-3.5 font-extrabold shadow-lg hover:from-purple-600 hover:to-indigo-600 active:scale-95 transition-all">🔄 Chơi Lại</button>
            <button onClick={backToMenu} className="flex-1 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 rounded-2xl px-5 py-3.5 font-extrabold shadow-sm hover:bg-gray-200 dark:hover:bg-gray-600 active:scale-95 transition-all">← Menu</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen flex flex-col items-center px-3 py-4 sm:px-6 sm:py-8 relative">
      <button onClick={backToMenu} className="absolute top-4 sm:top-6 left-4 sm:left-6 text-gray-500 dark:text-gray-400 font-bold hover:text-gray-800 dark:hover:text-white transition px-4 py-2.5 flex items-center bg-gray-100 dark:bg-gray-800 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 text-sm z-50 shadow-sm">&#8592; Menu</button>

      <div className="flex items-center gap-4 sm:gap-8 mt-14 sm:mt-6 mb-4">
        <div className="text-center">
          <span className={`text-4xl sm:text-5xl font-black ${timerColor}`}>{timeLeft}</span>
          <p className="text-xs text-gray-400 font-bold mt-1">giây</p>
        </div>
        <div className="h-12 w-px bg-gray-200 dark:bg-gray-700"></div>
        <div className="text-center">
          <span className="text-4xl sm:text-5xl font-black text-[#3182ce] dark:text-blue-400">{score}</span>
          <p className="text-xs text-gray-400 font-bold mt-1">điểm</p>
        </div>
        {combo > 1 && (
          <div className="bg-gradient-to-r from-amber-400 to-orange-500 text-white px-3 py-1.5 rounded-full font-extrabold text-sm shadow-lg animate-bounce">
            🔥 x{combo}
          </div>
        )}
      </div>

      <div className="w-full max-w-2xl mb-3">
        <div className="w-full h-2.5 bg-gray-100 dark:bg-gray-700 rounded-full overflow-hidden">
          <div className="h-full bg-gradient-to-r from-emerald-400 to-green-500 rounded-full transition-all duration-500" style={{width: `${pctComplete}%`}}></div>
        </div>
        <p className="text-xs text-gray-400 text-right mt-1 font-bold">{matchedCount}/{PAIR_COUNT}</p>
      </div>

      <div className="grid grid-cols-4 gap-2 sm:gap-3 w-full max-w-2xl">
        {cards.map((card, idx) => {
          const isMatched = matched.includes(idx);
          const isSelected = selected.includes(idx);
          const isWrong = wrongFlash.includes(idx);
          return (
            <button
              key={idx}
              onClick={() => handleCardClick(idx)}
              disabled={isMatched}
              className={`
                relative aspect-square rounded-xl sm:rounded-2xl font-bold text-sm sm:text-lg flex items-center justify-center
                transition-all duration-200 outline-none border-2 shadow-sm
                ${isMatched ? 'opacity-0 scale-75 pointer-events-none' : ''}
                ${isSelected && !isWrong ? 'bg-blue-100 dark:bg-blue-900/50 border-blue-500 scale-105 shadow-lg ring-2 ring-blue-300 dark:ring-blue-600' : ''}
                ${isWrong ? 'bg-red-100 dark:bg-red-900/40 border-red-500 animate-shake' : ''}
                ${!isSelected && !isMatched && !isWrong ? 'bg-white dark:bg-gray-800 border-gray-200 dark:border-gray-600 hover:border-blue-400 dark:hover:border-blue-500 hover:shadow-md active:scale-95 cursor-pointer' : ''}
              `}
            >
              <span className={`${card.isJP ? 'kana-text text-lg sm:text-2xl' : 'text-xs sm:text-sm'} ${isSelected || isMatched ? 'text-[#3182ce] dark:text-blue-300' : 'text-gray-700 dark:text-gray-200'}`}>
                {card.text}
              </span>
              {card.isJP && <span className="absolute top-1 right-1.5 text-[9px] text-blue-400 font-bold opacity-60">JP</span>}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function MainApp({ currentUser, isGuest, onLogout, onShowTutorial, displayName }) {
  const userKey = isGuest ? '__guest__' : currentUser;
  const STORAGE_KEY = `kana_weakness_data_v2_${userKey}`;
  const SETTINGS_KEY = `kana_settings_v1_${userKey}`;
  const HIGHSCORE_KEY = `kana_highscore_v1_${userKey}`;
  const SURVIVAL_HIGHSCORE_KEY = `kana_survival_highscore_v1_${userKey}`;
  const VOCAB_KEY = `vocab_data_v1_${userKey}`;
  const KANJI_KEY = `kanji_data_v1_${userKey}`;

  const [settings, setSettings] = React.useState(() => {
    const s = localStorage.getItem(SETTINGS_KEY);
    if(s) { 
      const p=JSON.parse(s); 
      if(!p.lang) p.lang='vi'; 
      if(p.dailyStreak===undefined) p.dailyStreak = 0;
      if(p.autoNextWriting===undefined) p.autoNextWriting = true;
      if(p.quizMode===undefined) p.quizMode = 'typing';
      if(!p.studyHistory) p.studyHistory = {};
      return p; 
    }
    return { isDark: window.matchMedia('(prefers-color-scheme: dark)').matches, isSound: false, lang: 'vi', dailyStreak: 0, lastActiveDate: null, autoNextWriting: true, quizMode: 'typing', studyHistory: {} };
  });

  const incrementStudyHistory = () => {
    const today = new Date().toISOString().slice(0,10); // "2026-03-18"
    setSettings(prev => {
      const h = {...(prev.studyHistory||{})};
      h[today] = (h[today]||0) + 1;
      return {...prev, studyHistory: h};
    });
  };


  const t = T[settings.lang] || T.vi;

  // Streak logic effect
  React.useEffect(() => {
    setSettings(prev => {
      const today = new Date().toDateString();

  const startConfusable = () => {
    setCfScore(0); setCfTotal(0); setCfStatus('idle');
    const shuffledPairs = shuffle([...CONFUSABLE_PAIRS]);
    const pair = shuffledPairs[0];
    const targetI = Math.floor(Math.random()*pair.pairs.length);
    setCfPairIdx(0); setCfTargetIdx(targetI); setCfOptions(shuffle([...pair.pairs]));
    setAppState('confusable');
  };

  const handleCorrectRandom = () => {
    const responseTime = Date.now() - questionStartTimeRef.current;
    setStatus('correct'); setCorrectCount(p=>p+1); incrementStudyHistory();
    const pool = smartReviewPool || activeQuizData;
    if(currentKana){ 
      const nd=(studyMode==='kana'?kanaData:studyMode==='vocab'?vocabData:kanjiData).map(k=>k.id===currentKana.id?srsUpdate({...k,mistakeCount:Math.max(0,k.mistakeCount-1)},true,responseTime):k);
      setActiveData(()=>nd);
    }
    setTimeout(()=>{ 
      setInputValue(''); setDrawingChecked(false); clearCanvas(); 
      if(practiceMode==='practice_mistakes'&&pool.filter(k=>k.mistakeCount>0).length===0) {
        setPracticeMode('normal'); 
      } else {
        const nextIdx = genWeightedNext(pool, currentIndex);
        setCurrentIndex(nextIdx); 
        if(settings.quizMode === 'mc') setMultipleChoiceOptions(generateMultipleChoiceOptions(pool[nextIdx] || pool[0], pool));
      }
      setStatus('idle'); 
      questionStartTimeRef.current = Date.now();
    },250);
  };
  const handleErrorRandom = () => {
    const responseTime = Date.now() - questionStartTimeRef.current;
    setStatus('error'); if(currentKana) speakKana(currentKana.question,settings.isSound);
    if(currentKana){ setActiveData(prev=>(studyMode==='kana'?kanaData:studyMode==='vocab'?vocabData:kanjiData).map(k=>k.id===currentKana.id?srsUpdate({...k,mistakeCount:k.mistakeCount+1},false,responseTime):k)); }
    setTimeout(()=>{
       setStatus('idle');setInputValue('');setDrawingChecked(false);clearCanvas();
       // Generate new options on mistake if MC, maybe keeping same options or reshuffling. Reshuffle for now:
       if(settings.quizMode === 'mc') setMultipleChoiceOptions(generateMultipleChoiceOptions(currentKana, activeQuizData));
       questionStartTimeRef.current = Date.now();
    },400);
  };

  const handleMultipleChoiceSelect = (selectedOption) => {
    if (statusRef.current !== 'idle') return;
    const kana = currentKanaRef.current; if (!kana) return;
    if (selectedOption.id === kana.id) {
       handleCorrectRandom();
    } else {
       handleErrorRandom();
    }
  };

  // RANDOM QUIZ KEYDOWN
  React.useEffect(() => {
    if(appState!=='quiz') return;
    const handler = (e) => {
      if(statusRef.current!=='idle') return;
      const kana=currentKanaRef.current; if(!kana) return;
      if(e.key==='Backspace'){e.preventDefault(); setInputValue(p=>{const v=p.slice(0,-1);inputRef.current=v;return v;}); return;}
      if(e.key==='Enter'){e.preventDefault(); if(inputRef.current.length>0&&!checkAns(inputRef.current,kana)) handleErrorRandom(); return;}
      if(e.key.length===1&&/^[a-zA-Z]$/.test(e.key)){e.preventDefault();e.stopPropagation(); const l=e.key.toLowerCase(); setInputValue(p=>{const v=p+l;inputRef.current=v;if(checkAns(v,kana))setTimeout(()=>handleCorrectRandom(),0);return v;});}
    };
    document.addEventListener('keydown',handler,true);
    return ()=>document.removeEventListener('keydown',handler,true);
  }, [appState,currentKana,kanaData,practiceMode,selectedAlphabet,selectedGroups,settings.isSound]);

  // --- PRE-START COUNTDOWNS ---
  React.useEffect(() => {
    if (appState==='timeattack' && taRunning && taPreStart > 0) {
      const t = setTimeout(() => setTaPreStart(p=>p-1), 1000);
      return ()=>clearTimeout(t);
    }
    if (appState==='timeattack' && taRunning && taPreStart === 0 && !taFinished && (settings.taQuizType||'typing') !== 'mc') {
      setTimeout(focusMobileInput, 100); // Focus input after countdown (only for typing mode)
    }
  }, [appState, taRunning, taPreStart, taFinished]);

  React.useEffect(() => {
    if (appState==='survival' && svRunning && svPreStart > 0) {
      const t = setTimeout(() => setSvPreStart(p=>p-1), 1000);
      return ()=>clearTimeout(t);
    }
    if (appState==='survival' && svRunning && svPreStart === 0 && !svFinished && (settings.svQuizType||'typing') !== 'mc') {
      setTimeout(focusMobileInput, 100); // Focus input after countdown (only for typing mode)
    }
  }, [appState, svRunning, svPreStart, svFinished]);

  // --- TIME ATTACK TIMER ---
  React.useEffect(() => {
    if(appState!=='timeattack'||!taRunning||taPreStart>0) return;
    if(taTimeLeft<=0){ setTaRunning(false); setTaFinished(true);
      const score = taScoreRef.current;
      if(score > taHighScore) { 
        setTaHighScore(score); 
        localStorage.setItem(HIGHSCORE_KEY, score.toString()); 
        
        // Update global leaderboard (skip for guests)
        if (!isGuest) {
          try {
             let lb = JSON.parse(localStorage.getItem('kana_global_leaderboard')) || [];
             const idx = lb.findIndex(x => x.username === currentUser);
             if (idx >= 0) {
                if (score > lb[idx].score) lb[idx].score = score;
             } else {
                lb.push({username: currentUser, score});
             }
             lb.sort((a,b)=>b.score - a.score);
             localStorage.setItem('kana_global_leaderboard', JSON.stringify(lb));
          } catch(e){}
        }

        setShowConfetti(true); setTimeout(()=>setShowConfetti(false),4000); 
      }
      return;
    }
    const t = setTimeout(()=>setTaTimeLeft(p=>p-1),1000);
    return ()=>clearTimeout(t);
  },[appState,taRunning,taTimeLeft,taPreStart]);

  // TIME ATTACK KEYDOWN
  React.useEffect(() => {
    if(appState!=='timeattack'||!taRunning||taPreStart>0) return; // Added taPreStart check
    const handler = (e) => {
      if(taStatusRef.current!=='idle') return;
      const kana = activeKanaList[taCurrentIdx]; if(!kana) return;
      if(e.key==='Backspace'){e.preventDefault(); setTaInputValue(p=>{const v=p.slice(0,-1);taInputRef.current=v;return v;}); return;}
      if(e.key==='Enter'){e.preventDefault();
        if(taInputRef.current.length>0&&!checkAns(taInputRef.current,kana)){
          const responseTime = Date.now() - taQuestionStartTimeRef.current;
          setTaStatus('error'); taStatusRef.current='error';
          setActiveData(d=>d.map(k=>k.id===kana.id?srsUpdate({...k,mistakeCount:k.mistakeCount+1},false,responseTime):k));
          setTimeout(()=>{
            setTaStatus('idle');taStatusRef.current='idle';setTaInputValue('');taInputRef.current='';
            taQuestionStartTimeRef.current = Date.now();
          },300);
        }
        return;
      }
      if(e.key.length===1&&/^[a-zA-Z]$/.test(e.key)){
        e.preventDefault();e.stopPropagation();
        const nv=taInputRef.current+e.key.toLowerCase();
        setTaInputValue(nv); taInputRef.current=nv;
        if(checkAns(nv,kana)){
          const responseTime = Date.now() - taQuestionStartTimeRef.current;
          setTaStatus('correct'); taStatusRef.current='correct';
          setTaScore(p=>{const ns=p+1;taScoreRef.current=ns;return ns;});
          setActiveData(d=>d.map(k=>k.id===kana.id?srsUpdate({...k,mistakeCount:Math.max(0,k.mistakeCount-1)},true,responseTime):k));
          speakKana(kana.question,settings.isSound);
          setTimeout(()=>{
            setTaInputValue('');taInputRef.current='';
            const taNextI = genWeightedNext(activeKanaList,taCurrentIdx); setTaCurrentIdx(taNextI); setTaMcOptions(generateMultipleChoiceOptions(activeKanaList[taNextI], activeKanaList));
            setTaStatus('idle');taStatusRef.current='idle';
            taQuestionStartTimeRef.current = Date.now();
          },200);
        }
      }
    };
    document.addEventListener('keydown',handler,true);
    return ()=>document.removeEventListener('keydown',handler,true);
  },[appState,taRunning,taPreStart,activeKanaList,taCurrentIdx,settings.isSound]);

  // --- SURVIVAL QUESTION TIMER ---
  React.useEffect(() => {
    if(appState!=='survival'||!svRunning||svPreStart>0||svFinished||svStatusRef.current!=='idle') return;
    if(svTimeLeft <= 0) {
      // Timeout, deduct life
      setSvStatus('error'); svStatusRef.current='error';
      const kana = activeKanaList[svCurrentIdx];
      if (kana) {
        const responseTime = Date.now() - svQuestionStartTimeRef.current;
        setActiveData(d=>d.map(k=>k.id===kana.id?srsUpdate({...k,mistakeCount:k.mistakeCount+1},false,responseTime):k));
        speakKana(kana.question,settings.isSound);
      }
      
      const newLives = svLivesRef.current - 1;
      setSvLives(newLives); svLivesRef.current = newLives;
      
      if(newLives <= 0) {
        setTimeout(() => {
          setSvRunning(false); setSvFinished(true);
          const score = svStreakRef.current;
          if (score > svHighScore) {
             setSvHighScore(score);
             localStorage.setItem(SURVIVAL_HIGHSCORE_KEY, score.toString());
             setShowConfetti(true); setTimeout(()=>setShowConfetti(false),4000); 
          }
        }, 600);
      } else {
        setTimeout(()=>{
          setSvStatus('idle');svStatusRef.current='idle';
          setSvInputValue('');svInputRef.current='';
          const svNextT = genWeightedNext(activeKanaList,svCurrentIdx); setSvCurrentIdx(svNextT); setSvMcOptions(generateMultipleChoiceOptions(activeKanaList[svNextT], activeKanaList));
          setSvTimeLeft(settings.survivalTimer || 5);
          svQuestionStartTimeRef.current = Date.now();
        }, 1000);
      }
      return;
    }
    const t = setTimeout(()=>setSvTimeLeft(p=>p-1),1000);
    return ()=>clearTimeout(t);
  }, [appState,svRunning,svPreStart,svTimeLeft,svFinished,activeKanaList,svCurrentIdx,settings.isSound,settings.survivalTimer]);

  // SURVIVAL KEYDOWN
  React.useEffect(() => {
    if(appState!=='survival'||!svRunning||svPreStart>0) return; // Added svPreStart check
    const handler = (e) => {
      if(svStatusRef.current!=='idle') return;
      const kana = activeKanaList[svCurrentIdx]; if(!kana) return;
      if(e.key==='Backspace'){e.preventDefault(); setSvInputValue(p=>{const v=p.slice(0,-1);svInputRef.current=v;return v;}); return;}
      if(e.key==='Enter'){e.preventDefault();
        if(svInputRef.current.length>0&&!checkAns(svInputRef.current,kana)){
          const responseTime = Date.now() - svQuestionStartTimeRef.current;
          setSvStatus('error'); svStatusRef.current='error';
          setActiveData(d=>d.map(k=>k.id===kana.id?srsUpdate({...k,mistakeCount:k.mistakeCount+1},false,responseTime):k));
          speakKana(kana.question,settings.isSound);
          
          const newLives = svLivesRef.current - 1;
          setSvLives(newLives); svLivesRef.current = newLives;
          
          if(newLives <= 0) {
            setTimeout(() => {
              setSvRunning(false); setSvFinished(true);
              const score = svStreakRef.current;
              if (score > svHighScore) {
                 setSvHighScore(score);
                 localStorage.setItem(SURVIVAL_HIGHSCORE_KEY, score.toString());
                 setShowConfetti(true); setTimeout(()=>setShowConfetti(false),4000); 
              }
            }, 600);
          } else {
            setTimeout(()=>{setSvStatus('idle');svStatusRef.current='idle';setSvInputValue('');svInputRef.current='';setSvTimeLeft(settings.survivalTimer||5);svQuestionStartTimeRef.current = Date.now();},500);
          }
        }
        return;
      }
      if(e.key.length===1&&/^[a-zA-Z]$/.test(e.key)){
        e.preventDefault();e.stopPropagation();
        const nv=svInputRef.current+e.key.toLowerCase();
        setSvInputValue(nv); svInputRef.current=nv;
        if(checkAns(nv,kana)){
          const responseTime = Date.now() - svQuestionStartTimeRef.current;
          setSvStatus('correct'); svStatusRef.current='correct';
          setSvStreak(p=>{const ns=p+1;svStreakRef.current=ns;return ns;});
          setActiveData(d=>d.map(k=>k.id===kana.id?srsUpdate({...k,mistakeCount:Math.max(0,k.mistakeCount-1)},true,responseTime):k));
          speakKana(kana.question,settings.isSound);
          setTimeout(()=>{
            setSvInputValue('');svInputRef.current='';
            const svNextI = genWeightedNext(activeKanaList,svCurrentIdx); setSvCurrentIdx(svNextI); setSvMcOptions(generateMultipleChoiceOptions(activeKanaList[svNextI], activeKanaList));
            setSvStatus('idle');svStatusRef.current='idle';
            setSvTimeLeft(settings.survivalTimer||5);
            svQuestionStartTimeRef.current = Date.now();
          },200);
        }
      }
    };
    document.addEventListener('keydown',handler,true);
    return ()=>document.removeEventListener('keydown',handler,true);
  },[appState,svRunning,activeKanaList,svCurrentIdx,settings.isSound,svHighScore,svPreStart,settings.survivalTimer]);

  // HIDDEN INPUT FOR MOBILE KEYBOARD
  const mobileInputRef = React.useRef(null);
  const focusMobileInput = () => { if(mobileInputRef.current) mobileInputRef.current.focus(); };
  const handleMobileInput = (e) => {
    const val = e.target.value;
    e.target.value = '';
    if(!val) return;
    const chars = val.toLowerCase().replace(/[^a-z]/g,'');
    for(const ch of chars){
      document.dispatchEvent(new KeyboardEvent('keydown',{key:ch,bubbles:true}));
    }
  };

  const togglePracticeMode = () => {
    if(practiceMode==='normal'&&mistakesPool.length>0){setPracticeMode('practice_mistakes');setCurrentIndex(genNext(mistakesPool));setStatus('idle');setInputValue('');}
    else{setPracticeMode('normal');setCurrentIndex(genNext(activeKanaList));setStatus('idle');setInputValue('');}
  };

  // Auto-check a card when leaving it (instant mode)
  const autoCheckCard = (idx) => {
    if(fillCheckMode!=='instant') return;
    const kana = shuffledFillList[idx]; if(!kana) return;
    const val = fillAnswersRef.current[kana.id]||'';
    const res = fillResults[kana.id];
    if(res==='correct'||res==='wrong') return; // already checked
    if(val.length===0) return; // empty, skip
    if(checkAns(val,kana)){
      setFillResults(r=>({...r,[kana.id]:'correct'}));
      if(kana.mistakeCount>0) setActiveData(d=>d.map(k=>k.id===kana.id?{...k,mistakeCount:Math.max(0,k.mistakeCount-1)}:k));
      speakKana(kana.question,settings.isSound);
    } else {
      setFillResults(r=>({...r,[kana.id]:'wrong'}));
      setActiveData(d=>d.map(k=>k.id===kana.id?{...k,mistakeCount:k.mistakeCount+1}:k));
    }
  };

  const moveFocusTo = (newIdx) => {
    const oldIdx = focusedCardIdxRef.current;
    autoCheckCard(oldIdx);
    setFocusedCardIdx(newIdx); focusedCardIdxRef.current=newIdx;
  };

  // FILL ALL KEYDOWN
  React.useEffect(() => {
    if(appState!=='fill'||fillFinished) return;
    const handler = (e) => {
      const idx = focusedCardIdxRef.current;
      const kana = shuffledFillList[idx]; if(!kana) return;
      const ans = fillAnswersRef.current;
      const curVal = ans[kana.id]||'';
      const res = fillResults[kana.id];
      // If card already resolved, allow navigation only
      if(fillCheckMode==='instant' && (res==='correct'||res==='wrong')) {
        if(e.key==='Tab'||e.key==='Enter'){e.preventDefault();const ni=e.shiftKey?Math.max(0,idx-1):Math.min(idx+1,shuffledFillList.length-1);moveFocusTo(ni);}
        return;
      }
      if(e.key==='Backspace'){e.preventDefault();
        // If card was wrong, clear result to let user retry
        if(fillCheckMode==='instant'&&res==='wrong') setFillResults(r=>({...r,[kana.id]:null}));
        const nv=curVal.slice(0,-1);const na={...ans,[kana.id]:nv};setFillAnswers(na);fillAnswersRef.current=na;return;
      }
      if(e.key==='Tab'){e.preventDefault();const ni=e.shiftKey?Math.max(0,idx-1):Math.min(idx+1,shuffledFillList.length-1);moveFocusTo(ni);return;}
      if(e.key==='Enter'){
        e.preventDefault();
        if(fillCheckMode==='instant') { autoCheckCard(idx); const ni=Math.min(idx+1,shuffledFillList.length-1); setTimeout(()=>moveFocusTo(ni),200); }
        return;
      }
      if(e.key.length===1&&/^[a-zA-Z]$/.test(e.key)){
        e.preventDefault();e.stopPropagation();
        // Clear wrong state if retrying
        if(fillCheckMode==='instant'&&res==='wrong') setFillResults(r=>({...r,[kana.id]:null}));
        const nv=curVal+e.key.toLowerCase();
        const na={...ans,[kana.id]:nv};setFillAnswers(na);fillAnswersRef.current=na;
      }
    };
    document.addEventListener('keydown',handler,true);
    return ()=>document.removeEventListener('keydown',handler,true);
  }, [appState,fillCheckMode,fillFinished,shuffledFillList,fillResults,settings.isSound]);

  const handleFinishAll = () => {
    const results = {};
    shuffledFillList.forEach(kana => {
      const val = fillAnswers[kana.id]||'';
      if(checkAns(val,kana)) { results[kana.id]='correct'; if(kana.mistakeCount>0) setActiveData(d=>d.map(k=>k.id===kana.id?{...k,mistakeCount:Math.max(0,k.mistakeCount-1)}:k)); }
      else { results[kana.id]='wrong'; setActiveData(d=>d.map(k=>k.id===kana.id?{...k,mistakeCount:k.mistakeCount+1}:k)); }
    });
    setFillResults(results); setFillFinished(true);
  };

  const backToMenu = () => { setAppState('menu'); setSmartReviewPool(null); if('speechSynthesis' in window) window.speechSynthesis.cancel(); };

  const handleSidebarSubSelect = (sub) => {
    if (sub.goHome) { setAppState('menu'); setMainSection('learning'); return; }
    if (sub.goToStats) { setAppState('stats'); setMainSection('learning'); return; }
    if (sub.mode) setStudyMode(sub.mode);
    if (sub.alphabet) setSelectedAlphabet(sub.alphabet);
    if (sub.tab) setMaterialsTab(sub.tab);
    setAppState('menu');
  };

  // ===================== RENDER =====================

  // ===== RENDER LOGIC =====

  if (mainSection === 'roadmap') {
    return (
      <>
        <Sidebar isOpen={sidebarOpen} onClose={()=>setSidebarOpen(false)} activeSection={mainSection} onSelectSection={setMainSection} onSubSelect={handleSidebarSubSelect} studyMode={studyMode} t={t} />
        <RoadmapScreen toggleSidebar={()=>setSidebarOpen(true)} kanaData={kanaData} vocabData={vocabData} kanjiData={kanjiData} />
      </>
    );
  }

  if (mainSection === 'materials') {
    return (
      <>
        <Sidebar isOpen={sidebarOpen} onClose={()=>setSidebarOpen(false)} activeSection={mainSection} onSelectSection={setMainSection} onSubSelect={handleSidebarSubSelect} studyMode={studyMode} t={t} />
        <MaterialsScreen activeTab={materialsTab} toggleSidebar={()=>setSidebarOpen(true)} />
      </>
    );
  }

  // --- LEARNING SECTION (EXISTING APP) ---
  if(appState==='menu') {
    return (
      <div className="min-h-screen flex flex-col items-center px-4 py-8 relative">
        <Sidebar isOpen={sidebarOpen} onClose={()=>setSidebarOpen(false)} activeSection={mainSection} onSelectSection={setMainSection} onSubSelect={handleSidebarSubSelect} studyMode={studyMode} t={t} />
        <SettingsBar settings={settings} toggleSound={toggleSound} toggleTheme={toggleTheme} toggleLang={toggleLang} displayName={displayName} onLogout={onLogout} onShowTutorial={onShowTutorial} />
        
        {/* Toggle Hamburger & App Title GEMINI STYLE (Top Left) */}
        <div className="absolute top-4 sm:top-5 left-4 sm:left-5 flex items-center gap-3 z-[60]">
           <button onClick={() => setSidebarOpen(true)} className="p-2 -ml-2 text-gray-400 hover:text-gray-800 dark:text-gray-400 dark:hover:text-gray-100 bg-gray-100 dark:bg-gray-800/80 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-xl transition-all focus:outline-none">
             <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2.5} stroke="currentColor" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" /></svg>
           </button>
           <h1 className="text-sm min-[380px]:text-xl sm:text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-500 to-teal-400 drop-shadow-sm flex items-center gap-2.5 tracking-tight select-none cursor-pointer" onClick={() => { setAppState('menu'); setMainSection('learning'); setSidebarOpen(false); }}>
             chơn trunk kúc
           </h1>
        </div>

        {/* Active study mode label (selected from sidebar) */}
        <div className="mt-[72px] sm:mt-[76px] mb-6 flex items-center gap-2">
          <span className={`px-4 py-2 rounded-full text-sm font-bold shadow-sm border ${studyMode==='kana'?'bg-pink-50 text-pink-600 border-pink-200 dark:bg-pink-900/30 dark:text-pink-400 dark:border-pink-800':studyMode==='vocab'?'bg-cyan-50 text-cyan-600 border-cyan-200 dark:bg-cyan-900/30 dark:text-cyan-400 dark:border-cyan-800':'bg-orange-50 text-orange-600 border-orange-200 dark:bg-orange-900/30 dark:text-orange-400 dark:border-orange-800'}`}>
            {studyMode==='kana'?'あ Bảng Chữ Cái':studyMode==='vocab'?'📝 Từ Vựng':'漢 Kanji'}
          </span>
          <button onClick={() => setSidebarOpen(true)} className="text-xs text-gray-400 hover:text-blue-500 dark:text-gray-500 dark:hover:text-blue-400 transition-colors font-semibold underline underline-offset-2">Đổi</button>
        </div>
        {studyMode==='kana' && (<>
          <div className="flex w-full max-w-5xl gap-2 bg-gray-100 dark:bg-gray-800 p-1.5 rounded-xl">
            <SelectButton isSelected={selectedAlphabet==='hiragana'} onClick={() => setSelectedAlphabet('hiragana')} className="flex-1 !border-none !rounded-lg !py-3 !text-base sm:!text-lg !m-0">Hiragana (ひらがな)</SelectButton>
            <SelectButton isSelected={selectedAlphabet==='katakana'} onClick={() => setSelectedAlphabet('katakana')} className="flex-1 !border-none !rounded-lg !py-3 !text-base sm:!text-lg !m-0">Katakana (カタカナ)</SelectButton>
          </div>
          <div className="w-full max-w-5xl mt-6 pb-6 border-b border-gray-200 dark:border-gray-800">
            <SelectButton isSelected={isAllSelected()} onClick={toggleAllKana} className="w-full !m-0 !py-3 !text-lg !border-gray-300 dark:!border-gray-600">{t.selectAll}</SelectButton>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-3 gap-8 w-full max-w-5xl mt-8">
            {['main','dakuten','combination'].map(cat => (

                <h2 className="text-xl sm:text-2xl font-bold mb-4 text-center dark:text-gray-200">{cat==='main'?t.mainKana:cat==='dakuten'?t.dakutenKana:t.comboKana}</h2>
                <SelectButton isSelected={isCategorySelected(cat)} onClick={()=>toggleAllCategory(cat)} className="!mb-4 !border-dashed">{cat==='main'?t.allMain:cat==='dakuten'?t.allDakuten:t.allCombo}</SelectButton>
                <div className="grid grid-cols-2 gap-2 sm:gap-3">
                  {KANA_DEF[selectedAlphabet][cat].map(g => <SelectButton key={g.id} isSelected={selectedGroups[selectedAlphabet].includes(g.id)} onClick={()=>toggleGroup(g.id)}>{g.label}</SelectButton>)}
                </div>
              </div>
            ))}
          </div>
        </>)}
        {studyMode==='vocab' && (
          <div className="w-full max-w-5xl">

            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2.5} stroke="currentColor" className="w-7 h-7 sm:w-9 sm:h-9 group-hover:-translate-y-1 transition-transform"><path strokeLinecap="round" strokeLinejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.89 1.132l-2.685.8.8-2.685a4.5 4.5 0 011.132-1.891l8.93-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" /></svg>
            <span>{t.fillAll}</span>
