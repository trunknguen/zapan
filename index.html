  const handleClose = () => onClose();
  return (
    <div className="fixed inset-0 bg-black/60 z-[999] flex items-center justify-center p-4" onClick={handleClose}>
      <div className="bg-white dark:bg-gray-800 rounded-3xl shadow-2xl max-w-lg w-full max-h-[85vh] overflow-y-auto p-6 sm:p-8 pop-in border border-gray-100 dark:border-gray-700" onClick={e=>e.stopPropagation()}>
        <h2 className="text-2xl font-extrabold text-[#3182ce] dark:text-blue-400 mb-1 flex items-center gap-2">🇯🇵 Hành Trình học Za pan lì cùng trơn trunk kúc</h2>
        <p className="text-sm text-gray-500 dark:text-gray-400 mb-5">Ứng dụng học Tiếng Nhật miễn phí</p>
        
        <div className="space-y-3 text-sm">
          <div className="flex gap-3 items-start bg-blue-50 dark:bg-blue-900/20 p-3 rounded-xl">
            <span className="text-xl flex-shrink-0">🎲</span>
            <div><b className="text-gray-800 dark:text-white">Ngẫu Nhiên:</b> <span className="text-gray-600 dark:text-gray-300">Hệ thống sẽ đưa ra câu hỏi ngẫu nhiên. Gõ romaji (phiên âm) để trả lời. Thuật toán SRS sẽ tự ưu tiên các chữ bạn hay sai!</span></div>
          </div>
          <div className="flex gap-3 items-start bg-emerald-50 dark:bg-emerald-900/20 p-3 rounded-xl">
            <span className="text-xl flex-shrink-0">📝</span>
            <div><b className="text-gray-800 dark:text-white">Điền Hết:</b> <span className="text-gray-600 dark:text-gray-300">Tất cả các thẻ chữ xuất hiện trên màn hình. Bấm vào từng thẻ rồi gõ đáp án. Phù hợp để ôn tổng thể.</span></div>
          </div>
          <div className="flex gap-3 items-start bg-orange-50 dark:bg-orange-900/20 p-3 rounded-xl">
            <span className="text-xl flex-shrink-0">⏱️</span>
            <div><b className="text-gray-800 dark:text-white">Time Attack:</b> <span className="text-gray-600 dark:text-gray-300">Thử thách tốc độ! Gõ đáp án thật nhanh trong 60 giây. Điểm cao sẽ được ghi vào Bảng Xếp Hạng.</span></div>
          </div>
          <div className="flex gap-3 items-start bg-rose-50 dark:bg-rose-900/20 p-3 rounded-xl">
            <span className="text-xl flex-shrink-0">⚔️</span>
            <div><b className="text-gray-800 dark:text-white">Sinh Tồn (Sudden Death):</b> <span className="text-gray-600 dark:text-gray-300">Tránh sai lầm! Bạn chỉ có 3 mạng, mỗi lần gõ sai sẽ mất 1 tim. Xem bạn trả lời liên tục được bao nhiêu câu.</span></div>
          </div>
          <div className="flex gap-3 items-start bg-purple-50 dark:bg-purple-900/20 p-3 rounded-xl">
            <span className="text-xl flex-shrink-0">🎮</span>
            <div><b className="text-gray-800 dark:text-white">Match Game:</b> <span className="text-gray-600 dark:text-gray-300">Mini-game nối chữ! Ghép cặp Tiếng Nhật với phiên âm/nghĩa đúng trong 60 giây. Nối sai bị trừ 3 giây!</span></div>
          </div>
          <div className="flex gap-3 items-start bg-indigo-50 dark:bg-indigo-900/20 p-3 rounded-xl">
            <span className="text-xl flex-shrink-0">📊</span>

        <div className="mt-5 p-3 bg-yellow-50 dark:bg-yellow-900/20 rounded-xl border border-yellow-200 dark:border-yellow-800">

        </div>

        <button onClick={handleClose} className="w-full mt-4 bg-[#3182ce] text-white py-3.5 rounded-xl font-bold text-lg hover:bg-[#2b6cb0] active:scale-95 transition-all shadow-lg shadow-blue-500/30">
          Bắt Đầu Học Ngay! 🚀
        </button>
      </div>
    </div>
  );
}

function App() {
  const [currentUser, setCurrentUser] = React.useState(null);
  const [isGuest, setIsGuest] = React.useState(false);
  const [displayName, setDisplayName] = React.useState('');
  const [showTutorial, setShowTutorial] = React.useState(false);
  const [authLoading, setAuthLoading] = React.useState(true);

  // Listen for Firebase auth changes
  React.useEffect(() => {
    const unsub = fbAuth.onAuthStateChanged(user => {
      if (user) {
        setCurrentUser(user.uid);
        setDisplayName(user.displayName || user.email || user.uid);
        setIsGuest(false);
        localStorage.setItem('kana_current_user', user.uid);
        localStorage.setItem('kana_is_guest', 'false');
        if (!localStorage.getItem(`kana_tutorial_hidden_${user.uid}`)) {
          setShowTutorial(true);
        }
      } else {
        // Check if guest was previously set
        const savedGuest = localStorage.getItem('kana_is_guest') === 'true';
        if (savedGuest) {
          setCurrentUser('__guest__');
          setIsGuest(true);
        } else {
          setCurrentUser(null);
          setIsGuest(false);
        }
      }
      setAuthLoading(false);
    });
    return () => unsub();
  }, []);

  const handleGuest = () => {
    localStorage.setItem('kana_current_user', '__guest__');
    localStorage.setItem('kana_is_guest', 'true');
    setCurrentUser('__guest__');
    setIsGuest(true);
    if (!localStorage.getItem('kana_tutorial_hidden___guest__')) {
      setShowTutorial(true);
    }
  };
  const handleLogout = async () => {
    try { await fbAuth.signOut(); } catch(e){}
    localStorage.removeItem('kana_current_user');
    localStorage.removeItem('kana_is_guest');
    setCurrentUser(null);
    setIsGuest(false);
  };

  if (authLoading) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-gray-50 dark:bg-gray-900">
        <div className="flex flex-col items-center justify-center gap-4 text-center pop-in">
          <div className="w-12 h-12 border-4 border-[#3182ce]/20 border-t-[#3182ce] rounded-full animate-spin"></div>
          <div className="text-lg font-bold text-gray-500 dark:text-gray-400">Đang tải...</div>
        </div>
      </div>
    );
  }
  
  if (!currentUser) {
    return <LoginApp onGuest={handleGuest} onNameUpdate={setDisplayName} />;
  }
  return (
    <>
      {showTutorial && <TutorialPopup onClose={() => setShowTutorial(false)} userKey={isGuest ? '__guest__' : currentUser} />}
      <MainApp key={currentUser} currentUser={isGuest ? null : currentUser} isGuest={isGuest} onLogout={handleLogout} onShowTutorial={() => setShowTutorial(true)} displayName={isGuest ? 'Khách' : displayName} />
    </>
  );
}

class ErrorBoundary extends React.Component {
  constructor(p){super(p);this.state={hasError:false,err:''};}
  static getDerivedStateFromError(e){return{hasError:true,err:e.toString()};}
  render(){if(this.state.hasError) return <div className="p-8 text-red-500 min-h-screen"><h1 className="text-2xl font-bold mb-4">App Crashed</h1><div className="p-4 bg-gray-100 rounded font-mono text-sm mt-4">{this.state.err}</div><button onClick={()=>window.location.reload()} className="mt-8 px-6 py-2 bg-blue-500 text-white rounded">Reload</button></div>; return this.props.children;}
}
ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
