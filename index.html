// SRS Engine (SM-2 inspired)
const srsUpdate = (card, isCorrect) => {
  const now = Date.now();
  let { interval, ease, nextReview, corrects } = card;
  interval = interval || 0; ease = ease || 2.5; nextReview = nextReview || 0; corrects = corrects || 0;
  if (isCorrect) {
    if (interval === 0) interval = 1;        // 1 minute
    else if (interval === 1) interval = 10;  // 10 minutes
    else if (interval < 60) interval = 60;   // 1 hour
    else if (interval < 1440) interval = 1440; // 1 day
    else interval = Math.round(interval * Math.min(ease, 4));
    ease = Math.max(1.3, ease + 0.1);
    corrects += 1;
  } else {
    interval = 1; // reset to 1 minute
    ease = Math.max(1.3, ease - 0.2);
  }
  return { ...card, interval, ease, nextReview: now + interval * 60000, corrects };
};
const isDue = (card) => !card.nextReview || Date.now() >= card.nextReview;

  const u = new SpeechSynthesisUtterance(text); u.lang='ja-JP'; u.rate=1.0; u.pitch=1.1;

};
const ROMAJI_TO_HIRA = {};
['main','dakuten','combination'].forEach(cat => {
  if(KANA_DEF.hiragana[cat]) KANA_DEF.hiragana[cat].forEach(g => g.items.forEach(i => i.a.forEach(a => ROMAJI_TO_HIRA[a] = i.q)));
});
ROMAJI_TO_HIRA['nn'] = 'ん'; ROMAJI_TO_HIRA['n'] = 'ん';

const convertRomajiToHiragana = (str) => {
  let res = '', i = 0;
  while(i < str.length) {
    if(i+2 < str.length && ROMAJI_TO_HIRA[str.slice(i, i+3)]) { res += ROMAJI_TO_HIRA[str.slice(i, i+3)]; i+=3; continue; }
    if(i+1 < str.length && ROMAJI_TO_HIRA[str.slice(i, i+2)]) { res += ROMAJI_TO_HIRA[str.slice(i, i+2)]; i+=2; continue; }
    if(ROMAJI_TO_HIRA[str.slice(i, i+1)]) { res += ROMAJI_TO_HIRA[str.slice(i, i+1)]; i+=1; continue; }
    if(i+1 < str.length && str[i] === str[i+1] && str[i] !== 'n') { res += 'っ'; i+=1; continue; }
    res += str[i]; i+=1;
  }
  return res;
};

const checkAns = (val, kana) => {
  if(!kana || !val) return false;
  const valNorm = val.toLowerCase().trim();
  if(valNorm === kana.question) return true;
  const answers = Array.isArray(kana.answer) ? kana.answer : [kana.answer];
  if(answers.includes(valNorm)) return true;
  for(const ans of answers) {
    if(valNorm === convertRomajiToHiragana(ans)) return true;
  }
  return false;
};

function StatsScreen({ backToMenu, kanaData, vocabData, kanjiData }) {
  const chartRef = React.useRef(null);
  const chartInstance = React.useRef(null);
  
  const topMistakes = React.useMemo(() => {
     let all = [];
     kanaData.forEach(k => {
        if (k.mistakeCount > 0) all.push({ q: k.question, mistakes: k.mistakeCount, label: 'Kana' });
     });
     vocabData.forEach(v => {
        if (v.mistakeCount > 0) all.push({ q: v.question||v.title, mistakes: v.mistakeCount, label: 'Vocab' });
     });
     kanjiData.forEach(k => {
        if (k.mistakeCount > 0) all.push({ q: k.question||k.kanji, mistakes: k.mistakeCount, label: 'Kanji' });
     });
     return all.sort((a,b) => b.mistakes - a.mistakes).slice(0, 10);
  }, [kanaData, vocabData, kanjiData]);

  const summarizeMastery = React.useMemo(() => {
     let l_k = 0, r_k = 0, un_k = 0, t_k = 0;
     for(const alpha in KANA_DEF) for(const cat in KANA_DEF[alpha]) for(const g of KANA_DEF[alpha][cat]) for(const i of g.items) {
       t_k++; const d = kanaData.find(k=>k.question===i.q);
       if(d){ if(d.mistakeCount>0)r_k++; else if(d.corrects>0 && d.mistakeCount===0)l_k++; else un_k++; } else un_k++;
     }
     let l_v = 0, r_v = 0, un_v = 0, t_v = vocabData.length;
     vocabData.forEach(v => { if(v.mistakeCount>0)r_v++; else if(v.corrects>0 && v.mistakeCount===0)l_v++; else un_v++; });
     
     let l_kj = 0, r_kj = 0, un_kj = 0, t_kj = kanjiData.length;
     kanjiData.forEach(k => { if(k.mistakeCount>0)r_kj++; else if(k.corrects>0 && k.mistakeCount===0)l_kj++; else un_kj++; });

     const totalL = l_k + l_v + l_kj;
     const totalItems = t_k + t_v + t_kj;
     const overAllPct = totalItems > 0 ? ((totalL / totalItems) * 100).toFixed(1) : 0;

     return {
       kana: { l:l_k, r:r_k, un:un_k, t:t_k, lp: t_k? (l_k/t_k)*100 : 0, rp: t_k? (r_k/t_k)*100 : 0 },
       vocab: { l:l_v, r:r_v, un:un_v, t:t_v, lp: t_v? (l_v/t_v)*100 : 0, rp: t_v? (r_v/t_v)*100 : 0 },
       kanji: { l:l_kj, r:r_kj, un:un_kj, t:t_kj, lp: t_kj? (l_kj/t_kj)*100 : 0, rp: t_kj? (r_kj/t_kj)*100 : 0 },
       totalL, totalItems, overAllPct
     };
  }, [kanaData, vocabData, kanjiData]);

  React.useEffect(() => {
    if (!chartRef.current || topMistakes.length === 0) return;
    if (chartInstance.current) chartInstance.current.destroy();
    
    const isDark = document.documentElement.classList.contains('dark');
    const textColor = isDark ? '#9ca3af' : '#6b7280';
    const gridColor = isDark ? '#374151' : '#f3f4f6';
    const titleColor = isDark ? '#f3f4f6' : '#1f2937';

    const ctx = chartRef.current.getContext('2d');
    chartInstance.current = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: topMistakes.map(m => m.q),
        datasets: [{
          label: 'Số lần sai',
          data: topMistakes.map(m => m.mistakes),
          backgroundColor: 'rgba(239, 68, 68, 0.7)',
          borderColor: 'rgba(239, 68, 68, 1)',
          borderWidth: 1,
          borderRadius: 6
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            titleFont: { family: 'Noto Sans JP, sans-serif', size: 18 }
          }
        },
        scales: {
          y: { 
            beginAtZero: true, 
            ticks: { stepSize: 1, color: textColor, font: { weight: 'bold' } },
             grid: { color: gridColor }
          },
          x: {
             ticks: { color: titleColor, font: { family: 'Noto Sans JP, sans-serif', size: 24, weight: 'bold' } },
             grid: { display: false }
          }
        }
      }
    });
    
    return () => { if (chartInstance.current) chartInstance.current.destroy(); };
  }, [topMistakes]);

  return (
    <div className="min-h-screen flex flex-col items-center px-4 py-8 relative">

function SingleCharCanvas({ char, showGuide, addClearRef }) {
  const canvasRef = React.useRef(null);
  const isDrawing = React.useRef(false);

  React.useEffect(() => {
    addClearRef(() => {
      const cvs = canvasRef.current;
      if (cvs) {
        const ctx = cvs.getContext('2d');
        ctx.clearRect(0, 0, cvs.width, cvs.height);
      }
    });
  }, [addClearRef]);

  const startDraw = (e) => {
    isDrawing.current = true;
    const cvs = canvasRef.current;
    if(!cvs) return;
    const ctx = cvs.getContext('2d');
    const rect = cvs.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    const scaleX = cvs.width / rect.width;
    const scaleY = cvs.height / rect.height;
    ctx.beginPath();
    ctx.moveTo(x * scaleX, y * scaleY);
    if(e.cancelable) e.preventDefault();
  };

  const draw = (e) => {
    if(!isDrawing.current) return;
    const cvs = canvasRef.current;
    if(!cvs) return;
    const ctx = cvs.getContext('2d');
    const rect = cvs.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    const scaleX = cvs.width / rect.width;
    const scaleY = cvs.height / rect.height;
    const isDark = document.documentElement.classList.contains('dark');
    ctx.lineWidth = 14;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    // Use dynamic stroke style so it adapts to dark theme
    ctx.strokeStyle = isDark ? '#ffffff' : '#1f2937';
    ctx.lineTo(x * scaleX, y * scaleY);
    ctx.stroke();
    if(e.cancelable) e.preventDefault();
  };

  const endDraw = () => { isDrawing.current = false; };

  return (
    <div className="relative w-full aspect-square bg-white dark:bg-gray-800 rounded-2xl shadow-sm border-2 border-dashed border-[#3182ce] dark:border-blue-500 overflow-hidden shrink-0 touch-none">
      <div className="absolute inset-0 pointer-events-none flex items-center justify-center">
        <div className="w-full h-px border-t border-dashed border-gray-300 dark:border-gray-600 absolute"></div>
        <div className="h-full w-px border-l border-dashed border-gray-300 dark:border-gray-600 absolute"></div>
      </div>
      <div className={`absolute inset-0 flex items-center justify-center pointer-events-none transition-opacity duration-300 ${showGuide ? 'opacity-20 dark:opacity-30' : 'opacity-0'}`}>
        <span className="text-[120px] sm:text-[200px] leading-none text-gray-800 dark:text-gray-200 kana-text font-normal select-none">{char}</span>
      </div>
      <canvas ref={canvasRef} width={400} height={400} className="w-full h-full cursor-crosshair relative z-10 block" onMouseDown={startDraw} onMouseMove={draw} onMouseUp={endDraw} onMouseOut={endDraw} onTouchStart={startDraw} onTouchMove={draw} onTouchEnd={endDraw} />
    </div>
  );
}

    const wrapper = document.getElementById('writing_wrapper');

  }, [currentIndex]);

  const currentItem = pool[currentIndex];
  const isVocab = currentItem?.type === 'vocab' || currentItem?.type === 'kanji';
  const displayString = isVocab ? (currentItem.question || currentItem.kanji || currentItem.answer[0]) : (currentItem?.question || '');
  const chars = displayString.split('');

  const clearCanvas = () => {
    Object.values(clearFuncs.current).forEach(f => f && f());
  };

  const nextWord = () => {
    clearCanvas();
    setCurrentIndex(p => (p + 1) % pool.length);

                    chars.length <= 4 ? 'grid-cols-2 md:grid-cols-4 max-w-3xl' :

  return (
    <div id="writing_wrapper" className="min-h-screen flex flex-col items-center px-4 py-6 relative outline-none" tabIndex={0} onKeyDown={(e)=>{if(e.key==='ArrowRight'||e.key==='Enter') nextWord(); if(e.key==='ArrowLeft') prevWord();}}>

      <p className="text-sm text-gray-400 dark:text-gray-500 mb-4 flex items-center gap-2">
        <span>Từ {currentIndex + 1} / {pool.length}</span>
      </p>

      {/* READING HINT */}
      <div className="flex flex-col items-center mb-6">
        <div className="text-xl sm:text-2xl font-bold bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200 px-6 py-3 rounded-2xl shadow-sm border-2 border-dashed border-[#3182ce] dark:border-blue-500">

               <span className="text-[#3182ce] dark:text-blue-400">{currentItem.answer ? (Array.isArray(currentItem.answer) ? currentItem.answer[0] : currentItem.answer) : displayString}</span>

function MatchGame({ backToMenu, pool, settings }) {
  const t = T[settings.lang] || T.vi;
  const PAIR_COUNT = Math.min(8, Math.floor(pool.length));
  const [cards, setCards] = React.useState([]);
  const [selected, setSelected] = React.useState([]);
  const [matched, setMatched] = React.useState([]);
  const [timeLeft, setTimeLeft] = React.useState(60);
  const [running, setRunning] = React.useState(false);
  const [finished, setFinished] = React.useState(false);
  const [score, setScore] = React.useState(0);
  const [combo, setCombo] = React.useState(0);
  const [wrongFlash, setWrongFlash] = React.useState([]);
  const timerRef = React.useRef(null);

  const shuffle = (arr) => { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

  const initGame = () => {
    if (pool.length < 2) return;
    const picked = shuffle(pool).slice(0, PAIR_COUNT);
    const cardPairs = [];
    picked.forEach((item, idx) => {
      const isVocabOrKanji = item.type === 'vocab' || item.type === 'kanji';
      const qLabel = item.question;
      const aLabel = isVocabOrKanji ? (item.meaning ? (settings.lang==='vi' ? item.meaning.vi : item.meaning.en) : item.answer[0]) : item.answer[0];
      cardPairs.push({ pairId: idx, text: qLabel, side: 'q', isJP: true });
      cardPairs.push({ pairId: idx, text: aLabel, side: 'a', isJP: false });
    });
    setCards(shuffle(cardPairs));
    setSelected([]);
    setMatched([]);
    setScore(0);
    setCombo(0);
    setTimeLeft(60);
    setRunning(true);
    setFinished(false);
    setWrongFlash([]);
  };

  React.useEffect(() => { initGame(); }, []);

  React.useEffect(() => {
    if (!running) return;
    if (timeLeft <= 0) { setRunning(false); setFinished(true); return; }
    timerRef.current = setTimeout(() => setTimeLeft(p => p - 1), 1000);
    return () => clearTimeout(timerRef.current);
  }, [running, timeLeft]);

  React.useEffect(() => {
    if (matched.length === PAIR_COUNT * 2 && running) {
      setRunning(false);
      setFinished(true);
    }
  }, [matched]);

  const handleCardClick = (cardIdx) => {
    if (!running || finished) return;
    if (matched.includes(cardIdx)) return;
    if (selected.includes(cardIdx)) return;
    if (selected.length >= 2) return;

    const newSel = [...selected, cardIdx];
    setSelected(newSel);

    if (newSel.length === 2) {
      const c1 = cards[newSel[0]];
      const c2 = cards[newSel[1]];
      if (c1.pairId === c2.pairId && c1.side !== c2.side) {
        // CORRECT match
        const newCombo = combo + 1;
        setCombo(newCombo);
        setScore(s => s + 10 + (newCombo > 1 ? newCombo * 5 : 0));
        setTimeout(() => {
          setMatched(m => [...m, newSel[0], newSel[1]]);
          setSelected([]);
        }, 400);
      } else {
        // WRONG match
        setCombo(0);
        setWrongFlash(newSel);
        setTimeLeft(p => Math.max(0, p - 3));
        setTimeout(() => { setSelected([]); setWrongFlash([]); }, 600);
      }
    }
  };

  const matchedCount = Math.floor(matched.length / 2);
  const pctComplete = (matchedCount / PAIR_COUNT) * 100;
  const timerColor = timeLeft > 20 ? 'text-green-600 dark:text-green-400' : timeLeft > 10 ? 'text-yellow-500' : 'text-red-500';

  if (finished) {
    const allMatched = matched.length === PAIR_COUNT * 2;
    return (
      <div className="min-h-screen flex flex-col items-center justify-center px-4 relative">
        <div className="bg-white dark:bg-gray-800 rounded-3xl shadow-xl p-8 sm:p-12 max-w-md w-full text-center pop-in border border-gray-100 dark:border-gray-700">
          <div className="text-6xl mb-4">{allMatched ? '🎉' : '⏰'}</div>
          <h2 className="text-2xl sm:text-3xl font-extrabold mb-2 text-gray-800 dark:text-white">{allMatched ? 'Hoàn Thành!' : 'Hết Giờ!'}</h2>
          <p className="text-5xl font-black text-[#3182ce] dark:text-blue-400 my-4">{score}</p>
          <p className="text-gray-500 dark:text-gray-400 font-bold mb-2">điểm • {matchedCount}/{PAIR_COUNT} cặp</p>
          {allMatched && <p className="text-sm text-emerald-600 dark:text-emerald-400 font-bold mb-4">Thời gian còn lại: {timeLeft}s 🏆</p>}
          <div className="flex gap-3 mt-6">
            <button onClick={initGame} className="flex-1 bg-gradient-to-r from-purple-500 to-indigo-500 text-white rounded-2xl px-5 py-3.5 font-extrabold shadow-lg hover:from-purple-600 hover:to-indigo-600 active:scale-95 transition-all">🔄 Chơi Lại</button>
            <button onClick={backToMenu} className="flex-1 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 rounded-2xl px-5 py-3.5 font-extrabold shadow-sm hover:bg-gray-200 dark:hover:bg-gray-600 active:scale-95 transition-all">← Menu</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen flex flex-col items-center px-3 py-4 sm:px-6 sm:py-8 relative">
      <button onClick={backToMenu} className="absolute top-4 sm:top-6 left-4 sm:left-6 text-gray-500 dark:text-gray-400 font-bold hover:text-gray-800 dark:hover:text-white transition px-4 py-2.5 flex items-center bg-gray-100 dark:bg-gray-800 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 text-sm z-50 shadow-sm">&#8592; Menu</button>

      <div className="flex items-center gap-4 sm:gap-8 mt-14 sm:mt-6 mb-4">
        <div className="text-center">
          <span className={`text-4xl sm:text-5xl font-black ${timerColor}`}>{timeLeft}</span>
          <p className="text-xs text-gray-400 font-bold mt-1">giây</p>
        </div>
        <div className="h-12 w-px bg-gray-200 dark:bg-gray-700"></div>
        <div className="text-center">
          <span className="text-4xl sm:text-5xl font-black text-[#3182ce] dark:text-blue-400">{score}</span>
          <p className="text-xs text-gray-400 font-bold mt-1">điểm</p>
        </div>
        {combo > 1 && (
          <div className="bg-gradient-to-r from-amber-400 to-orange-500 text-white px-3 py-1.5 rounded-full font-extrabold text-sm shadow-lg animate-bounce">
            🔥 x{combo}
          </div>
        )}
      </div>

      <div className="w-full max-w-2xl mb-3">
        <div className="w-full h-2.5 bg-gray-100 dark:bg-gray-700 rounded-full overflow-hidden">
          <div className="h-full bg-gradient-to-r from-emerald-400 to-green-500 rounded-full transition-all duration-500" style={{width: `${pctComplete}%`}}></div>
        </div>
        <p className="text-xs text-gray-400 text-right mt-1 font-bold">{matchedCount}/{PAIR_COUNT}</p>
      </div>

      <div className="grid grid-cols-4 gap-2 sm:gap-3 w-full max-w-2xl">
        {cards.map((card, idx) => {
          const isMatched = matched.includes(idx);
          const isSelected = selected.includes(idx);
          const isWrong = wrongFlash.includes(idx);
          return (
            <button
              key={idx}
              onClick={() => handleCardClick(idx)}
              disabled={isMatched}
              className={`
                relative aspect-square rounded-xl sm:rounded-2xl font-bold text-sm sm:text-lg flex items-center justify-center
                transition-all duration-200 outline-none border-2 shadow-sm
                ${isMatched ? 'opacity-0 scale-75 pointer-events-none' : ''}
                ${isSelected && !isWrong ? 'bg-blue-100 dark:bg-blue-900/50 border-blue-500 scale-105 shadow-lg ring-2 ring-blue-300 dark:ring-blue-600' : ''}
                ${isWrong ? 'bg-red-100 dark:bg-red-900/40 border-red-500 animate-shake' : ''}
                ${!isSelected && !isMatched && !isWrong ? 'bg-white dark:bg-gray-800 border-gray-200 dark:border-gray-600 hover:border-blue-400 dark:hover:border-blue-500 hover:shadow-md active:scale-95 cursor-pointer' : ''}
              `}
            >
              <span className={`${card.isJP ? 'kana-text text-lg sm:text-2xl' : 'text-xs sm:text-sm'} ${isSelected || isMatched ? 'text-[#3182ce] dark:text-blue-300' : 'text-gray-700 dark:text-gray-200'}`}>
                {card.text}
              </span>
              {card.isJP && <span className="absolute top-1 right-1.5 text-[9px] text-blue-400 font-bold opacity-60">JP</span>}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function MainApp({ currentUser, isGuest, onLogout, onShowTutorial, displayName }) {

      return p; 
    }
    return { isDark: window.matchMedia('(prefers-color-scheme: dark)').matches, isSound: false, lang: 'vi', dailyStreak: 0, lastActiveDate: null };
  });
  const t = T[settings.lang] || T.vi;

  React.useEffect(() => {
    setSettings(prev => {
      const today = new Date().toDateString();
      if(prev.lastActiveDate === today) return prev; // Already updated today

      let currentStreak = prev.dailyStreak || 0;
      if (prev.lastActiveDate) {
         const lastDate = new Date(prev.lastActiveDate);
         const currentDate = new Date(today);
         const diffTime = Math.abs(currentDate - lastDate);
         const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
         if (diffDays === 1) {
            currentStreak += 1; // Continued streak
         } else if (diffDays > 1) {
            currentStreak = 1; // Broken streak, reset to 1
         }
      } else {
         currentStreak = 1; // First time playing
      }
      return { ...prev, dailyStreak: currentStreak, lastActiveDate: today };
    });
  }, []);

  React.useEffect(() => {

  const toggleTheme = () => setSettings(s => ({...s, isDark:!s.isDark}));

  const [kanaData, setKanaData] = React.useState(() => {

    return defaultKanaData;
  });
  React.useEffect(() => { localStorage.setItem(STORAGE_KEY, JSON.stringify(kanaData)); }, [kanaData]);

  const [vocabData, setVocabData] = React.useState(() => {
    const sd = localStorage.getItem(VOCAB_KEY);
    if(sd) { try { const p=JSON.parse(sd); return defaultVocabData.map(d=>{const m=p.find(k=>k.id===d.id); return m?{...d,mistakeCount:m.mistakeCount||0,corrects:m.corrects||0}:d;}); } catch(e){} }
    return defaultVocabData;
  });
  React.useEffect(() => { localStorage.setItem(VOCAB_KEY, JSON.stringify(vocabData)); }, [vocabData]);

  const [kanjiData, setKanjiData] = React.useState(() => {

    return defaultKanjiData;

  React.useEffect(() => { localStorage.setItem(KANJI_KEY, JSON.stringify(kanjiData)); }, [kanjiData]);

  const [appState, setAppState] = React.useState('menu');

  const activeKanaList = React.useMemo(() => {
    if(studyMode==='vocab') return vocabData.filter(k => selectedVocabGroups.includes(k.groupId));

  // SURVIVAL STATE
  const [svLives, setSvLives] = React.useState(3);

  const [svHighScore, setSvHighScore] = React.useState(()=>parseInt(localStorage.getItem(SURVIVAL_HIGHSCORE_KEY))||0);
  const [svRunning, setSvRunning] = React.useState(false);

  const [svCurrentIdx, setSvCurrentIdx] = React.useState(0);
  const [svPreStart, setSvPreStart] = React.useState(0); // Added
  const [svTimeLeft, setSvTimeLeft] = React.useState(5); // Added
  const svInputRef = React.useRef('');
  const svStatusRef = React.useRef('idle');
  const svStreakRef = React.useRef(0);
  const svLivesRef = React.useRef(3);

  // ===== FIRESTORE CLOUD SYNC =====
  const [cloudLoaded, setCloudLoaded] = React.useState(isGuest);
  const syncTimerRef = React.useRef(null);

  const mergeData = (localArr, cloudArr, keyField) => {
    if (!cloudArr || !Array.isArray(cloudArr)) return localArr;
    return localArr.map(local => {
      const cloud = cloudArr.find(c => c[keyField] === local[keyField]);
      if (!cloud) return local;
      return {
        ...local,
        mistakeCount: Math.max(local.mistakeCount || 0, cloud.mistakeCount || 0),
        corrects: Math.max(local.corrects || 0, cloud.corrects || 0),
        interval: Math.max(local.interval || 0, cloud.interval || 0),
        ease: cloud.ease || local.ease || 2.5,

      };
    });
  };

  React.useEffect(() => {
    if (isGuest || !currentUser) { setCloudLoaded(true); return; }
    const uid = currentUser;
    fbDb.collection('users').doc(uid).get().then(doc => {
      if (doc.exists) {
        const d = doc.data();
        if (d.kanaData) setKanaData(prev => mergeData(prev, d.kanaData, 'question'));
        if (d.vocabData) setVocabData(prev => mergeData(prev, d.vocabData, 'id'));
        if (d.kanjiData) setKanjiData(prev => mergeData(prev, d.kanjiData, 'id'));
        if (d.settings) setSettings(prev => ({...prev, survivalTimer: prev.survivalTimer || 5, ...d.settings}));
        if (d.taHighScore) setTaHighScore(prev => Math.max(prev, d.taHighScore));
        if (d.svHighScore) setSvHighScore(prev => Math.max(prev, d.svHighScore));
      }
      setCloudLoaded(true);
    }).catch(e => { console.log('Cloud load error:', e); setCloudLoaded(true); });
  }, []);

  const saveToCloud = React.useCallback(() => {
    if (isGuest || !currentUser) return;
    if (syncTimerRef.current) clearTimeout(syncTimerRef.current);
    syncTimerRef.current = setTimeout(() => {
      const uid = currentUser;
      const kanaCompact = kanaData.filter(k => k.mistakeCount > 0 || k.corrects > 0).map(k => ({
        question: k.question, mistakeCount: k.mistakeCount, corrects: k.corrects,
        interval: k.interval, ease: k.ease, nextReview: k.nextReview
      }));
      const vocabCompact = vocabData.filter(k => k.mistakeCount > 0 || k.corrects > 0).map(k => ({
        id: k.id, mistakeCount: k.mistakeCount, corrects: k.corrects,
        interval: k.interval, ease: k.ease, nextReview: k.nextReview
      }));
      const kanjiCompact = kanjiData.filter(k => k.mistakeCount > 0 || k.corrects > 0).map(k => ({
        id: k.id, mistakeCount: k.mistakeCount, corrects: k.corrects,
        interval: k.interval, ease: k.ease, nextReview: k.nextReview
      }));
      fbDb.collection('users').doc(uid).set({
        kanaData: kanaCompact, vocabData: vocabCompact, kanjiData: kanjiCompact,
        settings: { isDark: settings.isDark, isSound: settings.isSound, lang: settings.lang },
        taHighScore, svHighScore,
        lastSync: Date.now()
      }, { merge: true }).catch(e => console.log('Cloud save error:', e));
    }, 2000);
  }, [currentUser, isGuest, kanaData, vocabData, kanjiData, settings, taHighScore, svHighScore]);

  React.useEffect(() => { if (cloudLoaded) saveToCloud(); }, [kanaData, vocabData, kanjiData, settings, taHighScore, svHighScore]);

  // FILL ALL STATE
  const [fillCheckMode, setFillCheckMode] = React.useState('instant');
  const [fillAnswers, setFillAnswers] = React.useState({});
  const [fillResults, setFillResults] = React.useState({});
  const [focusedCardIdx, setFocusedCardIdx] = React.useState(0);
  const [fillFinished, setFillFinished] = React.useState(false);
  const [shuffledFillList, setShuffledFillList] = React.useState([]);
  const fillAnswersRef = React.useRef({});
  const focusedCardIdxRef = React.useRef(0);

  // Fisher-Yates shuffle
  const shuffle = (arr) => { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

  const mistakesPool = activeKanaList.filter(k=>k.mistakeCount>0);
  const activeQuizData = practiceMode==='practice_mistakes'&&mistakesPool.length>0 ? mistakesPool : activeKanaList;
  let currentKana = activeQuizData.length>0 ? (activeQuizData[currentIndex]||activeQuizData[0]) : null;

  React.useEffect(() => { currentKanaRef.current = currentKana; });
  React.useEffect(() => { statusRef.current = status; }, [status]);
  React.useEffect(() => { inputRef.current = inputValue; }, [inputValue]);
  React.useEffect(() => { fillAnswersRef.current = fillAnswers; }, [fillAnswers]);
  React.useEffect(() => { focusedCardIdxRef.current = focusedCardIdx; }, [focusedCardIdx]);

  const goalCount = activeKanaList.length;
  const progressPercent = Math.min((correctCount/Math.max(goalCount,1))*100,100);

  React.useEffect(() => { if(appState==='quiz'&&status==='idle'&&currentKana) speakKana(currentKana.question,settings.isSound); }, [currentIndex,appState,practiceMode,status]);
  React.useEffect(() => { if(practiceMode==='practice_mistakes'&&mistakesPool.length===0) setPracticeMode('normal'); }, [mistakesPool.length]);
  React.useEffect(() => { setShowStrokeOrder(false); }, [currentIndex, appState]);

  const toggleGroup = (gid) => { const c=selectedGroups[selectedAlphabet]; setSelectedGroups({...selectedGroups,[selectedAlphabet]:c.includes(gid)?c.filter(i=>i!==gid):[...c,gid]}); };
  const toggleAllCategory = (cat) => { const cg=KANA_DEF[selectedAlphabet][cat].map(g=>g.id); const c=selectedGroups[selectedAlphabet]; const all=cg.every(i=>c.includes(i)); setSelectedGroups({...selectedGroups,[selectedAlphabet]:all?c.filter(i=>!cg.includes(i)):Array.from(new Set([...c,...cg]))}); };
  const toggleAllKana = () => { const ag=[]; ['main','dakuten','combination'].forEach(c=>KANA_DEF[selectedAlphabet][c].forEach(g=>ag.push(g.id))); const c=selectedGroups[selectedAlphabet]; setSelectedGroups({...selectedGroups,[selectedAlphabet]:c.length===ag.length?[]:ag}); };
  const isAllSelected = () => { let t=0; ['main','dakuten','combination'].forEach(c=>t+=KANA_DEF[selectedAlphabet][c].length); return selectedGroups[selectedAlphabet].length===t; };
  const isCategorySelected = (cat) => { const cg=KANA_DEF[selectedAlphabet][cat].map(g=>g.id); return cg.length>0&&cg.every(i=>selectedGroups[selectedAlphabet].includes(i)); };

  const genNext = (pool) => { if(!pool||pool.length===0) return 0; let n; do{n=Math.floor(Math.random()*pool.length)}while(n===currentIndex&&pool.length>1); return n; };

  const genWeightedNext = (pool, curIdx) => {
    if(!pool||pool.length===0) return 0;
    if(pool.length===1) return 0;
    // SRS: prioritize due items first
    const dueItems = pool.map((k,i) => ({k,i})).filter(x => isDue(x.k));
    if (dueItems.length > 0) {
      // Pick from due items with mistake weighting
      const weights = dueItems.map(x => 1 + (x.k.mistakeCount||0) * 3);
      const total = weights.reduce((a,b)=>a+b,0);
      let attempts = 0;
      while(attempts < 20) {
        let r = Math.random()*total, acc=0;
        for(let j=0;j<dueItems.length;j++) { acc+=weights[j]; if(r<=acc) { if(dueItems[j].i !== curIdx || dueItems.length===1) return dueItems[j].i; break; } }
        attempts++;
      }
      const pick = dueItems[Math.floor(Math.random()*dueItems.length)];
      return pick.i;
    }
    // Fallback: normal weighted random
    const weights = pool.map(k => 1 + (k.mistakeCount||0) * 3);
    const total = weights.reduce((a,b) => a+b, 0);
    let attempts = 0;
    while(attempts < 20) {
      let r = Math.random() * total, acc = 0;
      for(let i=0; i<pool.length; i++) { acc += weights[i]; if(r <= acc) { if(i !== curIdx || pool.length === 1) return i; break; } }
      attempts++;
    }
    return genNext(pool);
  };

  const handleVirtualKey = (char) => {
    if (statusRef.current !== 'idle') return;
    const kana = currentKanaRef.current; if (!kana) return;

  const clearCanvas = () => { if(!canvasRef.current) return; const ctx=canvasRef.current.getContext('2d'); ctx.clearRect(0,0,canvasRef.current.width,canvasRef.current.height); };
